<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bureau AIME</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
@font-face{font-family:"Cal Sans";font-weight:400 900;font-display:swap;src:url("/fonts/CalSans-latin.woff2") format("woff2"),url("https://aimestudio.vercel.app/fonts/CalSans-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:"Cal Sans";font-weight:400 900;font-display:swap;src:url("/fonts/CalSans-latin-ext.woff2") format("woff2"),url("https://aimestudio.vercel.app/fonts/CalSans-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+A720-A7FF}
@font-face{font-family:"Inter Variable";font-weight:100 900;font-display:swap;src:url("/fonts/InterVariable-latin.woff2") format("woff2-variations"),url("https://aimestudio.vercel.app/fonts/InterVariable-latin.woff2") format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:"Inter Variable";font-weight:100 900;font-display:swap;src:url("/fonts/InterVariable-latin-ext.woff2") format("woff2-variations"),url("https://aimestudio.vercel.app/fonts/InterVariable-latin-ext.woff2") format("woff2-variations");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+A720-A7FF}
/* Layout : un bureau d'ordinateur. Barre de menus en haut, Dock en bas, fenêtres au milieu, dossiers à droite, « Pour continuer » en haut à droite. Sombre, accents en dégradés violet-bleu, un seul thème. */
:root{
 --desk:#0B0B0D; --paper:#18181B; --win:#141416; --raise:#222227; --ink:#ECECEF; --soft:#9B9BA5; --line:#2A2A31; --glass:rgba(22,22,26,.72); --sel:#7C5CFF;
 --acc:#7C5CFF; --acc2:#3B82F6; --grad:linear-gradient(135deg,#7C5CFF,#3B82F6); --ok:#22C55E; --warn:#F5A524; --hot:#F43F5E;
 --ui:"Inter Variable",Inter,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --display:"Cal Sans","Inter Variable",Inter,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
 color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 14px/1.4 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#desk{position:fixed;inset:0;background:
  radial-gradient(1100px 520px at 50% -8%,rgba(124,92,255,.42),transparent 62%),
  radial-gradient(800px 480px at 88% 18%,rgba(59,130,246,.22),transparent 60%),
  radial-gradient(700px 420px at 8% 92%,rgba(236,72,153,.12),transparent 60%),
  radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0) 0 0/22px 22px,
  linear-gradient(180deg,#151225 0%,#0B0B0D 62%)}
.wm{position:absolute;left:max(36px,env(safe-area-inset-left,0px));bottom:calc(110px + env(safe-area-inset-bottom,0px));font:900 clamp(60px,11vw,180px)/.8 var(--display);font-stretch:var(--dstretch,62%);letter-spacing:-.03em;text-transform:uppercase;color:rgba(255,255,255,.045);pointer-events:none}

/* barre de menus */
#menubar{position:fixed;inset:0 0 auto;z-index:9000;height:calc(30px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:4px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.06);color:var(--ink)}
#menubar button{border:0;background:none;padding:4px 9px;border-radius:5px;cursor:default;font:500 13px var(--ui);white-space:nowrap}
#menubar button:hover,#menubar button[aria-expanded=true]{background:rgba(255,255,255,.1)}
#menubar .logo{font:900 15px var(--display);letter-spacing:-.03em}
#menubar .logo sup{font-size:.5em}
#menubar .cur{font-weight:700}
#menubar .sp{flex:1}
#clock{font:500 12.5px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.menu{position:fixed;z-index:9500;min-width:230px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 24px 60px -12px rgba(0,0,0,.7);color:var(--ink)}
.menu button{display:flex;justify-content:space-between;gap:18px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px;font:500 13px var(--ui);cursor:default}
.menu button:hover{background:var(--acc);color:#fff}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu kbd{font:400 11.5px var(--mono);opacity:.6}

/* icônes du bureau */
#icons{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));z-index:5;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,96px);gap:6px 10px;height:calc(100% - 200px);direction:rtl}
.di{direction:ltr;width:92px;display:grid;justify-items:center;gap:4px;padding:6px 4px;border-radius:7px;border:0;background:none;cursor:default;text-align:center}
.di:hover{background:rgba(255,255,255,.06)}
.di.on{background:rgba(124,92,255,.22)}
.di span{color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.6);font:600 12px/1.2 var(--ui);max-width:88px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding:1px 4px;border-radius:4px}
.di.on span{background:var(--acc);color:#fff;text-shadow:none}
.ico-folder{width:56px;height:46px;display:block}

/* widget aujourd'hui */
#today{color:var(--ink);position:fixed;top:calc(48px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));z-index:4;width:250px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
#today .d{font:900 46px/.9 var(--display);font-stretch:70%;letter-spacing:-.02em}
#today .l{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
#today ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#today li{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px solid var(--line);padding-top:6px}
#today li b{min-width:0;flex:1;font:600 13px var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#today li.e b{white-space:normal;color:var(--soft);font-weight:500}
#today li em{font:500 11.5px var(--mono);font-style:normal;white-space:nowrap;color:#C4B5FD;background:rgba(124,92,255,.16);border-radius:5px;padding:1px 6px}

/* pour continuer */
#next{position:fixed;z-index:8000;top:calc(44px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:300px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 24px 60px -18px rgba(0,0,0,.75);display:grid;gap:8px;color:var(--ink)}
#next header{display:flex;justify-content:space-between;align-items:center}
#next header b{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
#next header button{border:0;background:none;color:var(--soft);font-size:18px;line-height:1;padding:0 4px;cursor:default}
#next .ctx{font:700 14px var(--ui);display:flex;align-items:center;gap:8px}#next .ctx::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
#next .sg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 10px;cursor:default}
#next .sg:hover{border-color:var(--acc);background:#26233A}
#next .sg small{display:block;font:400 11.5px var(--ui);color:var(--soft)}
#next .sg .ai{width:30px;height:30px;flex:none}

/* fenêtres */
.win{position:fixed;z-index:100;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 30px 90px -20px rgba(0,0,0,.8);min-width:320px;min-height:220px;color:var(--ink)}
.win.focus{box-shadow:0 44px 120px -20px rgba(0,0,0,.9),0 0 0 1px rgba(124,92,255,.55)}
.win.max{border-radius:0}
.win[hidden]{display:none!important}
.tb{flex:none;height:38px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--win);border-bottom:1px solid var(--line);cursor:default}
.lights{display:flex;gap:7px}
.lights button{width:13px;height:13px;border-radius:50%;border:0;padding:0;cursor:default;display:grid;place-items:center;font-size:9px;font-weight:700;line-height:1;color:transparent;background:#FF5F57}
.lights button:nth-child(2){background:#FEBC2E}.lights button:nth-child(3){background:#28C840}
.win:not(.focus) .lights button{background:#3A3A40}
.tb:hover .lights button{color:rgba(0,0,0,.55)}
.tb .tt{flex:1;text-align:center;font:500 13px var(--ui);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:52px}
.win iframe{flex:1;border:0;width:100%;background:#111113}
.win .shield{position:absolute;inset:38px 0 0;display:none}
body.dragging .win .shield{display:block}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}
.loading{position:absolute;inset:38px 0 0;display:grid;place-items:center;font:500 12px var(--mono);color:var(--soft);pointer-events:none}

/* dock */
#dock{position:fixed;z-index:8500;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:6px;padding:7px 9px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.1);border-radius:22px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none;box-shadow:0 20px 60px -10px rgba(0,0,0,.7)}
#dock button{position:relative;flex:none;width:56px;height:56px;border:0;background:none;padding:0;cursor:default;transition:transform .15s}
#dock button:hover{transform:translateY(-6px) scale(1.08)}
#dock button.on::after{content:"";position:absolute;left:50%;bottom:-5px;width:4px;height:4px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 0 6px #fff}
#dock .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.14);margin:4px 3px}
#dock .tip{position:fixed;z-index:9600;background:#232328;color:var(--ink);border:1px solid var(--line);font:600 12px var(--ui);padding:5px 9px;border-radius:6px;pointer-events:none;white-space:nowrap}
.ai{display:block;width:56px;height:56px}

/* Dossiers (Finder) */
.fd{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
.fd aside{background:var(--win);border-right:1px solid var(--line);overflow:auto;padding:10px 8px;display:grid;align-content:start;gap:2px}
.fd aside h4{margin:10px 8px 4px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.fd aside button{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px;font:500 13px var(--ui);cursor:default;min-width:0}
.fd aside button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fd aside button em{font:400 11px var(--mono);font-style:normal;color:var(--soft)}
.fd aside button:hover{background:rgba(255,255,255,.05)}
.fd aside button.on{background:rgba(124,92,255,.2);color:#fff}
.fd aside button.on em{color:inherit;opacity:.7}
.fd aside button.drop{outline:2px dashed var(--acc)}
.fd aside .tw{padding-left:22px}
.fd main{display:flex;flex-direction:column;min-width:0;min-height:0}
.fd .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fd .crumbs{flex:1;font:600 13px var(--ui);display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.fd .crumbs button{border:0;background:none;padding:2px 4px;border-radius:4px;cursor:default;font:inherit}
.fd .crumbs button:hover{background:rgba(255,255,255,.06)}
.fd .crumbs i{color:var(--soft);font-style:normal}
.pill{border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 12px var(--ui);cursor:default;white-space:nowrap}
.pill:hover{border-color:var(--soft)}
.pill.dark{background:var(--grad);color:#fff;border-color:transparent}
.fd .grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));align-content:start;gap:8px}
.it{display:grid;justify-items:center;gap:5px;padding:8px 4px;border:0;background:none;border-radius:8px;cursor:default;text-align:center;min-width:0}
.it:hover{background:rgba(255,255,255,.05)}
.it.on{background:rgba(124,92,255,.2)}
.it b{font:600 12px/1.25 var(--ui);max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.it small{font:400 10.5px var(--mono);color:var(--soft)}
.it .doc{width:46px;height:58px;border:1px solid #3A3A42;border-radius:4px;background:linear-gradient(180deg,#26262C,#1C1C21);color:var(--ink);position:relative;display:grid;place-items:center;font:600 9px var(--mono);overflow:hidden}
.it .doc::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.it .doc.land{width:62px;height:44px}
.it .doc i{font-style:normal;padding:0 3px;text-align:center;line-height:1.15}
.it.drag{opacity:.4}
.fd .empty{grid-column:1/-1;padding:30px 10px;color:var(--soft);font-size:13.5px;text-align:center}
.fd .info{border-top:1px solid var(--line);padding:8px 12px;font:400 12px var(--ui);color:var(--soft);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.rn{font:600 12px var(--ui);background:var(--raise);color:var(--ink);border:1px solid var(--acc);border-radius:4px;padding:2px 4px;width:100%;text-align:center}


/* Moteurs */
.mo{flex:1;display:grid;grid-template-columns:210px minmax(0,1fr) minmax(0,1.1fr);min-height:0}
.mo-load{grid-column:1/-1;display:grid;place-items:center;color:var(--soft);font:500 13px var(--mono)}
.mo-f{background:var(--win);border-right:1px solid var(--line);overflow:auto;padding:12px 8px;display:grid;align-content:start;gap:2px}
.mo-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 4px 6px}
.mo-stats div{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px}
.mo-stats b{display:block;font:700 22px var(--ui);letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mo-stats span{font:500 11px var(--mono);color:var(--soft)}
.mo-f h4{margin:10px 8px 4px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.mo-f button{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:6px 8px;border-radius:7px;font:500 13px var(--ui);color:var(--ink);cursor:default}
.mo-f button i{width:9px;height:9px;border-radius:3px;flex:none}
.mo-f button span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mo-f button em{font:400 11px var(--mono);font-style:normal;color:var(--soft)}
.mo-f button:hover{background:rgba(255,255,255,.05)}.mo-f button.on{background:rgba(124,92,255,.2)}
.mo-l{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.mo-q{padding:10px;border-bottom:1px solid var(--line)}
.mo-q input{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--ink);font:500 13px var(--ui)}
.mo-q input:focus{outline:none;border-color:var(--acc)}
.mo-list{flex:1;overflow:auto}
.mo-it{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;color:var(--ink);cursor:default}
.mo-it:hover{background:rgba(255,255,255,.03)}.mo-it.on{background:#1E1C2B;box-shadow:inset 3px 0 0 var(--acc)}
.mo-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.mo-tx{display:grid;gap:3px;min-width:0}
.mo-tx b{font:600 14px var(--ui)}
.mo-tx small{color:var(--soft);font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mo-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.mo-meta code,.mo-src code{font:500 11px var(--mono);color:#C4B5FD}
.chip{font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--soft)}
.mo-none{padding:24px;color:var(--soft)}
.mo-d{overflow:auto;padding:22px;display:grid;align-content:start;gap:16px}
.mo-d .k{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.mo-d h3{margin:6px 0 6px;font:700 24px/1.15 var(--ui);letter-spacing:-.02em}
.mo-d header p{margin:0;color:var(--soft)}
.mo-io{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.mo-io>div:not(.mo-arr){background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px}
.mo-io p{margin:6px 0 0;font-size:13.5px}
.mo-arr{display:grid;place-items:center;color:var(--acc);font-size:20px}
.mo-ex{border-radius:14px;padding:16px;background:linear-gradient(#1A1726,#1A1726) padding-box,var(--grad) border-box;border:1px solid transparent}
.mo-ex p{margin:8px 0 0;font:500 15px/1.5 var(--ui)}
.mo-src{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.mo-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mo-res{margin:0;color:var(--soft);font-size:13px}
.mo-src ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.mo-src a.pill{text-decoration:none}
@media(max-width:1000px){.mo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mo-f{display:none}}
@media(max-width:760px){.mo{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}.mo-l{border-right:0;border-bottom:1px solid var(--line)}}

/* téléphone */
@media(max-width:760px){
 #today,#icons{display:none}
 .win{left:0!important;top:calc(30px + env(safe-area-inset-top,0px))!important;width:100%!important;height:calc(100% - 30px - 88px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))!important;border-radius:0;min-width:0}
 .rz{display:none}
 .tb .tt{margin-right:0}
 #dock{left:8px;right:8px;transform:none;justify-content:flex-start}
 #dock button{width:48px;height:48px}.ai{width:48px;height:48px}
 #next{left:10px;right:10px;width:auto;top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .fd{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.fd aside{display:flex;flex-wrap:nowrap;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;gap:4px}.fd aside h4{display:none}.fd aside button{flex:none;width:auto}.fd .info span+span{display:none}
 #menubar [data-menu=file],#menubar [data-menu=win]{display:none}
 .wm{font-size:64px}
}
@media(prefers-reduced-motion:reduce){#dock button{transition:none}}

/* fond de pixels vivant + univers */
#px{position:absolute;inset:0;width:100%;height:100%;display:block}
#uv{position:fixed;z-index:3;left:max(36px,env(safe-area-inset-left,0px));bottom:calc(262px + env(safe-area-inset-bottom,0px));width:min(560px,46vw);display:grid;gap:12px;color:var(--ink);pointer-events:none}
#uv>*{pointer-events:auto}
#uv .ey{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#uv .ey i{width:22px;height:2px;background:var(--uc1,#7C5CFF);display:inline-block}
#uv h1{margin:0;font:900 clamp(56px,8.4vw,132px)/.84 var(--display);font-stretch:var(--dstretch,62%);letter-spacing:-.025em;text-transform:uppercase;text-wrap:balance;text-shadow:0 10px 60px rgba(0,0,0,.5)}
#uv .so{font:600 clamp(16px,1.4vw,20px)/1.25 var(--ui);color:var(--uc1,#C4B5FD)}
#uv p{margin:0;font:400 15px/1.55 var(--ui);color:#C9C9D2;max-width:52ch;text-wrap:pretty}
#uv .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
#uv .go{border:0;border-radius:999px;padding:11px 18px;font:700 14px var(--ui);color:#fff;background:linear-gradient(135deg,var(--uc1,#7C5CFF),var(--uc2,#3B82F6));cursor:pointer;box-shadow:0 12px 30px -10px var(--uc1,#7C5CFF)}
#uv .go:hover{filter:brightness(1.1)}
#uv .st{font:500 12px var(--mono);color:var(--soft)}
.uva{position:fixed;z-index:6;bottom:calc(282px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(20,20,24,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);font:400 22px/1 var(--ui);display:grid;place-items:center;cursor:pointer}
.uva:hover{background:rgba(255,255,255,.14)}
#uvp{right:max(186px,calc(env(safe-area-inset-right,0px) + 174px))}
#uvn{right:max(130px,calc(env(safe-area-inset-right,0px) + 118px))}
#ucar{position:fixed;z-index:6;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-block:10px;padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px))}
#ucar::-webkit-scrollbar{display:none}
.uc{flex:none;scroll-snap-align:center;width:184px;height:128px;position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#121216;padding:0;cursor:pointer;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s}
.uc canvas{position:absolute;inset:0;width:100%;height:100%}
.uc span{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(180deg,transparent,rgba(8,8,10,.92));display:grid;gap:1px}
.uc b{font:800 16px/1 var(--display);font-stretch:75%;text-transform:uppercase;letter-spacing:.01em;color:#fff}
.uc small{font:500 10.5px var(--mono);color:#B5B5BF}
.uc:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.3)}
.uc.on{border-color:var(--uc1,#7C5CFF);box-shadow:0 0 0 2px var(--uc1,#7C5CFF),0 18px 40px -14px var(--uc1,#7C5CFF)}

/* fenêtre Univers : mosaïque */
.un{flex:1;position:relative;display:flex;flex-direction:column;min-height:0;background:#0F0F12}
.un-b{flex:1;overflow:auto;min-height:0}
.un-h{position:relative;min-height:230px;display:flex;align-items:flex-end;padding:22px 26px;overflow:hidden;border-bottom:1px solid var(--line)}
.un-h canvas{position:absolute;inset:0;width:100%;height:100%}
.un-h::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,15,18,.96) 0%,rgba(15,15,18,.75) 45%,rgba(15,15,18,.15) 100%)}
.un-h>div{position:relative;z-index:1;display:grid;gap:8px;max-width:640px}
.un-h .k{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--uc1)}
.un-h h2{margin:0;font:900 64px/.86 var(--display);font-stretch:var(--dstretch,62%);text-transform:uppercase;letter-spacing:-.02em}
.un-h p{margin:0;color:#C9C9D2;font-size:14.5px;line-height:1.5}
.un-sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.un-sw button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 12px var(--ui);cursor:pointer}
.un-sw button.on{background:var(--uc1);border-color:transparent;color:#0B0B0D}
.un-nav{position:sticky;top:0;z-index:2;display:flex;gap:4px;overflow-x:auto;padding:8px 18px;background:rgba(15,15,18,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);scrollbar-width:none}
.un-nav a{flex:none;color:var(--soft);text-decoration:none;font:600 12.5px var(--ui);padding:6px 10px;border-radius:7px}
.un-nav a:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.un-s{padding:22px 26px 6px;display:grid;gap:12px}
.un-s>header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.un-s h3{margin:0;font:800 28px/1 var(--display);font-stretch:70%;text-transform:uppercase;letter-spacing:-.01em}
.un-s header p{margin:0;color:var(--soft);font-size:13.5px}
.un-s header em{font:500 11px var(--mono);font-style:normal;color:var(--soft);margin-left:auto}
.mz{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.mt{position:relative;display:grid;align-content:start;gap:6px;min-height:150px;text-align:left;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px 12px 34px;color:var(--ink);cursor:pointer;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 26%,#151518),#141417 70%);overflow:hidden;transition:transform .15s,border-color .15s}
.mt::before{content:"";position:absolute;right:-1px;top:-1px;width:38px;height:38px;background:radial-gradient(circle at 2px 2px,var(--tc) 1.6px,transparent 2px) 0 0/8px 8px;opacity:.55}
.mt:hover{transform:translateY(-2px);border-color:var(--tc)}
.mt .f{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tc)}
.mt b{font:700 14.5px/1.2 var(--ui)}
.mt small{color:#A8A8B2;font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mt .src{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:6px;align-items:center;font:500 10.5px var(--mono);color:#8E8E99;white-space:nowrap;overflow:hidden}
.mt .src i{width:7px;height:7px;border-radius:50%;flex:none}
.pr{display:grid;gap:10px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:14px;padding:14px}
.pr>div{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pr>div b{font:700 16px var(--ui)}
.pr>div span{color:var(--soft);font-size:13px}
.pr ol{list-style:none;margin:0;padding:0;display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.pr li{display:flex;align-items:stretch;flex:none}
.pr li+li::before{content:"→";align-self:center;color:var(--uc1);font-size:18px;padding:0 8px}
.ps{width:178px;display:grid;align-content:start;gap:4px;text-align:left;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:10px;background:#18181C;color:var(--ink);cursor:pointer}
.ps:hover{border-color:var(--uc1)}
.ps .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:700 12px var(--mono);color:#0B0B0D;background:var(--uc1)}
.ps em{font:600 10.5px var(--mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.ps b{font:600 13px/1.25 var(--ui)}
.ps small{font:500 10.5px var(--mono);color:#8E8E99}
.un-d{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);z-index:5;background:#141417;border-left:1px solid var(--line);box-shadow:-30px 0 60px -20px rgba(0,0,0,.7);overflow:auto}
.un-d .mo-d{overflow:visible}
.un-d .x{position:sticky;top:0;float:right;margin:10px;border:0;background:var(--raise);color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;z-index:2}
.un-pad{height:28px}
@media(max-width:1100px){#uv{width:min(520px,60vw)}}
@media(max-height:820px){.uva{bottom:calc(258px + env(safe-area-inset-bottom,0px))}#uv{bottom:calc(240px + env(safe-area-inset-bottom,0px))}#uv p{display:none}#today ul,#today .l+ul{display:none}#today{gap:4px}}
@media(max-width:760px){
 #uv{left:16px;right:16px;width:auto;bottom:calc(250px + env(safe-area-inset-bottom,0px))}
 #uv h1{font-size:64px}#uv p{display:none}
 .uva{display:none}
 #ucar{padding-left:16px;padding-right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .uc{width:150px;height:108px}
 .un-h{min-height:190px;padding:18px}.un-h h2{font-size:48px}.un-s{padding:18px 14px 4px}
 .mz{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}


/* ===== v2 : disposition — outils à gauche, rail (Dock / palette) à droite, timeline unique en bas ===== */
:root{--tlh:108px;--railw:68px;--toolw:56px}
#today{display:none!important}
/* rail droit */
#rail{position:fixed;z-index:8500;right:max(10px,env(safe-area-inset-right,0px));top:calc(40px + env(safe-area-inset-top,0px));bottom:calc(var(--tlh) + 20px + env(safe-area-inset-bottom,0px));width:var(--railw);display:flex;flex-direction:column;gap:6px;padding:7px 6px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.1);border-radius:22px;box-shadow:0 20px 60px -10px rgba(0,0,0,.7)}
.rl-mode{display:grid;gap:3px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.rl-mode button{border:0;background:none;color:var(--soft);font:700 9.5px/1 var(--mono);letter-spacing:.04em;padding:6px 0;border-radius:8px;cursor:pointer}
.rl-mode button:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.rl-mode button[aria-pressed=true]{color:#0B0B0D;background:var(--mc,#fff)}
#dock{position:static;transform:none;left:auto;bottom:auto;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0;max-width:none;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
#dock button{width:50px;height:50px}#dock .ai{width:50px;height:50px}
#dock button:hover{transform:translateX(-5px) scale(1.06)}
#dock button.on::after{left:-5px;top:50%;bottom:auto;transform:translateY(-50%)}
#dock .sep{width:auto;height:1px;align-self:stretch;margin:3px 6px}
#sw{flex:1;min-height:0;overflow-y:auto;display:grid;align-content:start;gap:4px;scrollbar-width:none}
#sw::-webkit-scrollbar{display:none}
#sw input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:7px;color:var(--ink);font:500 10.5px var(--mono);padding:5px 4px;text-align:center}
.swc{display:grid;gap:2px;justify-items:center;border:0;background:none;padding:2px 0;cursor:pointer;color:var(--soft)}
.swc i{width:40px;height:26px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.swc b{font:600 9px/1.1 var(--mono);text-align:center;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swc:hover b,.swc.on b{color:var(--ink)}
.swc.on i{box-shadow:0 0 0 2px #fff}
/* capsule d'outils à gauche */
#tools{max-height:calc(100vh - var(--tlh) - 80px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:fixed;z-index:8400;left:max(10px,env(safe-area-inset-left,0px));top:50%;transform:translateY(calc(-50% - var(--tlh)/2));width:var(--toolw);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.1);border-radius:999px;box-shadow:0 20px 60px -10px rgba(0,0,0,.7)}
#tools .tm{font:700 8.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mc,#C4B5FD);writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 0 8px}
#tools::-webkit-scrollbar{display:none}
#tools button{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative}
#tools button:hover{background:rgba(255,255,255,.1)}
#tools button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools hr{width:22px;border:0;border-top:1px solid rgba(255,255,255,.12);margin:2px 0}
/* timeline unique */
#tl{position:fixed;z-index:8450;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));height:var(--tlh);display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid rgba(255,255,255,.1);border-radius:20px;box-shadow:0 20px 60px -10px rgba(0,0,0,.7);overflow:hidden}
.tl-l{display:grid;align-content:center;gap:5px;padding:8px 12px;border-right:1px solid rgba(255,255,255,.08);min-width:0;width:212px}
.tl-l .ctx{font:600 12.5px/1.2 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-l .ctx small{display:block;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mc,#C4B5FD)}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.05);border-radius:8px;padding:2px}
.seg button{flex:1;border:0;background:none;color:var(--soft);font:600 10.5px var(--ui);padding:4px 5px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.14);color:var(--ink)}
.tl-l .row{display:flex;gap:4px}
.tl-l .row .seg{flex:1}
.tl-l .ib{border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:7px;width:26px;height:24px;font:600 14px/1 var(--ui);cursor:pointer;display:grid;place-items:center}
.tl-track{position:relative;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;cursor:grab}
.tl-track.drag{cursor:grabbing}
.tl-in{position:relative;height:100%}
.tl-tick{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.06)}
.tl-tick.maj{border-left-color:rgba(255,255,255,.16)}
.tl-tick span{position:absolute;top:6px;left:5px;font:500 10px var(--mono);color:var(--soft);white-space:nowrap}
.tl-tick.maj span{color:var(--ink)}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:#F43F5E;box-shadow:0 0 12px #F43F5E;z-index:2}
.tl-cur{position:absolute;top:0;bottom:0;width:2px;background:#7C5CFF;box-shadow:0 0 12px #7C5CFF;z-index:2;pointer-events:none}.tl-cur span{position:absolute;bottom:16px;left:5px;font:600 9.5px var(--mono);color:#C4B5FD;white-space:nowrap;background:rgba(17,17,20,.8);padding:1px 4px;border-radius:4px}
.tl-now::before{content:"maintenant";position:absolute;bottom:4px;left:5px;font:600 9.5px var(--mono);color:#FDA4AF;white-space:nowrap}
.tl-it{position:absolute;height:20px;display:flex;align-items:center;gap:5px;padding:0 7px 0 4px;border-radius:6px;background:color-mix(in srgb,var(--tc) 22%,#16161A);border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);color:var(--ink);font:600 11px var(--ui);white-space:nowrap;cursor:pointer;max-width:240px;overflow:hidden;text-overflow:ellipsis;z-index:1}
.tl-it::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tc);flex:none}
.tl-it.done{opacity:.5;text-decoration:line-through}
.tl-it.demo{border-style:dashed}
.tl-it:hover{z-index:3;max-width:none}
/* timeline dépliée */
#tlx{position:fixed;z-index:8460;left:calc(var(--toolw) + 22px);right:calc(var(--railw) + 22px);bottom:calc(var(--tlh) + 18px + env(safe-area-inset-bottom,0px));height:min(560px,calc(100vh - var(--tlh) - 70px));display:grid;grid-template-columns:minmax(0,1fr) 320px;background:#111114;border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 90px -20px rgba(0,0,0,.85);overflow:hidden}
.tx-v{position:relative;min-width:0;min-height:0;overflow:auto}
.tx-v canvas{display:block}
.tx-e{border-left:1px solid var(--line);overflow:auto;padding:18px;display:grid;align-content:start;gap:12px;background:#141417}
.tx-e .k{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mc,#C4B5FD)}
.tx-e h3{margin:0;font:800 30px/.95 var(--display);font-stretch:70%;text-transform:uppercase}
.tx-e p{margin:0;color:#C9C9D2;font-size:13.5px;line-height:1.5}
.tx-e ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.tx-e li{font-size:12.5px;color:var(--soft);display:flex;gap:7px;align-items:baseline}
.tx-e li i{width:8px;height:8px;border-radius:2px;flex:none;transform:translateY(1px)}
.tx-e li b{color:var(--ink);font-weight:600}
.tx-x{position:absolute;top:10px;right:10px;z-index:3}
.tgrid{display:grid;grid-template-columns:52px repeat(7,minmax(90px,1fr));font:500 10.5px var(--mono);color:var(--soft);min-width:700px}
.tgrid>div{border-right:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);min-height:30px;padding:3px;position:relative}
.tgrid .hd{position:sticky;top:0;background:#111114;z-index:2;color:var(--ink);font-weight:600;padding:8px 6px}
.tgrid .hd.today{color:#FDA4AF}
.tgrid .gi{display:block;margin-bottom:2px;padding:2px 5px;border-radius:5px;background:color-mix(in srgb,var(--tc) 24%,#18181C);border-left:3px solid var(--tc);color:var(--ink);font:600 10.5px/1.25 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tlf{display:grid;gap:8px}
.tlf label{display:grid;gap:3px;font:500 11px var(--mono);color:var(--soft)}
.tlf input,.tlf select{background:var(--raise);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:500 13px var(--ui);padding:7px 9px}
.tlf .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl-pop{position:fixed;z-index:9600;max-width:300px;background:#1B1B20;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 20px 50px -10px rgba(0,0,0,.8);display:grid;gap:6px;font-size:13px}
.tl-pop b{font-size:14px}.tl-pop small{color:var(--soft)}
.tl-pop .row{display:flex;gap:6px;flex-wrap:wrap}
#toast{position:fixed;z-index:9700;left:50%;bottom:calc(var(--tlh) + 30px);transform:translateX(-50%);background:#1F1F25;border:1px solid var(--line);color:var(--ink);font:600 13px var(--ui);padding:9px 14px;border-radius:999px;box-shadow:0 10px 30px -8px rgba(0,0,0,.8);pointer-events:none}
/* fonds d'écran */
#wpsel{position:fixed;z-index:7;top:calc(40px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;background:rgba(20,20,24,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:999px}
#wpsel button{border:0;background:none;color:var(--soft);font:600 12px var(--ui);padding:6px 12px;border-radius:999px;cursor:pointer}
#wpsel button[aria-pressed=true]{background:#fff;color:#0B0B0D}
#uv{left:calc(var(--toolw) + 34px);bottom:calc(var(--tlh) + 186px + env(safe-area-inset-bottom,0px))}
body.wp-other #uv{bottom:calc(var(--tlh) + 40px + env(safe-area-inset-bottom,0px))}
#uv ul.use{margin:0;padding:0;list-style:none;display:grid;gap:5px;max-width:52ch}
#uv ul.use li{font:400 13.5px/1.4 var(--ui);color:#C9C9D2;display:flex;gap:8px}
#uv ul.use li::before{content:"";width:6px;height:6px;margin-top:7px;flex:none;background:var(--uc1);border-radius:1px}
#uv .ghost{border:1px solid rgba(255,255,255,.2);background:rgba(20,20,24,.5);color:var(--ink);border-radius:999px;padding:10px 15px;font:600 13px var(--ui);cursor:pointer}

.ov-top .tabs button{border:0;background:none;color:var(--soft);font:600 13.5px var(--ui);padding:7px 12px;border-radius:8px;cursor:pointer}
.ov-top .tabs button[aria-pressed=true]{color:var(--ink);background:rgba(255,255,255,.08)}
.ov-top input{width:min(280px,40vw);background:var(--raise);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:500 13px var(--ui);padding:8px 11px}
.ov-h h2{margin:0;font:700 36px/1.05 var(--ui);letter-spacing:-.02em}
.ov-h p{margin:8px 0 0;color:var(--soft);max-width:60ch;font-size:15.5px;line-height:1.5}
.lib-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 20px}
.lib-cols b{display:block;font:600 14px var(--ui);margin-bottom:6px}
.lib-cols button{display:block;border:0;background:none;color:var(--soft);font:500 13.5px var(--ui);padding:3px 0;cursor:pointer;text-align:left}
.lib-cols button:hover,.lib-cols button[aria-pressed=true]{color:var(--ink)}
.lib-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lib-bar .seg{flex:none}
.lib-bar .sp{flex:1}
.lib-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px 18px}
.lt{display:grid;gap:8px;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;padding:0}
.lt .pv{aspect-ratio:4/3;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:var(--bgc,#1A1A1E);transition:transform .2s}
.lt:hover .pv{transform:translateY(-3px)}
.lt .pv img{max-width:72%;max-height:84%;object-fit:contain;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);border-radius:3px}
.lt .meta{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lt b{display:block;font:600 14.5px var(--ui)}.lt small{color:var(--soft);font-size:13px}
.price{flex:none;font:600 12px var(--ui);padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.08)}
.price.pro{background:linear-gradient(135deg,#7C5CFF,#22D3EE);color:#fff}
.lib-d{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.lib-d .big{border-radius:16px;background:var(--bgc,#1A1A1E);display:grid;place-items:center;padding:30px;min-height:420px}
.lib-d .big img{max-width:100%;max-height:70vh;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.lib-d h3{margin:0;font:700 30px/1.1 var(--ui);letter-spacing:-.02em}
.lib-d p{color:#C9C9D2;line-height:1.55}
/* cartes universelles */
.ucard{position:relative;aspect-ratio:1.586;border-radius:18px;overflow:hidden;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(135deg,var(--c0),var(--c1));box-shadow:0 20px 50px -20px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.18);text-align:left;border:0;cursor:pointer;font:inherit;transition:transform .2s}
.ucard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1.5px 1.5px,rgba(255,255,255,.22) 1.2px,transparent 1.6px) 0 0/9px 9px;mix-blend-mode:overlay;pointer-events:none}
.ucard::after{content:"";position:absolute;right:-30%;top:-40%;width:80%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);pointer-events:none}
.ucard:hover{transform:translateY(-4px) rotate(-.5deg)}
.ucard .t{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ucard .t span{font:800 13px var(--display);letter-spacing:.06em}
.ucard .t em{font:600 10px var(--mono);font-style:normal;background:rgba(0,0,0,.28);padding:3px 7px;border-radius:999px}
.ucard .chip{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#F7E7B4,#C9A96E);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.ucard .b{position:relative}
.ucard .b h4{margin:0;font:900 26px/.95 var(--display);font-stretch:68%;text-transform:uppercase;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.ucard .b small{display:block;margin-top:4px;font:500 11px var(--mono);opacity:.9}
.ucard.on{outline:3px solid #fff;outline-offset:3px}
#cardwp{position:fixed;z-index:2;left:calc(var(--toolw) + 24px);right:calc(var(--railw) + 24px);top:calc(40px + env(safe-area-inset-top,0px));bottom:calc(var(--tlh) + 24px + env(safe-area-inset-bottom,0px));overflow:auto;scrollbar-width:none;display:grid;align-content:start;gap:16px;padding:8px 4px 20px}
#cardwp::-webkit-scrollbar{display:none}
#cardwp h2{margin:0;font:900 clamp(40px,5vw,72px)/.86 var(--display);font-stretch:var(--dstretch,62%);text-transform:uppercase}
#cardwp p{margin:0;color:#C9C9D2;max-width:64ch;line-height:1.5}
#cardwp .k{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
body.wp-cards #uv,body.wp-cards #ucar,body.wp-cards .uva,body.wp-cards #icons{display:none!important}
.cdt{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:30px;align-items:start}
.cdt .ucard{cursor:default}.cdt .ucard:hover{transform:none}
.cdt h3{margin:0 0 6px;font:700 28px/1.1 var(--ui);letter-spacing:-.02em}
.cdt .sec{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.cdt .sec>b{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.cdt ul{margin:0;padding-left:18px;color:#D4D4DA;line-height:1.55;font-size:14px}
.appsr{display:flex;flex-wrap:wrap;gap:8px}
.appsr label{display:grid;justify-items:center;gap:3px;font:500 10.5px var(--ui);color:var(--soft);width:64px;text-align:center;position:relative;cursor:pointer}
.appsr label .ai{width:44px;height:44px}
.appsr label input{position:absolute;opacity:0}
.appsr label.off .ai{opacity:.25;filter:grayscale(1)}
.appsr label .lk{position:absolute;top:-4px;right:6px;font-size:11px}
.cx{display:grid;gap:8px}
.cxi{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cxi input{grid-row:span 3;margin-top:3px;width:18px;height:18px;accent-color:#22C55E}
.cxi b{font:600 14px var(--ui)}.cxi span{color:#C9C9D2;font-size:13px;line-height:1.45}.cxi em{font-style:normal;color:#FBBF24;font-size:12.5px}
.chipsr{display:flex;flex-wrap:wrap;gap:6px}.chipsr span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:500 12.5px var(--ui);color:#D4D4DA}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm label{display:grid;gap:4px;font:500 11.5px var(--mono);color:var(--soft)}
.frm input{background:var(--raise);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:500 13.5px var(--ui);padding:8px 10px}
.frm input[type=color]{padding:2px;height:38px}
.note{font-size:12.5px;color:var(--soft);line-height:1.5}
/* qui utilise le Bureau */
#who{position:fixed;inset:0;z-index:9900;background:radial-gradient(1000px 600px at 50% 0%,rgba(124,92,255,.25),transparent 70%),#09090B;display:grid;place-items:center;padding:20px;color:var(--ink)}
#who .w{display:grid;gap:30px;justify-items:center;text-align:center}
#who h2{margin:0;font:700 clamp(28px,4vw,46px) var(--ui);letter-spacing:-.02em}
#who .ppl{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
#who .pp{display:grid;gap:10px;justify-items:center;border:0;background:none;color:var(--soft);font:600 14px var(--ui);cursor:pointer}
#who .pp i{width:120px;height:120px;border-radius:16px;display:grid;place-items:center;font:900 40px var(--display);font-style:normal;color:#fff;background:linear-gradient(135deg,var(--c0),var(--c1));transition:transform .2s,box-shadow .2s}
#who .pp:hover i{transform:scale(1.06);box-shadow:0 0 0 3px #fff}
#who .pp:hover{color:#fff}
#who .pin{display:flex;gap:8px}#who .pin input{width:52px;height:60px;text-align:center;font:700 26px var(--mono);background:var(--raise);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
#menubar .cardc{display:flex;align-items:center;gap:6px;font:600 12px var(--ui)!important}
#menubar .cardc i{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--c0),var(--c1))}
/* identité */
.id{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr) 300px;min-height:0;background:#0F0F12}
.id aside{overflow:auto;padding:12px;display:grid;align-content:start;gap:6px;border-right:1px solid var(--line);background:var(--win)}
.id aside h4{margin:8px 4px 2px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.id aside button.ds{display:flex;gap:8px;align-items:center;border:1px solid transparent;background:none;color:var(--ink);text-align:left;padding:7px 8px;border-radius:9px;font:600 13px var(--ui);cursor:pointer}
.id aside button.ds i{display:flex;flex:none}.id aside button.ds i b{width:10px;height:18px}
.id aside button.ds i b:first-child{border-radius:4px 0 0 4px}.id aside button.ds i b:last-child{border-radius:0 4px 4px 0}
.id aside button.ds.on{background:rgba(124,92,255,.18);border-color:rgba(124,92,255,.5)}
.id .pv{overflow:auto;padding:22px;min-width:0}
.board{border-radius:16px;padding:28px;display:grid;gap:22px;background:var(--p);color:var(--i);font-family:var(--fb);box-shadow:0 30px 70px -30px rgba(0,0,0,.8)}
.board .bwm{font-family:var(--fd);font-weight:var(--fw);text-transform:var(--tt);letter-spacing:var(--ls);font-size:clamp(40px,5vw,72px);line-height:.95;margin:0}
.board .bl{opacity:.75;font-size:15px;margin:0}
.board .pal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.board .pal div{border-radius:calc(var(--r) * .6);aspect-ratio:1.2;display:flex;align-items:flex-end;padding:8px;font:600 11px var(--mono);box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.board .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.board .btnp{border:0;border-radius:var(--r);padding:12px 20px;font:700 14px var(--fb);background:var(--c1);color:var(--on1)}
.board .btns{border:2px solid var(--c1);border-radius:var(--r);padding:10px 18px;font:700 14px var(--fb);background:transparent;color:var(--i)}
.board .spec{font-family:var(--fd);font-weight:var(--fw);font-size:96px;line-height:.9}
.board .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.board .bc{aspect-ratio:1.7;border-radius:calc(var(--r) * .7);padding:16px;display:flex;flex-direction:column;justify-content:space-between;background:var(--c1);color:var(--on1)}
.board .bc b{font-family:var(--fd);font-weight:var(--fw);text-transform:var(--tt);font-size:22px}
.board .hero{border-radius:calc(var(--r) * .7);padding:18px;background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--on1);display:grid;gap:8px}
.board .hero b{font-family:var(--fd);font-weight:var(--fw);text-transform:var(--tt);font-size:clamp(16px,1.8vw,26px);line-height:1.05;overflow-wrap:anywhere}
.id .st{overflow:auto;padding:14px;display:grid;align-content:start;gap:12px;border-left:1px solid var(--line);background:#141417}
.id .st .k{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.id .st label{display:grid;gap:4px;font:500 12px var(--ui);color:var(--soft)}
.id .st input,.id .st select{background:var(--raise);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:500 13px var(--ui);padding:7px 9px}
.id .st input[type=color]{height:34px;padding:2px}
.id .cols{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.id .cols label{font-size:10.5px}
.ctr{display:grid;gap:4px;font:500 12px var(--ui)}
.ctr span{display:flex;justify-content:space-between}
.ok{color:#4ADE80}.ko{color:#F87171}
.tos{display:grid;gap:4px}.tos label{display:flex!important;gap:8px;align-items:center;font:500 13px var(--ui)!important;color:var(--ink)!important}
@media(max-width:900px){.lib-d,.cdt{grid-template-columns:minmax(0,1fr)}.id{grid-template-columns:minmax(0,1fr)}.id aside{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.id aside h4{display:none}.id .st{border-left:0;border-top:1px solid var(--line)}}

/* ===== v9 : barre noire, sobre ; orbe AIME ===== */
#menubar{background:#000!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-bottom:1px solid #1C1C20!important;height:calc(34px + env(safe-area-inset-top,0px))!important;gap:2px}
#menubar button{font-size:13px}
#menubar .st{gap:6px!important;margin-left:8px}
#menubar .sb{width:30px!important;height:28px!important;border-radius:8px!important;color:#C9C9D2}
#menubar .sb:hover{color:#fff;background:rgba(255,255,255,.1)}
#menubar .sb svg{width:17px!important;height:17px!important;stroke-width:1.7!important}
#menubar .sb.lang{font:600 11px var(--mono)!important;width:30px!important;padding:0!important;letter-spacing:.04em}
#menubar .sb em{top:1px;right:2px;min-width:8px;height:8px;padding:0;font-size:0;border-radius:50%;box-shadow:0 0 0 2px #000}
#menubar .orbslot{width:34px;height:28px;flex:none}
#menubar .sep2{width:1px;height:16px;background:#2A2A31;margin:0 4px}
#clock{margin-left:4px;font:500 12.5px var(--mono)!important;color:#C9C9D2}
#icons{display:none!important}
#orbf{position:fixed;z-index:9850;width:26px;height:26px;margin:-13px 0 0 -13px;border:0;padding:0;border-radius:50%;cursor:grab;background:conic-gradient(from 0deg,#FB7185,#F59E0B,#7C5CFF,#22D3EE,#FB7185);box-shadow:0 0 14px rgba(124,92,255,.65);animation:orb 6s linear infinite;touch-action:none}
#orbf.free{width:44px;height:44px;margin:-22px 0 0 -22px;box-shadow:0 0 0 3px rgba(0,0,0,.4),0 10px 40px rgba(124,92,255,.8)}
#orbf.att{width:30px;height:30px;margin:-15px 0 0 -15px}
#orbf:active{cursor:grabbing}
#orbf::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(255,255,255,.25);opacity:0}
#orbf.free::after{opacity:1;animation:orbr 2.4s ease-out infinite}
@keyframes orbr{from{transform:scale(.8);opacity:.7}to{transform:scale(1.6);opacity:0}}
#orbtip{position:fixed;z-index:9860;max-width:300px;background:rgba(18,18,22,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 12px;display:grid;gap:5px;color:var(--ink);box-shadow:0 20px 50px -10px rgba(0,0,0,.8)}
#orbtip b{font:600 14px var(--ui)}#orbtip span{font-size:12.5px;line-height:1.45;color:#C9C9D2}#orbtip small{font-size:10.5px;color:var(--soft)}
#orbtip .oa{display:grid;gap:4px;margin-top:4px}
#orbtip .oa button{text-align:left;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--ink);border-radius:9px;padding:7px 10px;font:600 12.5px var(--ui);cursor:pointer}
#orbtip .oa button:hover{background:var(--grad);border-color:transparent;color:#fff}
@media(max-width:760px){#menubar .sep2,#menubar [data-sp=export],#menubar [data-sp=lang]{display:none}}

/* ===== v10 ===== */
#next{display:none!important}
#menubar .scn{display:flex;align-items:center;gap:10px;min-width:0}
#menubar .scn input{width:min(240px,18vw);accent-color:var(--mc,#C4B5FD);cursor:pointer}
#menubar .scn span{font:600 12px var(--ui);color:#C9C9D2;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}

.mc{display:grid;justify-items:center;gap:3px;border:0;background:none;color:var(--soft);cursor:pointer;padding:0}
.mc i{position:relative;width:50px;height:50px;border-radius:10px;display:grid;place-items:center;font:800 13px var(--display);font-style:normal;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.mc i span{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:#fff;color:#0B0B0D;font:700 9px/20px var(--ui);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}

.mn{font-size:9.5px;line-height:1.3;color:var(--soft);text-align:center;margin:4px 0 0}
.rg{display:grid;gap:4px;justify-items:center;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
.rg b{font:600 8.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.rg span{font-size:9.5px;color:var(--soft);text-align:center}
.rg button{width:50px;height:28px;font-size:11px!important;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.04);color:var(--ink);font:600 12px var(--ui);cursor:pointer}
.rg button[aria-pressed=true]{background:var(--mc,#C4B5FD);color:#0B0B0D}
.rg button:hover{border-color:var(--mc,#C4B5FD)}
/* explorateur temporel dans la timeline */

.tc header{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 6px}
.tc header b{font:900 22px var(--display);font-stretch:var(--dstretch,62%);text-transform:uppercase}
.tc header small{font:500 10.5px var(--mono);color:var(--soft)}
.tl2{overflow:auto;padding:0 6px 8px;display:grid;align-content:start;gap:2px}

.te small{font:500 10.5px var(--mono);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* scènes plein écran */
#scene{position:fixed;z-index:2;left:calc(var(--toolw) + 24px);right:calc(var(--railw) + 24px);top:calc(44px + env(safe-area-inset-top,0px));bottom:calc(var(--tlh) + 22px + env(safe-area-inset-bottom,0px));pointer-events:none;color:var(--ink)}

.or-l{display:grid;gap:10px}
.or-clock{font:900 clamp(90px,13vw,200px)/.8 var(--display);font-stretch:var(--dstretch,62%);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.or-cd{font:500 15px var(--ui);color:#C9C9D2}.or-cd b{color:#FDA4AF}
