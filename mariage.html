<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIME Wedding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="AIME Wedding : toute l'organisation du mariage et tous ses supports sur une seule ligne du temps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout : une seule ligne du temps verticale, échelle « Point Zéro » (log loin du jour J, minute par minute le jour J).
   Gauche : tableau de bord (maintenant, bases, invités, prestataires, menu). Centre : la ligne. Droite : le détail. Bas : voyage dans le temps. */
:root{
  --bg:#0E0C0B; --panel:#161311; --raise:#1E1A17; --line:#2C2622; --fg:#F1EADF; --mut:#9C9184;
  --acc:#C9A96E; --acc-ink:#1A140C; --peach:#E8B9A0; --teal:#5BA59D; --ok:#86B892; --late:#E37A62;
  --band:rgba(201,169,110,.035);
  --head:"Archivo Narrow","Arial Narrow",sans-serif;
  --body:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --poem:"Instrument Serif",Georgia,serif;
  --topH:58px; --barH:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F5F1EA; --panel:#FFFDF9; --raise:#FFFFFF; --line:#E3DCD1; --fg:#1B1714; --mut:#74695E;
  --acc:#9A7637; --acc-ink:#FFFFFF; --peach:#C26E52; --teal:#2F6F6A; --ok:#3F8455; --late:#C2412D; --band:rgba(154,118,55,.05); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F5F1EA; --panel:#FFFDF9; --raise:#FFFFFF; --line:#E3DCD1; --fg:#1B1714; --mut:#74695E;
  --acc:#9A7637; --acc-ink:#FFFFFF; --peach:#C26E52; --teal:#2F6F6A; --ok:#3F8455; --late:#C2412D; --band:rgba(154,118,55,.05); color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.eb{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.poem{font-family:var(--poem);font-style:italic}

/* ===== en-tête ===== */
#top{height:var(--topH);display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:.06em}
.brand sup{font-size:9px;color:var(--acc)}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--acc)}
.who{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.2}
.who strong{font-family:var(--poem);font-style:italic;font-weight:400;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roles{display:flex;gap:4px;flex-wrap:nowrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.zoom{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.zoom button{border:0;background:transparent;width:30px;height:28px;font-family:var(--mono)}
.zoom button+button{border-left:1px solid var(--line)}
#railBtn{display:none}

/* ===== coque ===== */
#shell{position:relative;overflow:hidden;height:calc(100% - var(--topH) - var(--barH));display:grid;grid-template-columns:330px minmax(0,1fr) 400px}
#rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
#lineWrap{position:relative;overflow:auto;min-height:0;overscroll-behavior:contain;scroll-behavior:auto}

/* ===== tableau de bord ===== */
.tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 9px 10px;font-size:12.5px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc)}
.rail-body{overflow:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:18px;min-height:0;flex:1}
.big{font-family:var(--head);font-weight:700;font-size:54px;line-height:.9;letter-spacing:-.01em}
.big small{font-family:var(--poem);font-style:italic;font-weight:400;font-size:20px;color:var(--mut);letter-spacing:0;margin-left:6px}
.phase{font-family:var(--poem);font-style:italic;font-size:19px;color:var(--acc)}
.blk{display:flex;flex-direction:column;gap:8px}
.blk>.eb{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--raise);text-align:left;width:100%}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:13px}
.row .t span{display:block;font-size:12px;color:var(--mut)}
.row.late{border-color:color-mix(in srgb,var(--late) 50%,var(--line))}
.row.late .t span{color:var(--late)}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--mut);flex:none;display:grid;place-items:center;background:transparent;padding:0}
.dot.on{background:var(--ok);border-color:var(--ok)}
.dot.on::after{content:"";width:6px;height:3px;border-left:1.5px solid var(--bg);border-bottom:1.5px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.live{border:1px solid var(--acc);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--acc) 7%,var(--raise))}
.live h3{margin:0;font-family:var(--head);font-size:22px;line-height:1.1}
.live p{margin:0;font-size:12.5px;color:var(--mut)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:7px 11px;font-size:12.5px}
.btn.solid{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.meter{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{background:var(--raise);padding:9px 6px;text-align:center}
.stats b{display:block;font-family:var(--mono);font-size:16px;font-weight:500}
.stats span{font-size:10.5px;color:var(--mut)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;color:var(--mut)}
.field input,.field select,.field textarea,.gl input,.gl select{width:100%;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:8px 10px;font-size:13.5px}
.field textarea{resize:vertical;min-height:54px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw button{border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:var(--raise);text-align:left}
.sw button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.sw i{display:block;height:34px}
.sw span{display:block;padding:5px 8px;font-size:11.5px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--raise);width:100%;text-align:left}
.toggle i{width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .2s}
.toggle[aria-pressed="true"] i{background:var(--acc)}
.toggle[aria-pressed="true"] i::after{transform:translateX(14px)}
.gl{display:flex;flex-direction:column;gap:6px}
.gl .g{display:grid;grid-template-columns:minmax(0,1fr) 92px 70px 26px;gap:5px;align-items:center}
.gl .g input,.gl .g select{padding:6px 7px;font-size:12.5px}
.gl .g.v{grid-template-columns:minmax(0,1fr) 84px 78px}
.x{border:0;background:transparent;color:var(--mut);font-size:18px;line-height:1;padding:0}
.hint{font-size:12px;color:var(--mut);margin:0}

/* ===== la ligne ===== */
#line{position:relative;min-height:100%}
.band{position:absolute;left:0;right:0}
.band:nth-of-type(even){background:var(--band)}
.band span{position:absolute;left:10px;top:14px;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--poem);font-style:italic;font-size:17px;color:var(--mut);white-space:nowrap}
.tick{position:absolute;display:flex;align-items:center;justify-content:flex-end;gap:6px;height:0;font-family:var(--mono);font-size:10px;color:var(--mut);white-space:nowrap}
.tick b{font-weight:500;color:var(--fg)}
.tick::after{content:"";width:7px;border-top:1px solid var(--mut)}
.tick.h{font-size:9.5px}
.tick.h b{color:var(--mut);font-weight:400}
.tick.h.full b{color:var(--fg)}
#spine{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--line) 60px,var(--line) calc(100% - 60px),transparent)}
#spineDay{position:absolute;width:3px;margin-left:-1px;background:var(--acc);border-radius:3px;opacity:.75}
#wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#wires path{fill:none}
.w-lead{stroke:var(--line);stroke-width:1}
.w-arc{stroke:var(--acc);stroke-width:1.2;opacity:.28;stroke-dasharray:3 4}
.w-arc.hot{opacity:1;stroke-width:1.6;stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.pin{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--bg);border:1.5px solid var(--mut)}
.pin.p-key{border-color:var(--acc);background:var(--acc)}
.pin.p-sup{border-radius:2px;transform:rotate(45deg);border-color:var(--acc)}
.pin.p-pay{border-color:var(--teal)}
.pin.p-done{background:var(--ok);border-color:var(--ok)}
.node{position:absolute;text-align:left;border:1px solid transparent;background:transparent;padding:0;border-radius:10px;transition:opacity .25s,background .2s,border-color .2s}
.node.dim{opacity:.22}
.node.past:not(.sel){opacity:.55}
.node.past.dim{opacity:.15}
.node:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.node.sel{background:var(--raise);border-color:var(--acc)}
.mo{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:10px;padding:4px 8px}
.mo .tm{font-family:var(--mono);font-size:11.5px;color:var(--mut);padding-top:3px}
.mo .tt{font-family:var(--head);font-weight:600;font-size:16px;line-height:1.25}
.mo.key .tt{font-size:19px}
.mo .wh{grid-column:2;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo .dl{font-family:var(--mono);font-size:10px;color:var(--late);margin-left:6px}
.mo .rn{font-family:var(--mono);font-size:10px;color:var(--teal);margin-left:6px}
.mo.now{background:color-mix(in srgb,var(--acc) 12%,transparent);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.mo.zero .tt{font-family:var(--poem);font-style:italic;font-weight:400;font-size:26px;color:var(--acc)}
.task,.pay{display:flex;align-items:center;gap:9px;padding:5px 8px}
.task .tt,.pay .tt{font-size:13.5px;font-weight:500}
.task .dt,.pay .dt{font-family:var(--mono);font-size:10px;color:var(--mut);margin-left:auto;padding-left:8px;white-space:nowrap}
.task.done .tt{text-decoration:line-through;text-decoration-color:var(--mut);color:var(--mut)}
.task.late .dt{color:var(--late)}
.task.ms .tt{font-family:var(--poem);font-style:italic;font-size:19px;font-weight:400;color:var(--acc)}
.pay .eu{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--teal);display:grid;place-items:center;font-size:9px;color:var(--teal);flex:none;font-family:var(--mono)}
.pay.done .eu{background:var(--teal);color:var(--bg)}
.pay .tt span{color:var(--mut);font-family:var(--mono);font-size:11px;margin-left:6px}
.sup{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:8px;background:var(--panel);border-color:var(--line)}
.sup .th{display:block;height:96px;border-radius:5px;overflow:hidden;background:var(--line);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.sup .th svg{display:block;width:100%;height:100%}
.sup .mt{display:flex;flex-direction:column;gap:3px;min-width:0;padding-top:2px}
.sup b{font-family:var(--head);font-weight:600;font-size:16px;line-height:1.15}
.sup .st{font-size:11.5px;display:flex;align-items:center;gap:6px}
.sup .st i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.sup.done .st i{background:var(--ok)}
.sup.late .st{color:var(--late)}.sup.late .st i{background:var(--late)}
.sup .use{font-size:11.5px;color:var(--acc)}
.sup .fd{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#needle{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--late);z-index:5;pointer-events:none}
#needle span{position:absolute;top:-10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--late);color:#fff;padding:3px 7px;border-radius:999px;white-space:nowrap}
.rip{animation:rip 1.1s ease-out both}
@keyframes rip{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 70%,transparent);border-color:var(--acc)}100%{box-shadow:0 0 0 14px transparent}}
.zero-mark{position:absolute;pointer-events:none}

/* ===== détail ===== */
.dt-in{padding:20px 20px 40px;display:flex;flex-direction:column;gap:18px}
.dt-in h2{margin:2px 0 0;font-family:var(--head);font-weight:700;font-size:30px;line-height:1.05;text-wrap:balance}
.dt-in h2.poem{font-family:var(--poem);font-weight:400;font-size:36px}
.dt-in p{margin:0}
.lede{font-size:14.5px;color:var(--fg);max-width:60ch}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.list li button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:5px 0}
.list li button.on span{color:var(--mut);text-decoration:line-through}
.qty{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.qty b{font-family:var(--mono);font-weight:500;text-align:right}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--mut)}
.tag.acc{border-color:var(--acc);color:var(--acc)}
.preview{border-radius:8px;overflow:hidden;background:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.preview svg{display:block;width:100%;height:auto}
.alt{border-left:2px solid var(--teal);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.studio-ref{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:8px}
.studio-ref img{width:72px;height:72px;object-fit:cover;border-radius:6px;background:var(--line)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minis button{border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:6px;text-align:left;font-size:11.5px;display:flex;flex-direction:column;gap:5px}
.minis svg{width:100%;height:auto;display:block;border-radius:4px}
.empty{padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.empty h2{font-family:var(--poem);font-style:italic;font-weight:400;font-size:34px;line-height:1.05;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--mut);max-width:44ch}
.legend{display:grid;gap:9px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:10px}
.legend .pin{position:static;display:inline-block;margin:0 2px;flex:none}
.dclose{display:none}

/* ===== voyage dans le temps ===== */
#travel{height:var(--barH);border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
#tLab{min-width:0;width:290px;display:flex;flex-direction:column;line-height:1.2}
#tLab b{font-family:var(--head);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tLab span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tRange{flex:1;min-width:0;accent-color:var(--acc)}
#travel .btns{flex-wrap:nowrap}

/* ===== visionneuse, toast ===== */
#viewer{position:fixed;inset:0;z-index:50;background:rgba(8,7,6,.86);display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#viewer .vin{max-width:min(92vw,900px);max-height:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
#viewer svg{max-width:100%;max-height:calc(100vh - 120px);width:auto;height:auto;display:block;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#viewer .btn{background:#1E1A17;color:#F1EADF;border-color:#3a332d}
#toast{position:fixed;left:50%;bottom:calc(var(--barH) + 16px);transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#scrim{display:none}

/* ===== tablette ===== */
@media (max-width:1559px){
  #shell{grid-template-columns:320px minmax(0,1fr)}
  #detail{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);z-index:20;transform:translateX(105%);transition:transform .3s cubic-bezier(.7,0,.2,1);box-shadow:-20px 0 40px rgba(0,0,0,.25)}
  body.dopen #detail{transform:none}
  .dclose{display:block;position:sticky;top:0;margin-left:auto;z-index:2}
}
@media (max-width:1180px){
  #shell{grid-template-columns:300px minmax(0,1fr)}
  .roles .chip:nth-child(n+4){display:none}
}
/* ===== téléphone ===== */
@media (max-width:760px){
  :root{--topH:56px;--barH:96px}
  #top{gap:10px}
  .roles,.zoom{display:none}
  #railBtn{display:block}
  .who strong{font-size:17px}
  #shell{grid-template-columns:minmax(0,1fr)}
  #rail{position:absolute;inset:0;z-index:25;transform:translateY(105%);transition:transform .3s cubic-bezier(.7,0,.2,1)}
  body.ropen #rail{transform:none}
  #detail{width:100%;top:auto;height:82%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%)}
  body.dopen #detail{transform:none}
  #travel{flex-wrap:wrap;gap:6px 10px;padding-top:8px}
  #tLab{width:auto;flex:1}
  #tRange{order:3;flex-basis:100%}
  .big{font-size:44px}
  .mroles{display:flex}
}
.sm{display:none}
@media (max-width:760px){.lg{display:none}.sm{display:inline}#travel .btn{padding:6px 9px}}
@media (max-width:520px){.band span{display:none}}
.mroles{display:none;gap:4px;overflow-x:auto;scrollbar-width:none}
@media (max-width:760px){.mroles{display:flex;margin-top:6px}}

/* ====== Les nœuds de la ligne ====== */
function nodes(){const D=D0(),M=moments(),N=[];
  M.forEach((m,k)=>N.push(Object.assign(m,{t:D+m.m*MIN,next:M[k+1]})));
  TASKS.forEach((x,i)=>{const o={id:'t'+i,kind:x[4]?'sup':'task',off:x[0],t:D+x[0]*DAY+(x[0]>0?11:10)*HOUR,title:x[1],desc:x[2],who:[x[3]],sup:x[4]||'',ms:x[5]==='ms'};if(o.sup){o.title=SUPS[o.sup].n;o.task=x[1];if(SUP_USE[o.sup]!=null)o.use='m'+SUP_USE[o.sup]}N.push(o)});
  S.vendors.forEach(v=>N.push({id:'p'+v.id,kind:'pay',off:v.book,t:D+v.book*DAY+15*HOUR,title:'Acompte '+v.n,amt:Math.round(v.cost*.3),who:['Couple',v.role],vendor:v}));
  const sol=S.vendors.reduce((a,v)=>a+v.cost*.7,0);N.push({id:'psolde',kind:'pay',off:-14,t:D-14*DAY+15*HOUR,title:'Soldes des prestataires',amt:Math.round(sol),who:['Couple']});
  return N.sort((a,b)=>a.t-b.t)}
const isDone=n=>n.kind==='pay'?!!S.paid[n.id]:!!S.done[n.id];
function match(n){const r=S.role;if(r==='all')return true;const w=n.who||[];
  if(r==='Invités')return n.pub||w.includes('Invités')||w.includes('Tout le monde')||(n.kind==='sup'&&SUPS[n.sup].guest);
  if(r==='Prestataires')return n.kind==='pay'||w.some(x=>!PEOPLE.includes(x))||(n.kind==='sup'&&!SUPS[n.sup].guest);
  return w.includes(r)||w.includes('Tout le monde')}

/* ====== Échelle Point Zéro ====== */
const A=300,B=1650,C=1980,E=2280,TAU=2880,MMIN=-430*1440,MMAX=46*1440;
function rawY(m){const Z=S.zoom||1,K1=480*Z,K2=320*Z,d1=1.55*Z,d2=.22*Z,d3=1.1*Z;
  if(m<A)return-K1*Math.log(1+(A-m)/TAU);
  if(m<=B)return(m-A)*d1;
  if(m<=C)return(B-A)*d1+(m-B)*d2;
  if(m<=E)return(B-A)*d1+(C-B)*d2+(m-C)*d3;
  return(B-A)*d1+(C-B)*d2+(E-C)*d3+K2*Math.log(1+(m-E)/TAU)}
const Y=m=>rawY(m)-rawY(MMIN)+70;
const yT=t=>Y((t-D0())/MIN);
const tRange=()=>{const D=D0();return[D+MMIN*MIN,D+MMAX*MIN]};
function phaseAt(m){if(m<-180*1440)return'Le projet';if(m<-45*1440)return'Les préparatifs';if(m<A)return'La dernière ligne droite';if(m<1440+180)return'Le jour J';if(m<C)return'La nuit';if(m<E)return'Le lendemain';return'Et après'}
const BANDS=()=>[['Le projet',MMIN,-180*1440],['Les préparatifs',-180*1440,-45*1440],['La dernière ligne droite',-45*1440,A],['Le jour J',A,1440+180],['La nuit',1440+180,C],['Le lendemain',C,E],['Et après',E,MMAX]];

/* ====== Rendu de la ligne ====== */
let CUR=[],SIG=new Map(),SVG={},GEO={};
function renderSupports(){P=PAL[S.style]||PAL.velours;const c=ctx();SVG={};for(const k in SUPS){try{SVG[k]=SUPS[k].r(c)}catch(e){console.error(k,e);SVG[k]=frame(SUPS[k].w,SUPS[k].h,'')}}}
function sigOf(n){if(n.kind==='sup')return SVG[n.sup]+'|'+n.t;if(n.kind==='mo')return n.t+'|'+n.q.map(q=>qtyVal(q,n,n.next)).join(',')+'|'+(S.rain&&n.out?1:0);return n.t+'|'+(n.amt||'')+'|'+(n.title||'')}
function nodeHTML(n){const now=simT();
  if(n.kind==='mo'){const w=n.who.filter(x=>x!=='Tout le monde').slice(0,4).join(' · ');
    return`<button type="button" class="node mo${n.key?' key':''}${n.i===ZERO?' zero':''}" data-id="${n.id}"><span class="tm">${hhmm(n.m)}</span><span class="tt">${n.i===ZERO?'Point zéro · ':''}${esc(n.title)}${n.sh?`<span class="dl">+${n.sh} min</span>`:''}${S.rain&&n.out?'<span class="rn">plan pluie</span>':''}</span><span class="wh">${esc(w)}</span></button>`}
  if(n.kind==='sup'){const d=isDone(n),late=!d&&n.t<now,u=n.use&&CUR.find(x=>x.id===n.use);
    return`<button type="button" class="node sup${d?' done':''}${late?' late':''}" data-id="${n.id}"><span class="th">${SVG[n.sup]}</span><span class="mt"><span class="eb">${jLab(n.off)} · ${fShort(n.t)}</span><b>${esc(n.title)}</b><span class="st"><i></i>${d?(n.off>0?'Envoyé':'Prêt'):late?'En retard':'À préparer'}</span>${u?`<span class="use">Sert à ${hhmm(u.m)} · ${esc(u.title)}</span>`:''}<span class="fd">${SUPS[n.sup].deps.slice(0,4).join(' · ')}</span></span></button>`}
  if(n.kind==='pay'){const d=isDone(n);return`<button type="button" class="node pay${d?' done':''}" data-id="${n.id}"><span class="eu">€</span><span class="tt">${esc(n.title)}<span>${fEur(n.amt)}</span></span><span class="dt">${jLab(n.off)}</span></button>`}
  const d=isDone(n),late=!d&&n.t<now&&!n.ms;
  return`<button type="button" class="node task${d&&!n.ms?' done':''}${late?' late':''}${n.ms?' ms':''}" data-id="${n.id}">${n.ms?'':`<span class="dot${d?' on':''}" aria-hidden="true"></span>`}<span class="tt">${esc(n.title)}</span><span class="dt">${jLab(n.off)}</span></button>`}
function renderLine(){const wrap=$('#lineWrap'),line=$('#line'),W=wrap.clientWidth,D=D0();
  const wide=W>=780,sx=W<520?58:124,ax=sx+22,bw=wide?Math.round(Math.min(330,Math.max(250,W*.36))):0,aw=wide?Math.min(420,W-ax-bw-64-16):W-ax-14,bx=ax+aw+64;
  GEO={W,wide,sx,ax,aw,bx,bw};const H=Y(MMAX)+140;line.style.height=H+'px';
  let h='';BANDS().forEach(([l,a,b])=>{h+=`<div class="band" style="top:${Y(a)}px;height:${Y(b)-Y(a)}px"><span>${l}</span></div>`});
  [-420,-365,-300,-240,-180,-150,-120,-90,-60,-45,-30,-21,-14,-7,-4,-2,-1].forEach(o=>{h+=`<div class="tick" style="top:${Y(o*1440+600)}px;right:${W-sx+4}px"><span>${W<520?'':fShort(D+o*DAY)}</span><b>J${o}</b></div>`});
  for(let m=360;m<=1440+120;m+=60)h+=`<div class="tick h${m%180===0?' full':''}" style="top:${Y(m)}px;right:${W-sx+4}px"><b>${hhmm(m)}</b></div>`;
  [C,1440+720,E].forEach(m=>h+=`<div class="tick h" style="top:${Y(m)}px;right:${W-sx+4}px"><b>${hhmm(m)}</b></div>`);
  [3,7,14,30,45].forEach(o=>h+=`<div class="tick" style="top:${Y(o*1440+660)}px;right:${W-sx+4}px"><span>${W<520?'':fShort(D+o*DAY)}</span><b>J+${o}</b></div>`);
  h+=`<div id="spine" style="left:${sx}px"></div><div id="spineDay" style="left:${sx}px;top:${Y(A)}px;height:${Y(1440+180)-Y(A)}px"></div><svg id="wires" width="${W}" height="${H}"></svg>`;
  CUR=nodes();const vis=CUR;
  vis.forEach(n=>{const y=Y((n.t-D)/MIN);n.y=y;n.lane=wide&&n.kind==='sup'?'b':'a';h+=`<span class="pin${n.key?' p-key':''}${n.kind==='sup'?' p-sup':''}${n.kind==='pay'?' p-pay':''}${(n.kind==='task'&&!n.ms||n.kind==='pay')&&isDone(n)?' p-done':''}" style="left:${sx}px;top:${y}px"></span>`});
  h+=vis.map(nodeHTML).join('')+`<div id="needle"><span></span></div>`;
  line.innerHTML=h;
  /* placement sans chevauchement, couloir par couloir */
  const lanes={a:-1e9,b:-1e9};
  vis.forEach(n=>{const el=line.querySelector(`[data-id="${n.id}"]`);n.el=el;el.style.left=(n.lane==='b'?bx:ax)+'px';el.style.width=(n.lane==='b'?bw:aw)+'px'});
  vis.forEach(n=>{const el=n.el,hgt=el.offsetHeight,anchor=n.kind==='sup'?18:n.kind==='mo'?13:13;let top=n.y-anchor;if(top<lanes[n.lane]+6)top=lanes[n.lane]+6;el.style.top=top+'px';n.top=top;n.h=hgt;n.anchor=anchor;lanes[n.lane]=top+hgt});
  const maxB=Math.max(lanes.a,lanes.b)+80;if(maxB>H){line.style.height=maxB+'px';$('#wires').setAttribute('height',maxB)}
  drawWires();applyFilter();updateTime(false);
  /* signature de chaque nœud, pour montrer ce qui a bougé */
  const ns=new Map();vis.forEach(n=>ns.set(n.id,sigOf(n)));const old=SIG;SIG=ns;return old}
function drawWires(){const svg=$('#wires');if(!svg)return;const{sx,ax,aw,bx,wide}=GEO;let s='';
  CUR.forEach(n=>{if(n.lane!=='a')return;const ay=n.top+n.anchor;if(Math.abs(ay-n.y)>2)s+=`<path class="w-lead" d="M${sx} ${n.y} C ${sx+14} ${n.y}, ${ax-14} ${ay}, ${ax-2} ${ay}"/>`;else s+=`<path class="w-lead" d="M${sx+5} ${n.y} H ${ax-2}"/>`});
  if(wide)CUR.forEach(n=>{if(n.kind!=='sup')return;const sy=n.top+n.anchor;if(S.sel===n.id)s+=`<path class="w-arc hot" d="M${sx+5} ${n.y} C ${sx+60} ${n.y}, ${bx-80} ${sy}, ${bx-2} ${sy}"/>`;
    if(!n.use)return;const u=CUR.find(x=>x.id===n.use);if(!u)return;const uy=u.top+u.anchor,x1=bx-2,x2=ax+Math.min(aw,u.el.scrollWidth)+4;const hot=S.sel===n.id||S.sel===u.id;
    s+=`<path class="w-arc${hot?' hot':''}" data-a="${n.id}" d="M${x1} ${sy} C ${x1-46} ${sy}, ${x1-46} ${uy}, ${x2} ${uy}"/>`});
  svg.innerHTML=s}
function applyFilter(){CUR.forEach(n=>{if(n.el){n.el.classList.toggle('dim',!match(n));n.el.classList.toggle('sel',S.sel===n.id)}})}
function updateTime(scroll){const t=simT(),D=D0(),m=(t-D)/MIN,[a,b]=tRange();const cl=Math.max(a,Math.min(b,t));const y=Y((cl-D)/MIN);
  const nd=$('#needle');if(nd){nd.style.top=y+'px';const sp=nd.firstElementChild;sp.style.left=(GEO.sx-4)+'px';sp.textContent=(S.sim==null?'Maintenant · ':'')+(m>=A-120&&m<=E?hhmm(m):fShort(t))}
  let cur=null;CUR.forEach(n=>{if(!n.el)return;const end=n.kind==='mo'?(n.next?n.next.t:n.t+30*MIN):n.t+DAY;n.el.classList.toggle('past',end<t&&n.kind!=='sup');if(n.kind==='mo'){const on=n.t<=t&&end>t;n.el.classList.toggle('now',on);if(on)cur=n}
    if(n.kind==='task'&&!n.ms)n.el.classList.toggle('late',!isDone(n)&&n.t<t);if(n.kind==='sup'){const late=!isDone(n)&&n.t<t;n.el.classList.toggle('late',late);const st=n.el.querySelector('.st');if(st)st.innerHTML=`<i></i>${isDone(n)?(n.off>0?'Envoyé':'Prêt'):late?'En retard':'À préparer'}`}});
  const off=Math.floor((new Date(t).setHours(0,0,0,0)-D)/DAY);
  $('#tLab b').textContent=fLong(t)+(m>=A-120&&m<=E?' · '+hhmm(m):'');$('#tLab span').textContent=jLab(off)+' · '+phaseAt(m)+(S.sim==null?' · en direct':'');
  const r=$('#tRange');r.min=a;r.max=b;r.step=15*MIN;if(document.activeElement!==r)r.value=cl;
  if(scroll){const w=$('#lineWrap');w.scrollTop=Math.max(0,y-w.clientHeight*.38)}
  if(S.tab==='now'&&!$('#railBody').contains(document.activeElement))renderRail()}

let tmr=0;
function commit(label,opts){save();renderSupports();const old=renderLine();renderDetail();renderHeader();if(opts&&opts.rail)renderRail();
  if(old.size===0)return;const ch=CUR.filter(n=>old.has(n.id)&&old.get(n.id)!==SIG.get(n.id));
  ch.forEach((n,i)=>{if(!n.el)return;n.el.style.animationDelay=Math.min(i*45,1400)+'ms';n.el.classList.add('rip')});
  if(label!==false&&ch.length){const s=ch.filter(n=>n.kind==='sup').length,m=ch.filter(n=>n.kind==='mo').length,o=ch.length-s-m;
    toast(`${label?label+' · ':''}propagé à ${[s&&s+' support'+(s>1?'s':''),m&&m+' moment'+(m>1?'s':''),o&&o+' étape'+(o>1?'s':'')].filter(Boolean).join(', ')}`)}}
function later(label){clearTimeout(tmr);tmr=setTimeout(()=>commit(label),260)}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2600)}

function renderDetail(){const el=$('#detail'),n=S.sel&&CUR.find(x=>x.id===S.sel);document.body.classList.toggle('dopen',!!n);
  const close=`<button type="button" class="btn dclose" data-close aria-label="Fermer le détail">Fermer</button>`;
  if(!n){el.innerHTML=`<div class="empty"><span class="eb">La ligne · Point zéro</span><h2>Un geste, et tout ce qui suit se recale.</h2><p>Toute l’organisation tient sur une seule ligne : de la décision jusqu’à l’album souvenir. Plus on s’approche du jour J, plus la ligne s’étire, jusqu’à la minute. Les supports y sont posés au moment où il faut les préparer, reliés par un fil au moment où ils servent.</p>
    ${LEGEND}
    <p>Changez une date, une heure, un invité, un retard le jour J : ce qui en dépend s’allume sur la ligne.</p></div>`;return}
  let h=`<div class="dt-in">${close}`;
  if(n.kind==='mo'){const nx=n.next,dur=nx?nx.m-n.m:60,rain=S.rain&&n.out;const sups=CUR.filter(x=>x.kind==='sup'&&x.use===n.id);
    h+=`<div><span class="eb">${n.base>=1440?'Lendemain':'Jour J'} · ${hhmm(n.m)} → ${hhmm(n.m+dur)} · ${fDur(dur)}${n.sh?` · décalé de ${n.sh} min`:''}</span><h2${n.i===ZERO?' class="poem"':''}>${esc(n.title)}</h2></div>
    <p class="lede">${esc(rain?n.out[0]:n.desc)}</p>
    <div class="blk"><span class="eb">À prévoir</span><ul class="list">${[...n.list,...(rain?n.out[1]:[])].map((x,k)=>{const id=n.id+':'+k+(k>=n.list.length?'r':'');const on=!!S.checks[id];return`<li><button type="button" class="${on?'on':''}" data-chk="${esc(id)}"><span class="dot${on?' on':''}" aria-hidden="true"></span><span>${esc(x)}</span></button></li>`}).join('')}</ul></div>
    ${n.q.length?`<div class="blk"><span class="eb">Calculé pour ${fN(+S.target||0)} invités</span><div class="qty">${n.q.map(q=>`<span>${esc(q[0])}</span><b>${qtyVal(q,n,nx)}</b>`).join('')}</div></div>`:''}
    <div class="blk"><span class="eb">Avec</span><div class="tags">${n.who.map(w=>`<span class="tag${PEOPLE.includes(w)?'':' acc'}">${esc(w)}${PEOPLE.includes(w)?'':vendorBy(w)?' · '+esc(vendorBy(w).n):''}</span>`).join('')}${n.pub?'<span class="tag">Visible des invités</span>':''}</div></div>
    ${n.out&&!rain?`<div class="alt"><span class="eb">Si la météo tourne</span><p>${esc(n.out[0])}</p></div>`:''}
    ${sups.length?`<div class="blk"><span class="eb">Les supports qui servent ici</span><div class="minis">${sups.map(s=>`<button type="button" data-sel="${s.id}">${SVG[s.sup]}<span>${esc(s.title)}</span></button>`).join('')}</div></div>`:''}`}
  else if(n.kind==='sup'){const sp=SUPS[n.sup],u=n.use&&CUR.find(x=>x.id===n.use),d=isDone(n);
    h+=`<div><span class="eb">Support · ${jLab(n.off)} · ${fLong(n.t)}</span><h2>${esc(n.title)}</h2></div>
    <button type="button" class="preview" data-view="${n.sup}" aria-label="Voir en grand" style="border:0;padding:0;cursor:zoom-in">${SVG[n.sup]}</button>
    <p class="lede">${esc(n.task)} · ${esc(n.desc)}</p>
    <div class="blk"><span class="eb">Rempli avec</span><div class="tags">${sp.deps.map(x=>`<span class="tag acc">${x}</span>`).join('')}</div></div>
    ${u?`<div class="blk"><span class="eb">Sert le jour J</span><button type="button" class="row" data-sel="${u.id}"><span class="t"><b>${hhmm(u.m)} · ${esc(u.title)}</b><span>${esc(u.desc)}</span></span><span>›</span></button></div>`:''}
    <button type="button" class="toggle" data-done="${n.id}" aria-pressed="${d}"><span><b style="display:block;font-size:13px">${n.off>0?'Envoyé':'Prêt et validé'}</b><span class="hint">${d?'Coché':'À faire avant le '+fDay(n.t)}</span></span><i></i></button>
    <div class="links"><button type="button" class="btn" data-view="${n.sup}">Voir en grand</button>${FRAMED?'':`<button type="button" class="btn" data-png="${n.sup}">Télécharger en PNG</button>`}${STUDIO?`<a class="btn solid" href="${esc(studioHref())}" target="_blank" rel="noopener" style="text-decoration:none">Retoucher dans AIME Studio ↗</a>`:''}</div>
    ${sp.file?`<div class="studio-ref"><img src="sup/${sp.file}" alt="" loading="lazy" onerror="this.parentNode.hidden=true"><p class="hint">AIME Studio propose aussi ce support en version entièrement éditable, avec d’autres mises en page.</p></div>`:''}`}
  else if(n.kind==='pay'){const d=isDone(n);h+=`<div><span class="eb">Paiement · ${jLab(n.off)} · ${fLong(n.t)}</span><h2>${esc(n.title)}</h2></div><div class="big num" style="font-size:40px">${fEur(n.amt)}</div>
    <p class="lede">${n.vendor?`Acompte de 30 % pour ${esc(n.vendor.role.toLowerCase())}, sur un total de ${fEur(n.vendor.cost)}.`:`Les 70 % restants de chaque prestataire, réglés deux semaines avant.`}</p>
    <button type="button" class="toggle" data-done="${n.id}" aria-pressed="${d}"><span><b style="display:block;font-size:13px">Payé</b><span class="hint">${d?'Réglé':'À régler'}</span></span><i></i></button>`}
  else{const d=isDone(n);h+=`<div><span class="eb">${jLab(n.off)} · ${fLong(n.t)}</span><h2${n.ms?' class="poem"':''}>${esc(n.title)}</h2></div><p class="lede">${esc(n.desc)}</p>
    <div class="tags">${n.who.map(w=>`<span class="tag">${esc(w)}</span>`).join('')}</div>
    ${n.ms?'':`<button type="button" class="toggle" data-done="${n.id}" aria-pressed="${d}"><span><b style="display:block;font-size:13px">Fait</b><span class="hint">${d?'C’est réglé':'À faire avant le '+fDay(n.t)}</span></span><i></i></button>`}`}
  el.innerHTML=h+'</div>';el.scrollTop=0}
function select(id,scroll){S.sel=id;applyFilter();drawWires();renderDetail();if(scroll){const n=CUR.find(x=>x.id===id);if(n&&n.el){const w=$('#lineWrap');w.scrollTo({top:Math.max(0,n.top-w.clientHeight*.35),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}}

/* ====== Visionneuse et export ====== */
function view(k){const v=$('#viewer');v.innerHTML=`<div class="vin">${SVG[k]}<div class="btns"><span style="color:#F1EADF;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;align-self:center">${esc(SUPS[k].n)}</span>${FRAMED?'':`<button type="button" class="btn" data-png="${k}">Télécharger en PNG</button>`}<button type="button" class="btn" data-vclose>Fermer</button></div></div>`;v.hidden=false;v.querySelector('[data-vclose]').focus()}
function png(k){const sp=SUPS[k],sc=2,blob=new Blob([SVG[k]],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=sp.w*sc;cv.height=sp.h*sc;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${slug()}-${k}.png`;a.click()},'image/png')};img.src=url}

/* ====== Événements ====== */
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.id){select(t.dataset.id===S.sel?null:t.dataset.id);return}
  if(t.dataset.sel){if(innerWidth<=760){document.body.classList.remove('ropen');$('#railBtn').textContent='Tableau'}select(t.dataset.sel,true);return}
  if(t.hasAttribute('data-close')){select(null);return}
  if(t.dataset.role){S.role=t.dataset.role;save();renderHeader();renderRail();applyFilter();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;save();renderTabs();renderRail();return}
  if(t.dataset.z){S.zoom=Math.max(.6,Math.min(2.4,(S.zoom||1)*(t.dataset.z>0?1.3:1/1.3)));const w=$('#lineWrap'),mid=(w.scrollTop+w.clientHeight/2);const mm=invY(mid);commit(false);w.scrollTop=Y(mm)-w.clientHeight/2;return}
  if(t.dataset.done){const id=t.dataset.done,n=CUR.find(x=>x.id===id);if(!n)return;const map=n.kind==='pay'?S.paid:S.done;if(map[id])delete map[id];else map[id]=1;commit(false);renderRail();toast(map[id]?'Coché':'Décoché');return}
  if(t.dataset.chk){const k=t.dataset.chk;if(S.checks[k])delete S.checks[k];else S.checks[k]=1;save();renderDetail();return}
  if(t.dataset.tg==='rain'){S.rain=!S.rain;commit(S.rain?'Plan pluie activé':'Plan pluie retiré');renderRail();return}
  if(t.dataset.late){const v=+t.dataset.late;if(!v){S.delays=[];commit('Retards annulés');renderRail();return}
    const now=(simT()-D0())/MIN,M=moments(),nx=M.find(m=>m.m>now);if(!nx){toast('Plus aucun moment à décaler');return}S.delays.push({from:nx.base,min:v});commit(`+${v} min à partir de « ${nx.title} »`);renderRail();return}
  if(t.dataset.style){S.style=t.dataset.style;commit('Ambiance '+PAL[S.style].n);renderRail();return}
  if(t.dataset.view){view(t.dataset.view);return}
  if(t.dataset.png){png(t.dataset.png);return}
  if(t.hasAttribute('data-vclose')){$('#viewer').hidden=true;return}
  if(t.dataset.go){const D=D0();S.sim=t.dataset.go==='now'?null:t.dataset.go==='day'?D+8*HOUR:D+moments()[ZERO].m*MIN;save();updateTime(true);return}
  if(t.id==='railBtn'){const o=document.body.classList.toggle('ropen');t.textContent=o?'La ligne':'Tableau';return}
  if(t.id==='gAdd'){S.guests.push({id:'g'+Date.now().toString(36),n:'Nouvel invité',t:'',d:'',r:'att',note:''});commit('Invité ajouté',{rail:true});const ins=$$('.gl .g input[data-gf="n"]');const last=ins[ins.length-1];if(last){last.focus();last.select()}return}
  if(t.dataset.gdel){S.guests=S.guests.filter(g=>g.id!==t.dataset.gdel);commit('Invité retiré',{rail:true});return}
  if(t.id==='resetAll'){if(t.dataset.arm){S=seed();S.tab='bases';commit('Exemple rétabli',{rail:true});renderTabs();return}t.dataset.arm=1;t.textContent='Confirmer : tout remettre à zéro';setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent='Revenir à l’exemple'}},3500);return}
});
$('#viewer').addEventListener('click',e=>{if(e.target.id==='viewer')e.currentTarget.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#viewer').hidden)$('#viewer').hidden=true;else if(S.sel)select(null);else document.body.classList.remove('ropen')}});
$('#railBody').addEventListener('input',e=>{const t=e.target;
  if(t.dataset.f){const f=t.dataset.f;let v=t.value;if(f==='target'||f==='kids')v=Math.max(0,Math.min(600,+v||0));if(f==='date'&&!/^\d{4}-\d{2}-\d{2}$/.test(v))return;if(f==='cer'&&!/^\d{2}:\d{2}$/.test(v))return;S[f]=v;
    later({a:'Prénom',b:'Prénom',date:'Nouvelle date',cer:'Nouvelle heure',venue:'Lieu',city:'Ville',mairie:'Mairie',target:'Invités',kids:'Enfants'}[f]);return}
  if(t.id==='gq'){GQ=t.value;const p=t.selectionStart;renderRail();const q=$('#gq');q.focus();q.setSelectionRange(p,p);return}
  if(t.id==='tbl'){const L=t.value.split(',').map(x=>x.trim()).filter(Boolean);if(!L.length)return;S.tables=L;S.guests.forEach(g=>{if(g.t&&!L.includes(g.t))g.t=''});later('Tables');return}
  if(t.dataset.gf){const g=S.guests.find(x=>x.id===t.closest('[data-g]').dataset.g);if(!g)return;g[t.dataset.gf]=t.value;later(g.n);return}
  if(t.dataset.vf){const v=S.vendors.find(x=>x.id===t.closest('[data-v]').dataset.v);if(!v)return;v[t.dataset.vf]=t.dataset.vf==='cost'?Math.max(0,+t.value||0):t.value;later(v.n);return}
  if(t.dataset.mf){S.menu[t.dataset.mf]=t.value;later('Menu');return}});
$('#railBody').addEventListener('change',e=>{if(e.target.id==='tbl'||e.target.dataset.gf==='t'||e.target.dataset.f==='date')renderRail()});
const rng=$('#tRange');let raf=0;rng.addEventListener('input',()=>{S.sim=+rng.value;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>updateTime(true))});rng.addEventListener('change',save);
function invY(y){let lo=MMIN,hi=MMAX;for(let k=0;k<48;k++){const mid=(lo+hi)/2;if(Y(mid)<y)lo=mid;else hi=mid}return lo}
let rw=0;new ResizeObserver(()=>{const w=$('#lineWrap').clientWidth;if(Math.abs(w-rw)<2)return;rw=w;const wr=$('#lineWrap'),mm=invY(wr.scrollTop+wr.clientHeight/2);renderLine();wr.scrollTop=Y(mm)-wr.clientHeight/2}).observe($('#lineWrap'));
setInterval(()=>{if(S.sim==null)updateTime(false)},30000);

/* ====== Démarrage ====== */
renderHeader();renderTabs();renderSupports();renderLine();renderRail();renderDetail();updateTime(true);
document.fonts&&document.fonts.ready.then(()=>{const w=$('#lineWrap'),mm=invY(w.scrollTop+w.clientHeight/2);renderLine();w.scrollTop=Y(mm)-w.clientHeight/2});
try{fetch('studio/index.html',{method:'HEAD'}).then(r=>{STUDIO=r.ok;if(S.sel)renderDetail()}).catch(()=>{})}catch(e){}
})();
</script>

</html>
