<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>AIME · Atelier des cinq blocs</title><style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#0a0a0c;--surface:#15151a;--line:#35353d;--text:#eee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 22px;gap:12px}header b{letter-spacing:.14em}.shell{display:grid;grid-template-columns:225px minmax(0,1fr) 285px;min-height:calc(100svh - 70px)}aside{padding:24px 16px;background:var(--surface)}aside:first-child{border-right:1px solid var(--line)}aside:last-child{border-left:1px solid var(--line)}h1{font-size:clamp(24px,3vw,36px);letter-spacing:-.05em}h2{font-size:15px}button,.button{border:1px solid var(--line);border-radius:12px;background:#222229;color:var(--text);padding:11px 14px;cursor:pointer;font:inherit}button:hover{border-color:#aaa}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #aaa;outline-offset:2px}button:disabled{opacity:.4;cursor:not-allowed}.palette{display:grid;gap:8px}.palette button{text-align:left}main{padding:30px clamp(16px,4vw,48px);min-width:0}.preview{background:#f7f7f6;color:#171717;padding:clamp(18px,4vw,50px);border-radius:16px;min-height:440px;max-width:840px;margin:20px auto}.preview article{position:relative;margin:16px 0;padding:14px;border:2px solid transparent;border-radius:10px;cursor:pointer;overflow-wrap:anywhere}.preview article[aria-selected=true]{border-color:#655deb;background:#eeeeff}.preview img{max-width:100%;height:auto}.preview .cta{display:inline-block;padding:10px 16px;background:#111;color:#fff;border-radius:99px;text-decoration:none}.preview a{color:inherit}.preview .cta{color:#fff}.preview .vide{color:#888}.editor{display:grid;gap:16px}.editor label{display:grid;gap:7px;color:#bbb;font-size:13px}.editor input,.editor textarea{min-width:0;border:1px solid var(--line);background:#09090b;color:white;padding:11px;border-radius:9px;font:inherit}.editor textarea{min-height:105px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.muted{color:#a4a4b2;font-size:13px;line-height:1.5}.status{font-size:12px;color:#aaa}.selected{outline:1px solid #8c83ff}.export{background:#eee;color:#121212}#empty{color:#777;text-align:center;padding:80px 0}@media(max-width:900px){.shell{grid-template-columns:170px minmax(0,1fr)}aside:last-child{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.palette button{padding:9px}}@media(max-width:540px){header{height:auto;flex-wrap:wrap}.shell{display:block}aside:first-child{border-right:0;border-bottom:1px solid var(--line)}.palette{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding:20px}.preview{padding:12px}}
</style></head><body><header><b>AIME<span style="color:#888">®</span> · BLOCS</b><div class="row"><button id="save" type="button">Sauvegarder</button><button id="load" type="button">Reprendre</button><button class="export" id="export" type="button">Exporter HTML</button></div></header><div class="shell"><aside><h2>Bibliothèque</h2><p class="muted">Un projet. Cinq blocs. Un même fonctionnement.</p><div class="palette" id="palette"></div><p class="muted">Les données restent sur cet appareil. Aucun serveur, aucune publication automatique.</p><a href="/sites/" style="font-size:13px;color:#ddd">Retour au Studio Site</a></aside><main><h1>Votre composition</h1><p class="muted">Cliquez un bloc pour modifier son contenu et sa position.</p><div class="preview" id="preview" aria-label="Aperçu des blocs"></div><p class="status" role="status" id="status"></p></main><aside><h2>Inspecteur</h2><div id="editor" class="editor"><p class="muted">Sélectionnez un bloc.</p></div></aside></div><script src="/constructeur/cinq-blocs.js"></script><script>
(function(){'use strict';const B=window.AIMECinqBlocs,KEY='aime-cinq-blocs-v1',NAMES={texte:'Texte',image:'Image',bouton:'Bouton',programme:'Programme',document:'Document'};let page=B.nouveau('Ma composition'),selected=null;const $=s=>document.querySelector(s);function status(s){$('#status').textContent=s}function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function paint(){let p=$('#preview');p.innerHTML=B.rendu(page)||'<p id="empty">Ajoutez votre premier bloc avec la bibliothèque.</p>';p.querySelectorAll('article').forEach(n=>{n.tabIndex=0;n.setAttribute('role','button');n.setAttribute('aria-label','Modifier le bloc');n.setAttribute('aria-selected',String(n.dataset.bloc===selected));n.onclick=()=>choose(n.dataset.bloc);n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(n.dataset.bloc)}}});inspect()}
function choose(id){selected=id;paint();}function inspect(){const ed=$('#editor');ed.replaceChildren();const b=page.blocs.find(x=>x.id===selected);if(!b){ed.textContent='Sélectionnez un bloc.';return}const h=document.createElement('h2');h.textContent=NAMES[b.type];ed.append(h);for(const k of Object.keys(B.MODELES[b.type])){let label=document.createElement('label'),title=document.createElement('span');title.textContent=({texte:'Texte',url:'URL (https ou chemin interne)',alt:'Description alternative',titre:'Titre',lignes:'Une ligne par moment',nom:'Nom du document'}[k]||k);let input=(k==='texte'||k==='lignes')?document.createElement('textarea'):document.createElement('input');input.value=b.donnees[k]||'';input.oninput=()=>{page=B.modifier(page,b.id,k,input.value);const f=input;const start=f.selectionStart,end=f.selectionEnd;const art=$('#preview article[data-bloc="'+b.id+'"]');if(art){const wrapper=document.createElement('div');wrapper.innerHTML=B.rendu({format:page.format,version:page.version,id:page.id,blocs:[page.blocs.find(x=>x.id===b.id)]});art.innerHTML=wrapper.firstElementChild.innerHTML}if(f.setSelectionRange)try{f.setSelectionRange(start,end)}catch(e){}};label.append(title,input);ed.append(label)}const row=document.createElement('div');row.className='row';for(const [text,action] of [['↑ Monter',()=>page=B.reordonner(page,b.id,-1)],['↓ Descendre',()=>page=B.reordonner(page,b.id,1)],['Supprimer',()=>{page=B.supprimer(page,b.id);selected=null}]]){const bt=document.createElement('button');bt.textContent=text;bt.onclick=()=>{action();paint()};row.append(bt)}ed.append(row)}
for(const type of B.TYPES){const bt=document.createElement('button');bt.textContent='+ '+NAMES[type];bt.onclick=()=>{page=B.ajouter(page,type);selected=page.blocs.at(-1).id;paint();status('Bloc ajouté')};$('#palette').append(bt)}
$('#save').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(page));status('Composition sauvegardée sur cet appareil.')}catch(e){status('Sauvegarde impossible : stockage indisponible.')}};$('#load').onclick=()=>{try{const raw=localStorage.getItem(KEY);if(!raw){status('Aucune sauvegarde.');return}const parsed=JSON.parse(raw);const v=B.verifier(parsed);if(!v.ok){status('Sauvegarde incompatible.');return}page=parsed;selected=null;paint();status('Composition restaurée.')}catch(e){status('Impossible de charger la sauvegarde.')}};$('#export').onclick=()=>{download('composition-aime.html',B.html(page),'text/html');status('Fichier HTML généré : aperçu public statique.')} ;paint()})();
</script></body></html>
