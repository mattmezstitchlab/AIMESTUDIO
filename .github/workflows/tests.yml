# AIME · contrôles automatiques de chaque PR et de chaque envoi sur integration ou main (travail direct en production).
# Pour qu'un échec BLOQUE la fusion : GitHub → Settings → Branches → règle sur `integration` (et `main`),
# « Require status checks to pass » avec les contrôles « Suites (node) », « Socle (base de test) », « Parcours navigateur » et « Accessibilité ».
name: Tests AIME
on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suites:
    name: Suites (node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # les fichiers emportés par chaque fonction Vercel (tests/fonctions.test.cjs) : @vercel/nft, sans l'ajouter aux dépendances du site
      - run: npm install --no-save @vercel/nft@1.11.0
      - run: npm test
  socle:
    name: Socle (base de test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Une base PostgreSQL éphémère, créée pour ce seul contrôle : aucun compte réel, jamais la base de production, aucun secret.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: aime_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/aime_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # comme la production : seulement les migrations, dans l'ordre des noms, deux fois (elles doivent être rejouables sans risque)
      - name: Migrations (deux passages)
        run: for passe in 1 2; do for f in $(ls db/migrations/*.sql | sort); do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done; done
      - run: node --test --test-concurrency=1 tests/comptes.test.cjs tests/pages.test.cjs tests/parcours-reel.test.cjs tests/inscription.test.cjs tests/dock-pages.test.cjs tests/ecrans-gardes.test.cjs
      # les demandes du formulaire Contact (migration 2026-10-25-09) : écrites avant l'e-mail, doublons, échecs, droits avec de vraies sessions, conservation
      - run: node --test --test-concurrency=1 tests/demandes.test.cjs
      # la Carte enregistrée sur le compte (migration 2026-10-25-10) : chacun la sienne, accord, nettoyage, deux appareils (409), retrait, suppression du compte
      - run: node --test --test-concurrency=1 tests/carte-compte.test.cjs
      # l'état de la production tant que les dernières migrations ne sont pas passées : une seconde base sans les migrations des 24 et 25/10/2026
      - name: Base « ancienne » (sans les dernières migrations)
        run: |
          psql "$TEST_DATABASE_URL" -q -c "create database aime_ancien"
          for f in $(ls db/migrations/*.sql | sort | grep -v '2026-10-2[45]'); do psql "${TEST_DATABASE_URL/aime_test/aime_ancien}" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: TEST_DATABASE_URL_ANCIEN="${TEST_DATABASE_URL/aime_test/aime_ancien}" node --test tests/socle-ancien.test.cjs
      # creer() et rejoindre() : tout ou rien (transactions), pannes simulées contre la base de test migrée
      - run: node --test --test-concurrency=1 tests/transactions.test.cjs
      # la liste d'attente de la bêta : inscription, double inscription, jeton expiré, désinscription, compteurs (migration 2026-10-24-05)
      - run: node --test --test-concurrency=1 tests/attente.test.cjs
      # les quotas partagés entre instances et la garde des écritures (migration 2026-10-24-06)
      - run: node --test --test-concurrency=1 tests/quotas.test.cjs
      # le module Temps (phase fondatrice, migration 2026-10-24-07) : six comptes, propagation, refus, conflits entre deux instances, atomicité, Comparaison, isolation de la démonstration
      - run: node --test --test-concurrency=1 tests/temps.test.cjs
  navigateur:
    name: Parcours navigateur
    needs: suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --no-save playwright@1.47.2 axe-core@4.10.2
      - run: npx playwright install --with-deps chromium
      - name: Serveur de test
        run: node scripts/serveur-test.cjs & sleep 1
      - run: node tests/navigateur/parcours.cjs
  accessibilite:
    name: Accessibilité
    needs: suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --no-save playwright@1.47.2 axe-core@4.10.2
      - run: npx playwright install --with-deps chromium
      - name: Serveur de test
        run: node scripts/serveur-test.cjs & sleep 1
      - run: node tests/navigateur/accessibilite.cjs
  temps:
    name: Parcours Temps (navigateur et base)
    needs: suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Le module Temps de bout en bout : six navigateurs connectés à une base PostgreSQL éphémère (jamais la production)
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: aime_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/aime_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --no-save playwright@1.47.2 axe-core@4.10.2
      - run: npx playwright install --with-deps chromium
      - name: Migrations
        run: for f in $(ls db/migrations/*.sql | sort); do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: node tests/navigateur/temps.cjs
      # AI, mon environnement : Contact → demande → AI → détail → projets sans rechargement, aucune fuite entre contextes, invitée sans demandes
      - run: node tests/navigateur/ai.cjs
      # la Carte dans ME : ordinateur avec une Carte locale, iPhone, iPad, deux comptes, conflit, réseau coupé, retrait
      - run: node tests/navigateur/carte.cjs
