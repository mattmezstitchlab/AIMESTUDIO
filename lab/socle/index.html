<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le socle AIME</title>
<link rel="icon" href="data:,">
<meta name="description" content="Quatre points fixes : l'orbe, la timeline, le dossier Point Zéro et votre carte universelle.">
<style>
@font-face{font-family:"Cal Sans";font-weight:400 700;font-display:swap;src:url("/fonts/CalSans-latin.woff2") format("woff2")}
@font-face{font-family:"Inter Variable";font-weight:100 900;font-display:swap;src:url("/fonts/InterVariable-latin.woff2") format("woff2-variations")}
/* Le socle : quatre points fixes. Le dossier Point Zéro (tout ce qui entre), la timeline (tout le temps), l'avatar (tout ce qui est vous), l'orbe (les outils). */
:root{--desk:#0A0A0C;--ink:#EDEDF0;--soft:#9C9CA8;--line:#2B2B33;--panel:#111115;--card:#16161B;--ui:"Inter Variable",Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--display:"Cal Sans","Inter Variable",Inter,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
 --conic:conic-gradient(#FB7185,#F59E0B,#7C5CFF,#22D3EE,#FB7185);--grad:linear-gradient(90deg,#FB7185,#F59E0B,#7C5CFF,#22D3EE);--acc:#A78BFA;--tlh:5.5rem;color-scheme:dark}
:root.hc{--soft:#C8C8D2;--line:#55555F}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font:400 1rem/1.5 var(--ui);-webkit-font-smoothing:antialiased}
body{overflow:hidden;background:radial-gradient(50% 50% at 50% 46%,rgba(124,92,255,.13),transparent 70%),radial-gradient(circle at 1px 1px,rgba(255,255,255,.045) 1px,transparent 0) 0 0/22px 22px,var(--desk)}
button{font:inherit;color:inherit}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.04)}}
@keyframes march{to{stroke-dashoffset:-20}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes bars{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition-duration:.01s!important}

/* ---------- haut : logo · 4 modes · avatar ---------- */
.top{position:fixed;inset:0 0 auto;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top .mk{font:400 1.25rem var(--display);letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.modes{display:flex;gap:2px}
.modes a{display:grid;place-items:center;width:42px;height:36px;border-radius:10px;color:#fff}
.modes a:hover{background:rgba(255,255,255,.12)}
.modes svg,.ico{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rt{justify-self:end;display:flex;gap:10px;align-items:center}
.rt .lab{border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--ink);text-decoration:none;font:600 .875rem var(--ui)}
.av{width:42px;height:42px;border-radius:50%;padding:2px;border:0;background:var(--conic);cursor:pointer;animation:hue 6s linear infinite;flex:none}
.av span,.cav span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#18181E center/cover;font:400 1.05rem var(--display);color:#fff}
.av:focus-visible,.pz:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ---------- centre : l'orbe ---------- */
.center{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:18px;text-align:center;width:min(560px,calc(100% - 40px));transition:opacity .3s,left .4s}
.orb{width:7.5rem;height:7.5rem;border-radius:50%;background:var(--conic);animation:hue 6s linear infinite,breathe 5s ease-in-out infinite;box-shadow:0 0 60px rgba(124,92,255,.5)}
.center h1{margin:0;font:400 clamp(2rem,4.2vw,3.6rem)/1 var(--display);letter-spacing:-.025em;text-wrap:balance}
.center h1 em,.em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite}
.center p{margin:0;color:#C9C9D2;max-width:46ch}
.tips{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity .5s}
.tip{position:absolute;font:500 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);white-space:nowrap}

/* ---------- le dossier Point Zéro ---------- */
.pz{position:fixed;z-index:26;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(var(--tlh) + 18px + env(safe-area-inset-bottom,0px));width:60px;height:52px;border:0;background:none;cursor:pointer;padding:0;display:grid;place-items:center}
.pz svg{width:56px;height:48px;overflow:visible}
.pz .fold{fill:rgba(18,18,22,.9);stroke:url(#pzg);stroke-width:2.2;stroke-linejoin:round}
.pz .pl{stroke:#fff;stroke-width:2;stroke-linecap:round}
.pz .gr{animation:hue 6s linear infinite}
.pz:hover .fold,.pz.drag .fold{fill:rgba(124,92,255,.22)}
.pz.drag{transform:scale(1.08)}

/* ---------- l'arbre ---------- */
.tree{position:fixed;z-index:24;left:0;top:0;bottom:calc(var(--tlh) + env(safe-area-inset-bottom,0px));width:min(320px,100vw);background:rgba(13,13,16,.94);backdrop-filter:blur(14px);border-right:1px solid #1E1E25;padding:calc(70px + env(safe-area-inset-top,0px)) 0 90px;transform:translateX(-102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.tree.on{transform:none}
.tree .th{padding:0 18px 12px 18px;display:grid;gap:10px}
.tree .th b{font:400 1.35rem var(--display)}
.tree .th small{color:var(--soft);font-size:.8rem;line-height:1.4}
.imp{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font:600 .82rem var(--ui);cursor:pointer;color:var(--ink)}
.btn:hover{border-color:#5A5A66}
.btn.p{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;padding:5px 9px;font:500 .75rem var(--ui);cursor:pointer;color:var(--ink)}
.chip:hover{border-color:#5A5A66}
.chip[aria-pressed=true],.chip[aria-checked=true]{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.tw{position:relative;flex:1;overflow:auto;padding:8px 0}
.tw svg{position:absolute;left:0;top:0;pointer-events:none}
.tw svg path{fill:none;stroke:#34343E;stroke-width:1.4}
.tl-list{list-style:none;margin:0;padding:0;position:relative}
.tl-list li{position:relative;display:flex;align-items:center;gap:10px;min-height:2.4rem;padding:0 14px 0 calc(var(--x) + 16px);cursor:default}
.tl-list li .dot{position:absolute;left:calc(var(--x) - 5px);top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#3A3A45;border:2px solid var(--desk)}
.tl-list li[data-d="0"] .dot{background:var(--conic);width:14px;height:14px;margin-top:-7px;left:calc(var(--x) - 7px);animation:hue 6s linear infinite}
.tl-list li .nm{font-size:.9rem}
.tl-list li[data-d="0"] .nm{font-weight:600}
.tl-list li .ct{margin-left:auto;font:500 .72rem var(--mono);color:var(--soft);min-width:1.6em;text-align:right}
.tl-list li.hot .dot{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 18px #A78BFA}
.tl-list li.got .ct{color:#fff;animation:pop .6s}
.tl-list li.new .nm::after{content:"nouveau";margin-left:8px;font:500 .62rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#34D399}

/* ---------- l'analyse d'un import ---------- */
.an{position:fixed;z-index:27;left:calc(min(320px,100vw) + 28px);top:50%;transform:translateY(-55%);width:min(380px,calc(100vw - 380px));background:var(--panel);border:1px solid #26262E;border-radius:14px;padding:18px;display:grid;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.an .ah{display:flex;gap:12px;align-items:center}
.an .th2{width:64px;height:64px;border-radius:10px;background:#222 center/cover;flex:none;border:1px solid #2E2E36}
.an .k,.k{font:500 .68rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.an h3{margin:2px 0 0;font:400 1.2rem/1.15 var(--display)}
.an dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.88rem}
.an dt{color:var(--soft)}.an dd{margin:0}
.an .dests{display:grid;gap:6px}
.an label{display:flex;gap:10px;align-items:center;font-size:.88rem;cursor:pointer}
.an input[type=checkbox]{accent-color:#A78BFA;width:16px;height:16px}
.an .acts{display:flex;gap:8px;justify-content:flex-end}
.an .note{font-size:.75rem;color:var(--soft);line-height:1.4}

/* ---------- le chemin lumineux ---------- */
#flow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
#flow .fp{fill:none;stroke:url(#flg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 8;animation:march 1s linear infinite;opacity:.85;filter:url(#glo)}
#flow .fp.go{stroke-dasharray:none;animation:none;opacity:1}
#flow .sp{fill:#fff;filter:url(#glo)}

/* ---------- la timeline unique ---------- */
.tl{position:fixed;z-index:28;left:0;right:0;bottom:0;height:calc(var(--tlh) + env(safe-area-inset-bottom,0px));padding:10px max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));background:rgba(10,10,12,.9);backdrop-filter:blur(12px);border-top:1px solid #1C1C22;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.tl .zm{display:flex;gap:4px}
.tl .zm .chip{padding:5px 8px}
.trk{position:relative;height:3.6rem}
.trk .ax{position:absolute;left:0;right:0;top:55%;height:2px;background:var(--grad);opacity:.55;border-radius:2px}
.trk .tk{position:absolute;top:calc(55% + 8px);transform:translateX(-50%);font:500 .62rem var(--mono);color:var(--soft);white-space:nowrap}
.trk .tk::before{content:"";position:absolute;left:50%;top:-10px;width:1px;height:6px;background:#3A3A45}
.trk .now{position:absolute;top:8%;bottom:20%;width:2px;background:#fff;border-radius:2px;box-shadow:0 0 10px #fff}
.trk .now::after{content:"maintenant";position:absolute;top:-2px;left:6px;font:500 .58rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#fff}
.trk .ev{position:absolute;top:55%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:4px;border:0;padding:0;cursor:pointer;background:var(--c)}
.trk .ev:hover,.trk .ev:focus-visible{outline:2px solid #fff;outline-offset:2px}
.trk .ev.flash{animation:pop .8s 3;box-shadow:0 0 18px var(--c)}
.trk .lbx{position:absolute;bottom:62%;transform:translateX(-50%);background:var(--ink);color:var(--desk);font:600 .72rem var(--ui);padding:5px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}

/* ---------- la carte universelle : l'essentiel, un média, un chevron ---------- */
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,5,7,.6);backdrop-filter:blur(8px);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.uc{position:relative;width:min(400px,100%);max-height:100%;border-radius:30px;padding:10px;border:1.5px solid transparent;background:linear-gradient(#111115,#111115) padding-box,var(--conic) border-box;box-shadow:0 30px 100px rgba(124,92,255,.28);display:flex;flex-direction:column;overflow:hidden}
.uc.deep{height:min(620px,100%)}
.hm{position:relative;height:clamp(250px,44vh,320px);border-radius:22px;overflow:hidden;flex:none;box-shadow:0 14px 30px rgba(0,0,0,.45);touch-action:pan-y;outline:none}
.hm:focus-visible{box-shadow:0 0 0 2px #fff}
.hs{position:absolute;inset:0}
.sl{position:absolute;inset:0;background-size:cover;background-position:center}
.hm::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.6));pointer-events:none;z-index:1}
.pt{display:grid;place-items:center;overflow:hidden}
.pt i{position:absolute;border-radius:8px;background:rgba(255,255,255,.14);filter:blur(1.5px)}
.pt .mono{position:relative;font:400 7rem/1 var(--display);color:rgba(255,255,255,.92);letter-spacing:-.04em;margin-top:-30px}
.pt .glass{position:absolute;left:50%;top:62%;transform:translateX(-50%);z-index:2}
.sl .kd{position:absolute;left:14px;top:14px;max-width:calc(50% - 56px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 .6rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);padding:3px 7px;border-radius:7px;z-index:2}
.sl .pl{position:absolute;left:50%;top:44%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3)}
.sl .pl::after{content:"";position:absolute;left:20px;top:15px;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
.bars{position:absolute;left:18%;right:18%;top:22%;height:36%;display:flex;gap:4px;align-items:flex-end}
.bars i{flex:1;background:rgba(255,255,255,.85);border-radius:3px;height:100%;transform-origin:bottom;animation:bars 1.1s ease-in-out infinite}
.hov{position:absolute;left:18px;right:14px;bottom:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;z-index:2}
.who{min-width:0}
.who b{display:block;font:400 1.55rem/1.1 var(--display);color:#fff}
.who span{display:block;font-size:.9rem;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glass{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;border-radius:14px;padding:11px 16px;font:600 .9rem var(--ui);cursor:pointer;white-space:nowrap}
.glass:hover{background:rgba(255,255,255,.26)}
.glass:focus-visible,.chev:focus-visible,.lnk button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hx{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;padding:0;display:grid;place-items:center}
.hx .ico{width:18px;height:18px}
.hd{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:3}
.hd button{width:22px;height:16px;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.hd button::before{content:"";width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45);transition:width .3s,background .3s}
.hd button[aria-current=true]::before{width:16px;background:#fff}
.ex{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.uc.open .ex{grid-template-rows:1fr}
.exi{overflow:hidden;min-height:0}
.exc{margin-top:10px;background:#18181D;border-radius:22px;padding:18px;display:grid;gap:12px}
.exc .ti{font:600 1.02rem/1.3 var(--ui)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{background:#24242B;border-radius:12px;padding:6px 12px;font-size:.85rem;color:#BDBDC7}
.exc hr{border:0;border-top:1px solid #2A2A32;margin:2px 0;width:100%}
.exc p{margin:0;color:#BDBDC7;font-size:.95rem;line-height:1.55}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.lnk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lnk button{display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1px solid #2A2A32;background:transparent;cursor:pointer;font:500 .8rem var(--ui);color:var(--ink)}
.lnk button:hover{border-color:#4A4A55}
.lnk .ico{width:20px;height:20px;color:var(--acc)}
.chev{align-self:center;width:56px;height:40px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:#fff;margin-top:4px;flex:none;border-radius:12px}
.chev svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s}
.uc.open .chev svg{transform:rotate(180deg)}
.dl{position:absolute;inset:0;pointer-events:none;border-radius:28px;overflow:hidden;z-index:5}
.lv{position:absolute;inset:0;padding:16px 18px 18px;overflow:auto;background:#111115;pointer-events:auto;transform-origin:50% 50%}
.lvh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lvh button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.82rem}
.lvh b{font:400 1.25rem var(--display)}
.sq{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:1.2rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal .wd{font:500 .62rem var(--mono);color:var(--soft);text-align:center;padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:9px;border:1px solid #23232A;background:var(--card);cursor:pointer;font:500 .8rem var(--ui);position:relative;padding:0}
.cal button.free::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#34D399}
.cal button.busy{color:#5E5E68;background:#111115}
.cal button.evt{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,#16161B);color:#fff}
.cal button.today{outline:1.5px solid #fff;outline-offset:-1.5px}
.cal .em0{visibility:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mh b{font:400 1.15rem var(--display)}
.lg{display:flex;gap:12px;font-size:.72rem;color:var(--soft);margin-top:10px;flex-wrap:wrap}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.sec{margin-top:14px;display:grid;gap:8px}
.sec h4{margin:0;font:500 .68rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #23232A;border-radius:12px;background:var(--card);font-size:.88rem;flex-wrap:wrap}
.row .ico{width:18px;height:18px;flex:none}
.row .sp2{margin-left:auto;display:flex;gap:6px;align-items:center}
.row.bz{color:#6A6A74}
.row input[type=text],.row input[type=password]{width:7.5em;background:#0C0C10;border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink);font:500 .85rem var(--mono)}
.ok{color:#34D399;font-weight:600}
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:#2A2A33;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:#7C5CFF}
.sw[aria-checked=true]::after{transform:translateX(18px)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--tlh) + 24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--desk);padding:10px 14px;border-radius:12px;font:600 .85rem var(--ui);transition:opacity .3s,transform .3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){
 :root{--tlh:6.6rem}
 .top{grid-template-columns:auto 1fr auto}.modes{justify-self:center}.modes a{width:34px}.rt .lab{display:none}
 .tl{grid-template-columns:1fr;gap:4px;padding-top:8px}
 .an{left:16px;right:16px;width:auto;top:auto;bottom:calc(var(--tlh) + 80px + env(safe-area-inset-bottom,0px));transform:none;max-height:58vh;overflow:auto}
 .tree{width:min(300px,86vw)}
 .center{top:40%}
 .ov{padding:8px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="top">
 <a class="mk" href="/">AIME<sup>®</sup></a>
 <nav class="modes" aria-label="Les quatre vues"></nav>
 <div class="rt"><a class="lab" href="/lab/orb/">Lab</a><button class="av" id="av" aria-label="Ma carte universelle" aria-haspopup="dialog"><span id="avi">M</span></button></div>
</header>

<div class="center" id="center">
 <div class="orb" aria-hidden="true"></div>
 <h1>Quatre points fixes. <em>Rien d'autre.</em></h1>
 <p>Tout ce qui entre passe par le dossier. Tout le temps tient sur une ligne. Tout ce qui est vous tient sur une carte.</p>
</div>
<div class="tips" id="tips" aria-hidden="true"></div>

<aside class="tree" id="tree" aria-label="Point Zéro" aria-hidden="true">

/* =========================================================
   1. LA TIMELINE UNIQUE — une seule ligne, quatre zooms
   ========================================================= */
var NOW=new Date();function D(y,m,d,h,mi){return new Date(y,m-1,d,h||12,mi||0)}
var EV=[{t:new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate(),10,0),n:'Appel avec Studio Lumen',c:'#22D3EE'},{t:new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate(),19,0),n:'Répétition sax',c:'#FB923C'},
 {t:new Date(NOW.getTime()+3*864e5),n:'Mariage au Château (sax)',c:'#FB923C'},{t:new Date(NOW.getTime()+5*864e5),n:'Visite du lieu',c:'#A78BFA'},{t:new Date(NOW.getTime()+19*864e5),n:'Essayage',c:'#FB7185'},

var JJ=EV[EV.length-1].t;
var ZM=[['jour','Jour'],['semaine','Semaine'],['mois','Mois'],['annee','Année']],zoom='mois',flashT=null;
$('.zm').innerHTML=ZM.map(function(z){return'<button class="chip" type="button" data-z="'+z[0]+'" aria-pressed="false">'+z[1]+'</button>'}).join('');
var MO=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],JO=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
function range(){var n=NOW.getTime(),d0=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()).getTime();
 if(zoom==='jour')return[d0+7*36e5,d0+23.5*36e5];if(zoom==='semaine')return[d0-864e5,d0+6.5*864e5];if(zoom==='mois')return[n-3*864e5,n+31*864e5];return[n-20*864e5,Math.max(n+330*864e5,JJ.getTime()+25*864e5)]}
function ticks(a,b){var out=[],t;if(zoom==='jour'){for(t=Math.ceil(a/72e5)*72e5;t<=b;t+=72e5){var d=new Date(t);out.push([t,d.getHours()+'h'])}}
 else if(zoom==='semaine'||zoom==='mois'){var step=zoom==='semaine'?1:4,d1=new Date(a);d1.setHours(0,0,0,0);for(t=d1.getTime()+864e5;t<=b;t+=864e5*step){var dd=new Date(t);out.push([t,(zoom==='semaine'?JO[dd.getDay()]+' ':'')+dd.getDate()+(zoom==='mois'?' '+MO[dd.getMonth()]:'')])}}
 else{var m=new Date(a);m.setDate(1);m.setHours(0,0,0,0);m.setMonth(m.getMonth()+1);for(;m.getTime()<=b;m.setMonth(m.getMonth()+1))out.push([m.getTime(),MO[m.getMonth()]+(m.getMonth()===0?' '+m.getFullYear():'')])}return out}

 h+='<span class="now" style="left:'+x(NOW.getTime(),r)+'%"></span>';
 EV.forEach(function(e,i){var p=x(e.t.getTime(),r);if(p<0||p>100)return;h+='<button class="ev'+(flashT===e?' flash':'')+'" type="button" data-e="'+i+'" style="left:'+p+'%;--c:'+e.c+'" aria-label="'+esc(e.n+', '+fmt(e.t))+'"></button>'});
 $('#trk').innerHTML=h;$$('.zm .chip').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.z===zoom?'true':'false')})}
function fmt(t){return JO[t.getDay()]+' '+t.getDate()+' '+MO[t.getMonth()]+' '+t.getFullYear()+(t.getHours()!==12?', '+t.getHours()+'h'+(t.getMinutes()?String(t.getMinutes()).padStart(2,'0'):''):'')}

var TREE=[{id:'pz',n:'Point Zéro',d:0},{id:'mar',n:'Mariage Léa & Marc',d:1},{id:'jj',n:'Jour J',d:2},{id:'pre',n:'Prestataires',d:2},{id:'doc',n:'Documents',d:2},{id:'med',n:'Médias',d:2},{id:'ret',n:'Retouche photo',d:1},{id:'con',n:'Contacts',d:1},{id:'dem',n:'Demandes reçues',d:1}];
var CNT={pz:0,mar:0,jj:4,pre:6,doc:9,med:24,ret:2,con:41,dem:0};
function parentOf(i){for(var j=i-1;j>=0;j--)if(TREE[j].d<TREE[i].d)return j;return-1}
function renderTree(){$('#tlist').innerHTML=TREE.map(function(n){return'<li data-id="'+n.id+'" data-d="'+n.d+'" style="--x:'+(30+n.d*22)+'px"><span class="dot"></span><span class="nm">'+esc(n.n)+'</span><span class="ct">'+(n.d?CNT[n.id]:'')+'</span></li>'}).join('');drawTreeLines()}
function drawTreeLines(){var ul=$('#tlist'),sv=$('#tsv'),R=ul.getBoundingClientRect(),h='';sv.setAttribute('width',R.width);sv.setAttribute('height',ul.scrollHeight);
 $$('li',ul).forEach(function(li,i){var p=parentOf(i);if(p<0)return;var a=dotXY(ul.children[p],R),b=dotXY(li,R);h+='<path d="M'+a[0]+' '+a[1]+'V'+b[1]+'H'+(b[0]-6)+'"/>'});sv.innerHTML=h}
function dotXY(li,R){var r=li.querySelector('.dot').getBoundingClientRect();return[r.left+r.width/2-(R?R.left:0),r.top+r.height/2-(R?R.top:0)]}
var treeOn=false;function setTree(on){treeOn=on;$('#tree').classList.toggle('on',on);$('#tree').setAttribute('aria-hidden',on?'false':'true');$('#pz').setAttribute('aria-expanded',on?'true':'false');$('#center').style.opacity=on&&innerWidth<1100?.15:1;if(!on){closeAn()}hideTips()}

$('#impb').addEventListener('click',function(){$('#file').click()});

['dragleave','drop'].forEach(function(t){document.addEventListener(t,function(e){if(t==='dragleave'&&e.relatedTarget)return;$('#pz').classList.remove('drag')})});

$$('[data-ex]').forEach(function(b){b.addEventListener('click',function(){analyze(example(b.dataset.ex))})});

/* vignettes des exemples, dessinées sur place */
function thumb(kind){var c=document.createElement('canvas');c.width=c.height=160;var g=c.getContext('2d');
 if(kind==='devis'){g.fillStyle='#F4F4F6';g.fillRect(0,0,160,160);g.fillStyle='#0A0A0C';g.font='600 18px sans-serif';g.fillText('DEVIS',18,34);g.fillStyle='#BBB';for(var i=0;i<6;i++)g.fillRect(18,52+i*14,i%2?80:118,5);g.fillStyle='#7C5CFF';g.fillRect(18,138,60,8)}
 else if(kind==='broderie'){g.fillStyle='#F6EFE6';g.fillRect(0,0,160,160);g.strokeStyle='#C2185B';g.lineWidth=3;for(var k=0;k<8;k++){g.beginPath();g.ellipse(80+Math.cos(k*.785)*26,80+Math.sin(k*.785)*26,22,10,k*.785,0,6.283);g.stroke()}g.fillStyle='#F59E0B';g.beginPath();g.arc(80,80,12,0,6.283);g.fill();g.setLineDash([4,4]);g.strokeStyle='#999';g.lineWidth=1;g.strokeRect(14,14,132,132)}
 else{var gr=g.createLinearGradient(0,0,0,160);gr.addColorStop(0,'#FDBA74');gr.addColorStop(.55,'#FB7185');gr.addColorStop(1,'#4C1D95');g.fillStyle=gr;g.fillRect(0,0,160,160);g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(110,58,16,0,6.283);g.fill();g.fillStyle='#1E1B2E';g.beginPath();g.moveTo(0,160);g.lineTo(0,118);g.quadraticCurveTo(50,96,90,120);g.quadraticCurveTo(130,140,160,112);g.lineTo(160,160);g.fill();g.fillRect(58,88,6,34);g.fillRect(70,92,6,30)}
 return c.toDataURL()}
function example(k){if(k==='devis')return{kind:'devis',name:'devis-studio-lumen.pdf',title:'Devis de Studio Lumen',thumb:thumb('devis'),fields:[['Type','Devis'],['De','Studio Lumen, photographe'],['Montant','1 200 € TTC'],['Pour','Jour J, '+JJ.getDate()+' '+MO[JJ.getMonth()]+' '+JJ.getFullYear()],['Acompte','30 % à la signature']],dests:['doc','pre','jj','tl'],date:JJ,color:'#22D3EE',ev:'Devis Studio Lumen'};
 return{kind:'image',name:'coucher-de-soleil.jpg',title:'Photo « coucher de soleil »',thumb:thumb('photo'),fields:[['Type','Photo JPEG'],['Taille','4 032 × 3 024 px'],['Lu comme','Paysage, lumière chaude, horizon penché de 2°']],ask:true,use:'ret',dests:['ret','med'],color:'#FB7185'}}
/* un vrai fichier : on lit ce qu'on peut lire ici (type, taille, dimensions) ; la lecture du contenu se fera côté serveur */
function analyzeFile(f){if(!treeOn)setTree(true);var n=f.name,lo=n.toLowerCase(),kb=f.size<1048576?Math.round(f.size/1024)+' Ko':(f.size/1048576).toFixed(1).replace('.',',')+' Mo';
 if(/^image\//.test(f.type)){var url=URL.createObjectURL(f),im=new Image();im.onload=function(){analyze({kind:'image',name:n,title:'Image « '+n+' »',thumb:url,fields:[['Type',f.type.replace('image/','Image ').toUpperCase().replace('IMAGE','Image')],['Taille',im.naturalWidth+' × '+im.naturalHeight+' px · '+kb]],ask:true,use:'ret',dests:['ret','med'],color:'#FB7185'})};im.onerror=function(){analyze({kind:'autre',name:n,title:n,fields:[['Taille',kb]],dests:['doc'],color:'#A78BFA'})};im.src=url;return}
 var t=/factur/.test(lo)?'Facture':/contrat/.test(lo)?'Contrat':/devis/.test(lo)?'Devis':f.type==='application/pdf'?'Document PDF':/^audio\//.test(f.type)?'Musique':/^video\//.test(f.type)?'Vidéo':'Fichier';
 var media=/Musique|Vidéo/.test(t),dated=/Devis|Facture|Contrat/.test(t);
 analyze({kind:media?'media':'doc',name:n,title:t+' « '+n+' »',fields:[['Type',t],['Taille',kb],['À vérifier',media?'Titre et auteur':dated?'Montant, date et signataire':'Contenu']],dests:media?['med']:dated?['doc','jj','tl']:['doc'],date:dated?JJ:null,color:media?'#FB923C':'#A78BFA',ev:t+' importé'})}
var CUR=null;
var DN={doc:'Documents du mariage',pre:'Prestataires · Studio Lumen',jj:'Jour J',med:'Médias',ret:'Retouche photo',tl:'Timeline'};
function analyze(it){CUR=it;var el=$('#an');
 var h='<div class="ah"><div class="th2" style="background-image:url('+(it.thumb||'')+')"></div><div><span class="k">Ce que j\'ai compris</span><h3>'+esc(it.title)+'</h3></div></div><dl>'+it.fields.map(function(f){return'<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd>'}).join('')+'</dl>';
 if(it.ask)h+='<div class="sec" style="margin:0"><h4>Que voulez-vous en faire ?</h4><div class="imp" role="radiogroup">'+[['ret','Retouche'],['med','Médias seulement']].map(function(u){return'<button class="chip" type="button" role="radio" data-use="'+u[0]+'" aria-checked="'+(it.use===u[0])+'">'+u[1]+'</button>'}).join('')+'</div></div>';

 h+='<p class="note">Rien n\'est rangé tant que vous ne confirmez pas. Le chemin lumineux montre où l\'information va se propager.</p><div class="acts"><button class="btn" type="button" data-a="no">Annuler</button><button class="btn p" type="button" data-a="ok">Ranger</button></div>';
 el.innerHTML=h;el.hidden=false;el.querySelector('[data-a=ok]').focus({preventScroll:true});requestAnimationFrame(function(){if(CUR&&CUR.date)fitTL(CUR.date);showFlows(false)})}
$('#an').addEventListener('click',function(e){var u=e.target.closest('[data-use]');if(u&&CUR){CUR.use=u.dataset.use;CUR.dests=u.dataset.use==='med'?['med']:[u.dataset.use,'med'];analyze(CUR);return}
 var a=e.target.closest('[data-a]');if(!a)return;if(a.dataset.a==='no'){closeAn();return}commit()});

function closeAn(){$('#an').hidden=true;$('#fl').innerHTML='';CUR=null;$$('#tlist li').forEach(function(l){l.classList.remove('hot')})}

/* le chemin : du dossier, à la verticale le long de l'arbre, puis de branche en branche */
function pathTo(id){var pz=$('#pz').getBoundingClientRect(),fx=pz.left+pz.width/2,fy=pz.top+pz.height*.35;
 if(id==='tl'){var ev=CUR&&CUR.date?CUR.date:NOW,r=range(),tr=$('#trk').getBoundingClientRect(),ex=tr.left+tr.width*x(ev.getTime(),r)/100,ey=tr.top+tr.height*.55;return'M'+fx+' '+fy+'V'+ey+'H'+ex}
 var lis=$$('#tlist li'),i=TREE.findIndex(function(n){return n.id===id}),chain=[];while(i>=0){chain.unshift(i);i=parentOf(i)}
 var d='M'+fx+' '+fy;chain.forEach(function(k){var p=dotXY(lis[k]);d+='V'+p[1]+'H'+p[0]});return d}
var SPK=null;
function showFlows(go){var ds=chosen(),g=$('#fl');$$('#tlist li').forEach(function(l){l.classList.toggle('hot',ds.indexOf(l.dataset.id)>=0)});
 g.innerHTML=ds.map(function(d){return'<path class="fp'+(go?' go':'')+'" d="'+pathTo(d)+'"/>'}).join('');return ds}

 paths.forEach(function(p){var L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.transition='stroke-dashoffset '+(rm()?0:1.1)+'s cubic-bezier(.3,.7,.2,1)';p.style.strokeDashoffset=0});
 var t0=performance.now(),dur=rm()?10:1300,g=$('#fl');cancelAnimationFrame(SPK);
