 if(k==='frise'){var w=R*2.4,x=cx-w/2;[['15:00','Cérémonie'],['16:30','Vin d\'honneur'],['17:15','Photos'],['19:30','Dîner'],['21:00','Discours'],['22:30','Soirée']].forEach(function(e,i){var X=x+w*[.08,.22,.38,.55,.71,.9][i];h+=lab(X-30,cy+(i%2?18:-46),'<b>'+e[0]+'</b><br>'+e[1])})}
 if(k==='globe')PEOPLE.forEach(function(p){h+=lab(cx+p[0]*R+10,cy+p[1]*R-8,p[2])});
 if(k==='reseau'){var N=NODES(),T=['Vous','Lucie, témoin','Traiteur','Photographe','DJ','Lieu'];N.forEach(function(p,i){h+=lab(p[0]+(i?14:-12),p[1]-(i?24:R*.2),T[i])})}
 if(k==='recherche'){var w2=Math.min(R*2.6,MW());h+='<span class="lbl" id="q" style="left:'+(cx-w2/2+58)+'px;top:'+(cy-11)+'px;font-size:17px"></span>'}
 if(k==='carte'){var w3=Math.min(R*1.5,280),hh=w3*1.3,x3=cx-w3/2,y3=cy-hh/2;h+=lab(x3+14,y3+hh*.56-22,'<b>Studio Lumen</b>')+lab(x3+14,y3+hh-46,'Contacter','dk')}
 if(k==='formulaire'){var w4=Math.min(R*1.9,340),h4=w4*1.05,x4=cx-w4/2,y4=cy-h4/2;['Votre nom','Date de l\'événement','Lieu'].forEach(function(t,i){h+=lab(x4+34,y4+38+i*(h4*.2),'<span style="color:#9C9CA8">'+t+'</span>')});h+=lab(x4+w4/2-32,y4+h4-50,'Envoyer','dk')}
 if(k==='site'){var w5=Math.min(R*2.6,MW()),h5=w5*.66,x5=cx-w5/2,y5=cy-h5/2;h+=lab(x5+56,y5+8,'lemondeaime.com/@studio-lumen')}
 ov.innerHTML=h;requestAnimationFrame(function(){Array.prototype.forEach.call(ov.children,function(x,i){setTimeout(function(){x.classList.add('on')},120+i*90)})});
 if(k==='recherche'){var q=$('#q');if(q)typeIn(q,'photographe mariage Nantes',40)}}
function draw(){var c=fx.getContext('2d'),now=performance.now(),t=(now-FXT)/1000,cx=C[0],cy=C[1];c.clearRect(0,0,W,H);
 try{var b=envG.getBBox();if(b.width){cone.style.setProperty('--cx',(b.x+b.width/2)+'px');cone.style.setProperty('--cy',(b.y+b.height/2)+'px')}}catch(_){}
 if(!RM&&FXK){
  if(FXK==='ondes'||FXK==='sphere'){for(var i=0;i<3;i++){var u=((t*.45+i/3)%1);c.strokeStyle='rgba(196,181,253,'+(1-u)*.5+')';c.lineWidth=1.5;c.beginPath();c.arc(cx,cy,R*(FXK==='sphere'?.5:1)+u*R*.9,0,6.283);c.stroke()}}
  if(FXK==='partition'){var cols=W<760?12:18,g=R*2.4/cols,x0=cx-g*cols/2,ph=(t*3)%cols;c.fillStyle='rgba(255,255,255,.9)';c.fillRect(x0+ph*g,cy-g*2.5-6,2,g*5+12)}
  if(FXK==='globe'){var pts=PEOPLE.map(function(p){return[cx+p[0]*R,cy+p[1]*R]});for(var j=0;j<pts.length;j++){var a=pts[j],bq=pts[(j+1)%pts.length],mx=(a[0]+bq[0])/2,my=(a[1]+bq[1])/2-R*.35,pr=Math.max(0,Math.min(1,t*.6-j*.35));if(pr<=0)continue;c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.4;c.beginPath();c.moveTo(a[0],a[1]);for(var s2=1;s2<=24*pr;s2++){var q=s2/24,m=1-q;c.lineTo(m*m*a[0]+2*m*q*mx+q*q*bq[0],m*m*a[1]+2*m*q*my+q*q*bq[1])}c.stroke()}
   pts.forEach(function(p){c.fillStyle='#fff';c.beginPath();c.arc(p[0],p[1],4,0,6.283);c.fill()});var seg=Math.floor(t*.6)%pts.length,fr=(t*.6)%1,A=pts[seg],B=pts[(seg+1)%pts.length],MX=(A[0]+B[0])/2,MY=(A[1]+B[1])/2-R*.35,mm=1-fr;dot(c,mm*mm*A[0]+2*mm*fr*MX+fr*fr*B[0],mm*mm*A[1]+2*mm*fr*MY+fr*fr*B[1],9,t)}
  if(FXK==='reseau'){var N=NODES(),path=[0,1,4,0,2,5,3,0],sg=Math.floor(t*.7)%(path.length-1),f2=(t*.7)%1,P1=N[path[sg]],P2=N[path[sg+1]];dot(c,P1[0]+(P2[0]-P1[0])*f2,P1[1]+(P2[1]-P1[1])*f2,10,t)}
  if(FXK==='lecteur'){var w6=Math.min(R*2.6,MW()),x6=cx-w6/2,pp=(t*.08)%1;c.fillStyle='#fff';c.fillRect(x6+28,cy-2,w6*.18*pp,4)}
 }
 requestAnimationFrame(draw)}
function dot(c,x,y,r,t){var g=c.createRadialGradient(x,y,0,x,y,r*3);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.3,'hsla('+((t*60)%360)+',90%,70%,.8)');g.addColorStop(1,'rgba(124,92,255,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r*3,0,6.283);c.fill()}
addEventListener('scroll',function(){onScroll(false)},{passive:true});
var rz;addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){typed={};build()},200)});
build();requestAnimationFrame(draw);
})();
</script>
