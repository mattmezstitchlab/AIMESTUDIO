<title>Jour J Pièce par Pièce</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : landing verticale dans l'ordre de l'organisation (Maintenant → Invités → Prestataires → Budget → Avant → Tables → Jour J → Après).
   Fond et iPhone fixes ; le dock vertical à droite du téléphone remplace la navigation. Chaque donnée se saisit une fois et se propage. */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#737373; --line:#e6e6e6; --soft:#f5f5f4;
  --gold:#C9A06A; --red:#c2412d; --blue:#3f6b8f; --green:#4c9a6a;
  --head:"Archivo Narrow","Arial Narrow","Inter Tight",sans-serif;
  --disp:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sky1:#f3e8d5; --sky2:#d8c9ae;
  --ph:min(720px,calc(100svh - 110px)); --pw:calc(var(--ph) * .5); --dw:132px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:#f4f4f3;color:var(--fg);font-family:var(--disp);font-size:15px;line-height:1.45;letter-spacing:-.005em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.eb{font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.late{color:var(--red)}

/* fond */
#stage{position:fixed;inset:0;z-index:0}
#sky{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 35%,var(--sky1),var(--sky2) 80%)}
.media{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.media.on{opacity:1}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
#veil{position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 50%,transparent,rgba(0,0,0,.16))}

/* sections */
main{position:relative;z-index:1}
.sec{height:100vh;height:100svh;position:relative}
.card{position:absolute;top:50%;transform:translateY(-50%);left:max(28px,env(safe-area-inset-left,0px));width:min(300px,calc(50vw - var(--dw)/2 - var(--pw)/2 - 56px));
  background:rgba(255,255,255,.95);border:1px solid #e8e8e8;border-radius:14px;padding:20px;display:grid;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.card .n{font-family:var(--mono);font-size:12px;color:#a0a0a0}
.card h2{margin:0;font-weight:700;font-size:36px;line-height:.95;letter-spacing:-.045em}
.card .flow{display:grid;gap:3px;font-size:12.5px;color:#555;border-top:1px solid var(--line);padding-top:8px}
.card .flow b{font-weight:600;color:var(--fg)}
.card .bgrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .bgrow button{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;font-weight:600;font-size:11px}
.card .bgrow button:hover{border-color:var(--fg)}
.card .bgnote{font-size:11px;color:var(--muted)}
@media (max-width:1060px){.card{top:auto;bottom:16px;transform:none;left:16px;width:auto;max-width:220px;padding:12px 14px}.card .flow,.card .bgrow{display:none}.card h2{font-size:22px}}

/* dock vertical, à droite du téléphone */
#dock{position:fixed;z-index:4;top:0;bottom:0;right:0;width:var(--dw);display:flex;flex-direction:column;background:rgba(255,255,255,.96);border-left:1px solid #e6e6e6;
  padding:max(10px,env(safe-area-inset-top,0px)) max(0px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) 0}
#dock button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:none;border:0;border-bottom:1px solid #efefef;cursor:pointer;color:#8a8a8a;font-weight:600;font-size:12px;letter-spacing:-.01em;padding:4px}
#dock button:last-child{border-bottom:0}
#dock button:hover{background:var(--soft);color:var(--fg)}
#dock button[aria-current="true"]{background:var(--fg);color:#fff}
#dock svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#dock .badge{position:absolute;top:10px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 4px}
@media (max-width:1180px){:root{--dw:72px}#dock button span.l{font-size:9.5px}}

/* iPhone */
#phoneWrap{position:fixed;top:0;bottom:0;left:0;right:var(--dw);z-index:3;display:grid;place-items:center;pointer-events:none}
#phone{pointer-events:auto;position:relative;height:var(--ph);width:var(--pw);background:#0e0e0e;border-radius:56px;padding:12px;
  box-shadow:0 30px 80px rgba(0,0,0,.3),inset 0 0 0 2px #2a2a2a,inset 0 0 0 4px #0e0e0e,inset 0 0 0 5px #3a3a3a}
#phone::before{content:"";position:absolute;right:-3px;top:170px;width:3px;height:76px;background:#2a2a2a;border-radius:0 2px 2px 0}
#phone::after{content:"";position:absolute;left:-3px;top:140px;width:3px;height:46px;background:#2a2a2a;border-radius:2px 0 0 2px;box-shadow:0 64px 0 #2a2a2a,0 120px 0 #2a2a2a}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:45px;overflow:hidden;display:flex;flex-direction:column}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;max-height:31px;background:#000;border-radius:18px;z-index:30;overflow:hidden;transition:width .3s cubic-bezier(.3,0,.2,1),max-height .3s cubic-bezier(.3,0,.2,1),border-radius .3s}
#iBtn{display:block;width:100%;height:31px;background:none;border:0;color:#fff;font-size:22px;font-weight:300;line-height:31px;cursor:pointer;padding:0}
#iBtn:hover{color:var(--gold)}
#iMenu{display:none;padding:2px 10px 12px;gap:2px}
.island.open{width:calc(100% - 20px);max-height:420px;border-radius:26px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.island.open #iBtn{font-size:0;height:14px}
.island.open #iMenu{display:grid}
#iMenu .eb{padding:0 8px 6px}
#iMenu button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;text-align:left;cursor:pointer;padding:9px 8px;border-radius:12px;font-weight:600;font-size:14px;letter-spacing:-.01em}
#iMenu button:hover{background:#222}
#iMenu button i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center;font-size:14px;color:var(--gold);flex:none}
.status #stL{font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.02em}
#stR{display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:0;cursor:pointer;font-weight:600;font-size:12px;letter-spacing:-.01em}
#stR i{width:7px;height:7px;border-radius:50%}
.status{position:relative;flex:none;height:46px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 5px 30px;font-weight:600;font-size:14px}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:118px;height:5px;border-radius:3px;background:#111;z-index:31;pointer-events:none}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;flex:1;min-height:0;padding-bottom:26px}
.scroll::-webkit-scrollbar{display:none}

/* gabarit commun : en-tête, liste, action */
.head{flex:none;padding:10px 18px 14px;display:grid;gap:6px;border-bottom:1px solid var(--fg)}
.head .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-weight:700;font-size:50px;line-height:.88;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.big small{font-size:.38em;letter-spacing:-.02em;color:var(--muted);font-weight:600}
.line2{font-size:12.5px;color:#555;display:flex;gap:10px;flex-wrap:wrap}
.line2 b{color:var(--fg);font-weight:600}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.src{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;font-size:10.5px;font-weight:600;color:var(--muted)}
.src::before{content:"↖";font-size:10px}
.src:hover{color:var(--fg)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;font-weight:600;font-size:11px}
.iconbtn:hover{border-color:var(--fg)}
.iconbtn.warn{border-color:var(--red);color:var(--red)}
ul.L{list-style:none;margin:0;padding:0}
.L .grp{padding:14px 18px 5px;position:sticky;top:0;background:var(--bg);z-index:1}
.L li.it{border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr)}
.L .ck{display:grid;place-items:center;padding:0 0 0 16px;cursor:pointer}
.L .ck input{appearance:none;width:15px;height:15px;border:1.5px solid var(--fg);border-radius:4px;margin:0;cursor:pointer}
.L .ck input:checked{background:var(--fg)}
.L .dot{width:8px;height:8px;border-radius:50%;margin:0 0 0 18px;align-self:center}
.L .go{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;background:none;border:0;padding:10px 18px 10px 12px;text-align:left;cursor:pointer;min-width:0;align-items:center}
.L li.it.nock .go{grid-column:1/3;padding-left:18px}
.L .go:hover{background:var(--soft)}
.L .t{font-weight:600;font-size:14px;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.L .s{grid-column:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.L .v{grid-row:1/3;grid-column:2;text-align:right;font-weight:700;font-size:17px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.L .v small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:0}
.L li.done .t{text-decoration:line-through;color:var(--muted)}
.act{margin:14px 18px 0;width:calc(100% - 36px);background:none;border:1px dashed #c4c4c4;border-radius:10px;padding:10px;cursor:pointer;font-weight:600;font-size:12.5px}
.act:hover{border-color:var(--fg)}
.act.arm{border-color:var(--red);color:var(--red)}
.stp{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:11px;color:#6f6f6f;white-space:nowrap}
.stp::before{content:"";width:7px;height:7px;border-radius:50%;background:#c9c9c9}
.st1::before{background:var(--blue)} .st2::before{background:var(--gold)} .st3::before{background:#c98a3a} .st4::before{background:var(--green)}
.tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:1px}

/* Maintenant */
.names{font-weight:700;font-size:32px;line-height:.95;letter-spacing:-.045em}
.basechips{display:flex;gap:6px;flex-wrap:wrap}
.basechips button{background:var(--soft);border:0;border-radius:7px;padding:4px 8px;cursor:pointer;font-size:11.5px;font-weight:600}
.basechips button:hover{background:#ebebe9}

/* Jour J */
.tl{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:54px minmax(0,1fr)}
#scr{position:relative;height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
#scr::-webkit-scrollbar{display:none}
#axis{position:relative}
#railL{position:absolute;inset:0;border-right:1px solid var(--fg);pointer-events:none}
.tk{position:absolute;right:0;height:1px;background:var(--fg)}
.tk.f{width:4px;opacity:.35} .tk.q{width:9px;opacity:.6} .tk.h{width:16px;height:1.5px}
.hl{position:absolute;right:20px;transform:translateY(-50%);font-family:var(--mono);font-size:9.5px}
.hl.j{font-size:7.5px;color:var(--muted);transform:translateY(-170%)}
.sun{position:absolute;left:4px;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--gold)}
.golden{position:absolute;right:0;width:3px;background:var(--gold)}
.mk{position:absolute;right:-6px;width:11px;height:11px;transform:translateY(-50%);border-radius:50%;border:1.5px solid var(--fg);background:var(--bg);cursor:pointer;padding:0;z-index:2}
.mk.g{width:13px;height:13px;right:-7px;border-color:var(--gold);background:var(--gold)}
.mk.bad{border-color:var(--red);background:var(--red)}
.mk.cur{background:var(--fg);border-color:var(--fg);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--fg)}
.mk.dim{opacity:.25}
#needle{position:absolute;left:0;width:54px;height:0;border-top:1.5px solid var(--gold);z-index:5;pointer-events:none}
#needle::after{content:"";position:absolute;right:-7px;top:-6px;border:5px solid transparent;border-left:7px solid var(--gold)}
#panel{min-width:0;min-height:0;display:flex;flex-direction:column;padding:10px 12px 0 16px;overflow:hidden}
.ptop{flex:none;display:flex;justify-content:flex-end;gap:5px;flex-wrap:wrap}
.ptop:empty{display:none}
.chip{border:0;background:var(--fg);color:var(--bg);padding:4px 8px;border-radius:7px;cursor:pointer;font-weight:600;font-size:10.5px}
.z-title{flex:0 1 104px;min-height:52px;display:flex;align-items:flex-end;overflow:hidden}
.p-title{margin:0;background:none;border:0;padding:0;cursor:pointer;text-align:left;line-height:.92;letter-spacing:-.045em;font-weight:700;font-size:50px;overflow-wrap:anywhere;width:100%}
.p-when{flex:none;background:none;border:0;padding:8px 0 0;cursor:pointer;text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;height:24px}
.z-desc{flex:none;height:58px;padding-top:6px;overflow:hidden}
.p-desc{margin:0;font-size:13px;color:#333;cursor:pointer;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.z-warn{flex:none;height:20px;overflow:hidden}
.warnmsg{color:var(--red);font-size:12px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-figs{flex:none;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,48px);border-top:1px solid var(--fg)}
.st{display:grid;align-content:center;justify-items:start;gap:1px;background:none;border:0;border-bottom:1px solid var(--line);padding:0 4px 0 0;cursor:pointer;text-align:left;min-width:0}
.st:nth-child(even){padding-left:9px;border-left:1px solid var(--line)}
.st b{font-weight:700;font-size:22px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.st span{font-size:9.5px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.st.empty{cursor:default}
.z-next{flex:none;height:30px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.z-next button{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st:hover,.p-title:hover,.p-when:hover,.p-desc:hover{background:var(--soft);border-radius:4px}
#todoBox{flex:none;height:142px;border-top:1px solid var(--fg);display:flex;flex-direction:column;padding:9px 16px 22px}
#todoBox .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#todoBox .h button{background:none;border:0;padding:0;cursor:pointer;font-weight:600;font-size:11px;text-decoration:underline;text-underline-offset:3px}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:5px;overflow-y:auto;min-height:0;scrollbar-width:none}
.todo::-webkit-scrollbar{display:none}
.todo label{display:grid;grid-template-columns:15px 1fr auto;gap:8px;align-items:start;cursor:pointer;font-size:13px;line-height:1.3}
.todo input{appearance:none;width:13px;height:13px;border:1.5px solid var(--fg);border-radius:3px;margin:2px 0 0;cursor:pointer}
.todo input:checked{background:var(--fg)}
.todo input:checked+span{text-decoration:line-through;color:var(--muted)}
.todo em{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--blue);text-transform:uppercase;padding-top:2px}
@media (max-height:760px){#todoBox{height:118px}.p-figs{grid-template-rows:repeat(2,42px)}.z-desc{height:46px}.p-desc{-webkit-line-clamp:2}}

/* plan de table */
.plan{display:block;margin:4px 0}
.tbl{cursor:pointer}
.t-body{fill:var(--soft);stroke:var(--fg);stroke-width:1.2}
.tbl:hover .t-body{fill:#ebebe9}
.t-over{stroke:var(--red);stroke-width:2}
.s-on{fill:var(--gold)} .s-off{fill:var(--bg);stroke:#c4c4c4;stroke-width:1}
.t-name{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:-.02em;fill:var(--fg)}
.t-count{font-family:var(--mono);font-size:8px;fill:var(--muted)}

/* édition sur place */
.L li.opened{background:var(--soft)}
.L li.xp{background:var(--soft);border-bottom:1px solid var(--line);padding:4px 18px 14px;display:grid;gap:10px}
.steps2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stepper{display:grid;grid-template-columns:1fr 28px auto 28px;align-items:center;gap:4px;background:var(--bg);border-radius:9px;padding:4px 4px 4px 9px}
.stepper span{font-size:11px;font-weight:600;color:var(--muted)}
.stepper b{font-weight:700;font-size:15px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.stepper button,.sq button,.wq button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px;line-height:1;padding:0}
.stepper button:hover,.sq button:hover,.wq button:hover{border-color:var(--fg)}
.names{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.names li{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{background:none;border:0;padding:0;cursor:pointer;font-weight:600;font-size:13px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .rg,.pc .rg{width:5px;height:5px;border-radius:50%;background:var(--blue);display:inline-block;vertical-align:2px}
.tri{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none;background:var(--bg)}
.tri button{border:0;background:none;padding:3px 7px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted)}
.tri button+button{border-left:1px solid var(--line)}
.tri button[aria-pressed="true"]{background:var(--fg);color:#fff}
input.inl{font-size:14px;padding:7px 9px;background:var(--bg)}
.pick.small button{font-size:11px;padding:4px 8px}
.morelink{justify-self:start;background:none;border:0;padding:0;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted)}
.morelink:hover{color:var(--fg)}
.dues{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.dues li{display:flex;justify-content:space-between;gap:8px;font-size:13px;align-items:center}
.dues label{display:flex;gap:7px;align-items:center;cursor:pointer}
.dues input{accent-color:var(--fg)}
.qa{display:flex;gap:4px;align-items:center;padding-right:12px}
.qa button{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 7px;font-size:11px;font-weight:600;cursor:pointer}
.qa button.ok{background:var(--fg);color:#fff;border-color:var(--fg)}
.L li.it:has(.qa){grid-template-columns:auto minmax(0,1fr) auto}
.L li.it:has(.qa) .go .v{display:none}
.L li.sw{position:relative;touch-action:pan-y}
.L li.sw.swiping>*{transform:translateX(var(--sx,0))}
.L li.sw.swiping{background:var(--soft)}
.L li.sw.swiping[data-dir="r"]{box-shadow:inset 6px 0 0 var(--green)}
.L li.sw.swiping[data-dir="l"]{box-shadow:inset -6px 0 0 var(--gold)}
.wq{display:flex!important;align-items:center;gap:4px;height:34px;padding-top:6px!important}
.wq b{font-family:var(--mono);font-size:12px;padding:0 6px}
.wq .x2{border:0;margin-left:auto;font-size:18px}
.st.sq{grid-template-columns:28px 1fr 28px;display:grid;align-items:center;justify-items:center;gap:3px;background:var(--soft);border-radius:6px}
.st.sq b{grid-column:2;grid-row:1}.st.sq span{grid-column:2;grid-row:2;font-size:8.5px}
.st.sq button{grid-row:1/3}
.st.sq button:last-child{grid-column:3}
.tdi{margin-top:2px;font-size:13px!important;padding:5px 8px!important}
.undo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.undo button{background:#fff;color:var(--fg);border:0;border-radius:7px;padding:5px 10px;font-weight:700;cursor:pointer}

function sunUTC(dateStr,lat,lon){
  const r=Math.PI/180,d=new Date(dateStr+'T12:00:00Z');if(isNaN(d))return null;
  const J=d.getTime()/864e5+2440587.5,n=Math.round(J-2451545+.0008),Js=n-lon/360;
  const M=(357.5291+.98560028*Js)%360,C=1.9148*Math.sin(M*r)+.02*Math.sin(2*M*r)+.0003*Math.sin(3*M*r);
  const L=(M+C+180+102.9372)%360,Jt=2451545+Js+.0053*Math.sin(M*r)-.0069*Math.sin(2*L*r);
  const dec=Math.asin(Math.sin(L*r)*Math.sin(23.4397*r));
  const cw=(Math.sin(-.833*r)-Math.sin(lat*r)*Math.sin(dec))/(Math.cos(lat*r)*Math.cos(dec));if(cw<-1||cw>1)return null;
  const w=Math.acos(cw)/r,toD=j=>new Date((j-2440587.5)*864e5);return{rise:toD(Jt-w/360),set:toD(Jt+w/360)};}
const parisM=dt=>{const p=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(dt);return +p.find(x=>x.type==='hour').value*60+ +p.find(x=>x.type==='minute').value;};
function computeSun(){const a=sunUTC(B().date,B().lat,B().lon);if(!a){SUN=null;return;}
  const d2=new Date(B().date+'T12:00:00Z');d2.setUTCDate(d2.getUTCDate()+1);const b=sunUTC(d2.toISOString().slice(0,10),B().lat,B().lon);
  SUN={rise:parisM(a.rise)-T0,set:parisM(a.set)-T0,rise2:b?parisM(b.rise)-T0+1440:null};}

let sw=null;

window.addEventListener('pointermove',ev=>{if(!sw||ev.pointerId!==sw.pid)return;const dx=ev.clientX-sw.x,dy=ev.clientY-sw.y;
  if(!sw.on){if(Math.abs(dy)>10){sw=null;return;}if(Math.abs(dx)<12)return;sw.on=true;sw.li.classList.add('swiping');}
  sw.dx=Math.max(-110,Math.min(110,dx));sw.li.style.setProperty('--sx',sw.dx+'px');sw.li.dataset.dir=sw.dx>0?'r':'l';});
window.addEventListener('pointerup',()=>{if(!sw)return;const s=sw;sw=null;if(!s.on)return;s.li.classList.remove('swiping');s.li.style.removeProperty('--sx');
  swJust=true;setTimeout(()=>swJust=false,60);if(Math.abs(s.dx)<70)return;const[kind,id]=s.li.dataset.sw.split('~');const right=s.dx>0;
  if(kind==='step'){const x=S.steps.find(q=>q.id===id);if(!x)return;if(right){if(!x.vr&&!x.ax)x.done=!x.done;}else x.o+=7;}

function stopPlay(){if(AU){try{AU.pause();}catch(e){}}if(PL&&PL.osc){try{PL.osc.forEach(o=>o.stop());}catch(e){}}clearInterval(plT);PL=null;paintPlay();}
function demoPlay(t){if(!PL||!t||PL.id!==t.id||PL.demo)return;PL.demo=true;PL.t0=performance.now();
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const beat=60/(t.bpm||100),now=AC.currentTime,osc=[];
    for(let k=0;k<Math.floor(30/beat);k++){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=k%4?440:660;g.gain.setValueAtTime(0,now+k*beat);g.gain.linearRampToValueAtTime(.12,now+k*beat+.005);g.gain.exponentialRampToValueAtTime(.0001,now+k*beat+.09);o.connect(g).connect(AC.destination);o.start(now+k*beat);o.stop(now+k*beat+.1);osc.push(o);}
    PL.osc=osc;}catch(e){}

  return `<div class="wl-live"><span class="eb">Infos à jour</span><b>${cer?esc(entryTitle(cer))+' · '+hhmm(cer.m):esc(dayName(0,true))}</b><span>${esc(vm?vm.n+' · ':'')}${esc(B().city||'')}</span>${sh?`<span class="late">Programme décalé de ${sh} min</span>`:''}</div>`;}
function showWelcome(step){let w=$('#welcome');if(!w){w=document.createElement('div');w.id='welcome';document.querySelector('#screen').appendChild(w);}
  const t=EV();closeSheet();closePersona();
  if(!step)w.innerHTML=`<div class="wl"><span class="eb">${esc(t.l)} · ${dayName(0,true)}</span><h1>${esc(B().names)}</h1>${liveInfo()}<p>${esc(B().city)} · bienvenue. Qui êtes-vous ?</p>
    <button type="button" class="btn solid" data-wl="guest">Je suis ${esc(t.guestL)}</button><button type="button" class="btn" data-wl="pro">Je suis prestataire</button>
    ${VIS.canW?'':'<p class="hint">Ce lien est en lecture seule : vous pourrez tout consulter, mais vos réponses ne seront pas enregistrées.</p>'}</div>`;
  else if(step==='guest')w.innerHTML=`<div class="wl"><button type="button" class="morelink" data-wl="">‹ Retour</button><h2>Votre nom</h2>${guestCard()?`<button type="button" class="wlcard" data-wc="1">${cardCover(guestCard(),true)}<span><b>Je suis ${esc(guestCard().n)}</b><small>Avec ma carte · tout est pré-rempli</small></span></button>`:''}<input type="search" id="wlQ" placeholder="Tapez votre nom" autocomplete="off"><ul class="wlL">${S.people.map(p=>`<li><button type="button" data-wg="${p.id}">${esc(p.n)}<small>${esc((groupById(p.g)||{}).n||'')}</small></button></li>`).join('')}</ul></div>`;
  else w.innerHTML=`<div class="wl"><button type="button" class="morelink" data-wl="">‹ Retour</button><h2>Votre métier</h2><ul class="wlL">${activeDom().map(d=>{const M=dom(d.id),v=vendorOf(d.id);return `<li><button type="button" data-wp="${d.id}">${esc(v?v.n:M.lab)}<small>${esc(M.lab)}</small></button></li>`;}).join('')}</ul></div>`;
  w.classList.add('on');const qi=w.querySelector('#wlQ');if(qi){qi.focus();qi.addEventListener('input',()=>{const v=qi.value.toLowerCase();w.querySelectorAll('[data-wg]').forEach(b=>b.parentElement.hidden=!b.textContent.toLowerCase().includes(v));});}}
function hideWelcome(){const w=$('#welcome');if(w)w.classList.remove('on');}
document.addEventListener('click',ev=>{const w=ev.target.closest('#welcome');if(!w)return;const a=ev.target.closest('[data-wl]'),g=ev.target.closest('[data-wg]'),p=ev.target.closest('[data-wp]');
  if(ev.target.closest('[data-wc]')){hideWelcome();addCardToEvent(guestCard());return;}
  if(a){showWelcome(a.dataset.wl);return;}
  if(g){const x={k:'invite',id:g.dataset.wg};rememberIdentity(x);hideWelcome();applyIdentity(x);return;}
  if(p){const x={k:'pro',id:p.dataset.wp};rememberIdentity(x);hideWelcome();applyIdentity(x);}});
function applyVisitor(){document.body.classList.toggle('visitor',!VIS.owner);if(!VIS.canW){canWrite=false;document.body.classList.add('readonly');}
  const x=hashLock()||savedIdentity();if(!applyIdentity(x))showWelcome();}
(async()=>{const hl=hashLock();if(hl)setTimeout(()=>applyIdentity(hl),0);
  if(!(window.claude&&window.claude.use))return;try{const u=await window.claude.use('user');if(!u)return;if(await u.isOwner())return;VIS.owner=false;const w=await u.can('data.write');VIS.canW=w!==false;applyVisitor();}catch(e){}})();

function openCard(id){const c=allCards().find(x=>x.id===id);if(!c)return;CA={c,open:false,playing:false,muted:false};$('#book').classList.add('on');renderCardView(c);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{CA.open=true;$('#book .bk').classList.add('open');startCardMusic(c);}));}
function startCardMusic(c){const t=cardTrack(c);if(!t||!t.prev)return;try{cardAudio=cardAudio||new Audio();cardAudio.src=t.prev;cardAudio.volume=0;cardAudio.currentTime=0;cardAudio.ontimeupdate=()=>{const b=$('#bkBar');if(b&&cardAudio.duration)b.style.width=(cardAudio.currentTime/cardAudio.duration*100)+'%';};
  cardAudio.onended=()=>{CA&&(CA.playing=false);syncPP();};const p=cardAudio.play();if(p&&p.then)p.then(()=>{CA.playing=true;syncPP();fadeTo(cardAudio,CA.muted?0:.85,1000);}).catch(()=>{CA.playing=false;syncPP();});}catch(e){}}
function syncPP(){const b=document.querySelector('[data-bk="pp"]');if(b)b.textContent=CA&&CA.playing?'❚❚':'▶';const m=document.querySelector('[data-bk="mute"]');if(m)m.textContent=CA&&CA.muted?'🔇':'🔊';}
function closeCard(now){if(!CA)return;const bk=$('#book .bk');if(bk)bk.classList.remove('open');if(cardAudio&&!cardAudio.paused)fadeTo(cardAudio,0,now?10:700,()=>cardAudio.pause());
  CA=null;setTimeout(()=>{if(!CA){$('#book').classList.remove('on');$('#book').innerHTML='';}},now?0:650);}

function addCardToEvent(c){if(c.dom==='guest'){let p=S.people.find(x=>x.n.toLowerCase()===c.n.toLowerCase());
    const isNew=!p;if(!p){p={id:uid('p'),n:c.n,g:(S.groups[0]||{}).id,rsvp:'oui',kid:false,regime:'',addr:'',table:'',lodge:''};S.people.push(p);}
    c.f=c.f||{};const mc=myCard();fillFromCard(p,mc&&mc.id===c.id?mc:c);GUESTP=p.id;commit();closeRegistry();
    try{rememberIdentity({k:'invite',id:p.id});}catch(e){}
    setPersona('invite',true);
    note(`${esc(c.n)} ${isNew?'ajouté aux':'relié aux'} ${EV().guestsL.toLowerCase()} · « Ma réponse » est pré-remplie`);return;}
  const conflict=takenElsewhere(c);const M=c.dom?dom(c.dom):domFor(c.role),role=M?M.roles[0]:c.role;let v=S.vendors.find(x=>x.role===role),was=v?priceOf(v.price):0,isNew=!v;
  if(!v){v={id:uid('v'),n:c.n,role,st:1,price:{k:'v',r:0},dues:[],docs:[],contact:'',note:''};S.vendors.push(v);}
  v.n=c.n;if(c.contact)v.contact=c.contact;if(c.price&&+c.price.r)v.price={k:c.price.k,r:+c.price.r};else{const m=(c.facts||[]).find(f=>/à partir/i.test(f[0]));if(m){const n=parseFloat(String(m[1]).replace(/[^\d,]/g,'').replace(',','.'));if(n)v.price={k:/invit/.test(m[1])?'g':'v',r:n};}}
  v.st=Math.max(v.st,1);if(!v.dues.length&&priceOf(v.price)>0)v.dues=[{l:'Acompte',a:Math.round(priceOf(v.price)*.3),o:-90,paid:false},{l:'Solde',a:null,o:-7,paid:false}];const mc=myCard();if(c.mine&&mc){mc.links=mc.links||{};mc.links[evKey()]=v.id;recordUse(mc);}commit();const d=priceOf(v.price)-was;closeCard();
  if($('#reg').classList.contains('open'))renderRegistry();
  if(conflict){note(`Attention : ${esc(c.n)} est déjà pris le ${esc(fmtDate(offDate(0)))} sur un autre événement · relié quand même, à confirmer avec lui`);return;}
  note(`${c.mine?'Date ajoutée à votre agenda · ':''}${esc(c.n)} ${isNew?'ajouté':'relié'} comme ${esc(role===role.toUpperCase()?role:role.toLowerCase())}${d?` · budget ${d>0?'+':''}${eur(d)}`:''} · son espace est prêt`);}

const ECHOS_URL='https://claude.ai/artifact/3yP5RGnwtWqtMDp1EqwEm3';
const slugE=()=>B().names.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'et').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const pick8=L=>L.length<=8?L:[...new Set(Array.from({length:8},(_,i)=>Math.round(i*(L.length-1)/7)))].map(i=>L[i]);
function echosData(){const P=S.people.filter(p=>p.rsvp!=='non'),seated=P.filter(p=>p.table),vm=vendorOf('venue'),cer=ACT.find(e=>e.id==='m17')||ACT.find(e=>e.pub);
  const team=[...S.vendors.filter(v=>v.st>=1).map(v=>`${v.n} ; ${v.role}`),...(EV().proches.includes('temoin')?S.people.filter(p=>/témoin/i.test(p.note||'')).map(p=>`${p.n} ; Témoin`):[])];
  return{v:1,src:'aime',k:evKey(),back:ART_URL,rsvp:ART_URL+'#'+rsvpAnchor(),b:aimeStyle(),pack:S.type==='seminaire'?'conf':'mariage',title:B().names,date:B().date,time:cer?hhmm(cer.m):'',venue:vm?vm.n:'',city:B().city,
    series:[...seated,...P.filter(p=>!p.table)].map(p=>`${p.n} ; ${p.table||'Table à venir'}`).join('\n'),team:team.join('\n'),list:pick8(ACT.filter(e=>e.pub)).map(e=>`${hhmm(e.m)} · ${entryTitle(e)}`).join('\n'),url:slugE()+'.fr',contact:'reponses@'+slugE()+'.fr',blurb:`Nous avons hâte de vous retrouver à ${B().city} le ${fmtDate(offDate(0))}. Tout le programme, les infos pratiques et votre réponse sont ici.`,
    ...(()=>{const c=myCard();if(!c)return{};const cv=c.cover&&typeof c.cover.src==='string'&&/^https?:/.test(c.cover.src)?c.cover.src:(typeof c.cover==='string'&&/^https?:/.test(c.cover)?c.cover:'');
      return{card:{id:c.id,code:c.code,n:c.n,roles:c.roles,status:c.status,minor:c.minor,vis:{level:c.vis.level},media:cv?{cover:cv}:{}}};})(),
    shift:+(PF().shift||0),planning:ACT.slice().sort((a,b)=>a.m-b.m).flatMap(e=>(e.who&&e.who.length?e.who:['Tous']).map(w=>({t:hhmm(e.m),role:/^tout le monde$/i.test(w)?'Tous':w,h:entryTitle(e)}))).slice(0,80),
    capsule:ART_URL+'#'+capAnchor(),...(()=>{const c=myCard();return c&&c.accord?{accord:c.accord}:{};})(),
    n:{guests:P.length,unseated:P.length-seated.length,tables:new Set(seated.map(p=>p.table)).size,moments:pick8(ACT.filter(e=>e.pub)).length,team:team.length}};}
function aimeStyle(){let c2='#E9E2D4';try{const el=document.querySelector('#sky')||document.body,bg=getComputedStyle(el).backgroundColor,m=bg&&bg.match(/\d+/g);if(m&&m.length>=3&&!(m.length>3&&+m[3]===0))c2='#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join('')}catch(e){}return{c1:'#111111',c2,paper:'#ffffff',ink:'#111111',font:'archivo'};}
const echosHref=()=>ECHOS_URL+'#aime='+echosCode();
const echosCode=()=>{const j=JSON.stringify(echosData());return btoa(unescape(encodeURIComponent(j))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
function renderEchos(){const x=echosData(),n=x.n;
  body.innerHTML=`<p class="hint" style="margin:0 0 12px">Vos données partent telles quelles dans AIME Studio. Rien n'est ressaisi : un invité déplacé ici change de marque-place là-bas au prochain envoi.</p>
  ${derived([`<span><b>${n.guests}</b> marque-places${n.unseated?` · dont ${n.unseated} sans table pour l’instant`:''}</span>`,`<span><b>${n.tables}</b> numéros de table</span>`,`<span><b>${n.moments}</b> moments dans le programme et le livret</span>`,`<span><b>${n.team}</b> badges prestataires</span>`])}
  <div style="display:grid;gap:8px;margin-top:14px"><button type="button" class="btn solid" id="echCopy">1 · Copier les données pour le Studio</button>
  <a class="btn" href="${ECHOS_URL}" target="_blank" rel="noopener" id="echGo" style="text-align:center;text-decoration:none">2 · Ouvrir AIME Studio ↗</a>
  <p class="hint" style="margin:0">Dans le Studio, collez-les avec « Importer depuis AIME ».</p>
  <textarea id="echCode" readonly hidden rows="3" style="font-family:var(--mono);font-size:11px"></textarea></div>
  <div style="display:grid;gap:8px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px"><span class="eb">Retour du Studio</span>
  <textarea id="echBack" rows="3" placeholder="Collez ici le code de retour copié dans le Studio" style="font-family:var(--mono);font-size:11px"></textarea>
  <button type="button" class="btn" id="echImp">Importer pointages, avis et documents</button></div>`;
  on('#echCopy','click',async()=>{const c='AIME:'+echosCode();try{await navigator.clipboard.writeText(c);note('Données copiées · collez-les dans le Studio, bouton « Importer depuis AIME »');}catch(e){const t=$('#echCode');t.hidden=false;t.value=c;t.select();note('Copiez le code sélectionné, puis collez-le dans le Studio');}});
  on('#echGo','click',()=>note('AIME Studio s’ouvre dans un nouvel onglet'));
  on('#echImp','click',()=>{const raw=($('#echBack').value||'').trim().replace(/^[A-Z-]+:/,'').replace(/^.*#echos=/,'');if(!raw){note('Collez d’abord le code de retour du Studio');return;}
    try{const c=raw.replace(/-/g,'+').replace(/_/g,'/'),y=JSON.parse(decodeURIComponent(escape(atob(c+'==='.slice((c.length+3)%4)))));const g=mergeEchos(y);note(g?'Retour importé'+g:'Rien de nouveau pour votre carte dans ce retour');$('#echBack').value='';}catch(e){note('Ce code n’est pas un retour du Studio. Recopiez-le en entier.');}});}
/* les bases */

  <label class="fld"><span>${S.type==='seminaire'?'Nom de l’événement':'Prénoms'}</span><input type="text" id="bN" value="${esc(b.names)}"></label>

  ${derived([`<span><b>${ACT.length}</b> moments le jour J · <b>${allSteps().filter(s=>s.kind==='step').length}</b> étapes avant</span>`,SUN?`<span>Coucher du soleil à <b>${hhmm(SUN.set)}</b></span>`:''])}`;

  body.querySelectorAll('[data-ty]').forEach(x=>x.addEventListener('click',()=>{const ty=x.dataset.ty;if(ty===(S.type||'mariage'))return;closeSheet();
    const mc=PF().myCard;withUndo(`Modèle ${TYPES[ty].l.toLowerCase()} chargé`,()=>{S=defaults(ty);S.type=ty;if(mc)S.prefs.myCard=mc;});lastFig=null;buildPersonas();setPersona('couple',true);renderAll();lastFig=figures();

  on('#bC','change',e=>{const v=e.target.value;if(CITIES[v]){b.city=v;[b.lat,b.lon]=CITIES[v];}else b.city='Lieu personnalisé';commit();renderBase();});
  on('#bLa','change',e=>{b.lat=parseFloat(e.target.value)||0;commit();renderBase();});on('#bLo','change',e=>{b.lon=parseFloat(e.target.value)||0;commit();renderBase();});
  on('#bCe','change',e=>{b.cer=e.target.value;commit();renderBase();});
  on('#bT','change',e=>{b.target=Math.max(0,parseFloat(e.target.value)||0);commit();});

  if(focus)focusEl({date:'#bD',city:'#bC',cer:'#bCe',target:'#bT'}[focus]||'#bN');}

function renderPer(){body.innerHTML=`<label class="fld"><span>Invités par table</span><input type="number" min="2" id="bP" value="${B().perTable}"></label>${derived([`<span><b>${tablesNeeded()}</b> tables nécessaires pour ${fmtN(guests())} invités attendus</span>`])}<button class="btn" type="button" id="pFit">Appliquer et replacer tout le monde</button>`;

/* invités */
function renderGroup(){const g=groupById(editId);if(!g){closeSheet();return;}const s=gStats(g),L=peopleOf(g.id);
  body.innerHTML=`<label class="fld"><span>Nom du groupe</span><input type="text" id="gN" value="${esc(g.n)}"></label>
  <div class="frow"><label class="fld"><span>Invités prévus</span><input type="number" min="0" id="gE" value="${g.est}"></label><label class="fld"><span>Dont enfants</span><input type="number" min="0" id="gK" value="${g.kids}"></label></div>
  <div class="frow"><label class="fld"><span>Oui reçus</span><input type="number" min="0" id="gY" value="${g.yes||0}"></label><label class="fld"><span>Non reçus</span><input type="number" min="0" id="gNo" value="${g.no||0}"></label></div>
  ${derived([`<span><b>${s.exp}</b> attendus · ${s.yes} oui · ${s.wait} en attente · ${s.no} non</span>`,`<span>Ces chiffres sont des estimations : dès que les noms en disent plus, ce sont les noms qui comptent.</span>`])}

  <button class="add" type="button" id="gAddP">+ Ajouter des noms à ce groupe</button></div>

  on('#gE','change',e=>{g.est=Math.max(0,parseInt(e.target.value)||0);commit();renderGroup();});
  on('#gK','change',e=>{g.kids=Math.max(0,parseInt(e.target.value)||0);commit();renderGroup();});
  on('#gY','change',e=>{g.yes=Math.max(0,parseInt(e.target.value)||0);commit();renderGroup();});

const REGIMES=['','Végétarien','Sans gluten','Sans porc','Allergie'];
function renderPerson(){const x=S.people.find(p=>p.id===editId);if(!x){closeSheet();return;}
  const others=S.people.filter(o=>o!==x),mine=S.rules.filter(r=>r.a===x.id||r.b===x.id);
  body.innerHTML=`<label class="fld"><span>Nom</span><input type="text" id="pN" value="${esc(x.n)}"></label>
  <div class="fld"><span>Réponse</span><div class="pick" id="pR">${[['oui','Oui'],['attente','En attente'],['non','Non']].map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${x.rsvp===k}">${l}</button>`).join('')}</div></div>
  <div class="frow"><label class="fld"><span>Groupe</span><select id="pG">${S.groups.map(g=>`<option value="${g.id}" ${g.id===x.g?'selected':''}>${esc(g.n)}</option>`).join('')}</select></label>

  <label class="chk"><input type="checkbox" id="pK" ${x.kid?'checked':''}> Enfant</label>
  <div class="frow"><label class="fld"><span>Table</span><select id="pT"><option value="">Non placé</option>${S.tables.map(t=>`<option ${t.n===x.table?'selected':''}>${esc(t.n)}</option>`).join('')}</select></label>
    <label class="fld"><span>Hébergement</span><select id="pH"><option value="">Aucun</option>${S.lodging.map(h=>`<option value="${h.id}" ${h.id===x.lodge?'selected':''}>${esc(h.n)}</option>`).join('')}</select></label></div>

    ${mine.map(r=>{const o=S.people.find(p=>p.id===(r.a===x.id?r.b:r.a)),z=ruleState(r);return `<div class="doclink"><span>${r.type==='apart'?'Pas avec':'Avec'} <b>${esc(o?o.n:'?')}</b> · <span class="${z.ok?'':'late'}">${esc(z.msg)}</span></span><button type="button" data-rr="${S.rules.indexOf(r)}">Retirer</button></div>`;}).join('')}
    ${others.length?`<div class="frow"><select id="pCt"><option value="apart">Ne pas placer avec</option><option value="together">Placer avec</option></select><select id="pCo">${others.map(o=>`<option value="${esc(o.id)}">${esc(o.n)}</option>`).join('')}</select></div><button class="add" type="button" id="pCadd">+ Ajouter la contrainte</button>`:''}</div></details>
  ${delBtn('Supprimer cet invité')}`;

  on('#pK','change',e=>{x.kid=e.target.checked;commit();});
  on('#pT','change',e=>{x.table=e.target.value;commit();renderPerson();});
  on('#pH','change',e=>{x.lodge=e.target.value;commit();});

  on('#pCadd','click',()=>{S.rules.push({a:x.id,b:q('#pCo').value,type:q('#pCt').value});commit();renderPerson();});

/* prestataires et dépenses : prix et échéancier communs */
function priceDuesHTML(o){return `<div class="frow"><label class="fld"><span>${o.price.k==='v'?'Montant (€)':'Prix unitaire (€)'}</span><input type="number" step="any" id="oR" value="${o.price.r}"></label><label class="fld"><span>Calcul</span>${kindSel(o.price.k,'id="oK"')}</label></div>

    ${!same?'<p class="hint">Cette capsule concerne un autre événement : ouvrez le lien reçu des mariés.</p>':open?`<h3>Un an déjà.</h3><p class="hint">${C.msgs.length} message${C.msgs.length>1?'s':''} scellé${C.msgs.length>1?'s':''} le jour J.</p><ul class="cap-l">${C.msgs.map(m=>`<li><b>${esc(m.n||'Anonyme')}</b><span>${esc(m.t)}</span></li>`).join('')||'<li><span>Aucun message.</span></li>'}</ul>`
    :`<h3>Un mot pour dans un an.</h3><p class="hint">Votre message reste scellé jusqu’au ${esc(fmtDate(od))}. Personne ne le lit avant, pas même les mariés.</p>
      <label>Votre prénom<input id="cpN" type="text" placeholder="Léa"></label><label>Votre message<textarea id="cpT" rows="4" placeholder="Ce que je vous souhaite pour votre première année…"></textarea></label>
      <div class="ld-nv"><button type="button" class="ld-btn solid" data-cp="seal">Sceller mon message</button></div>`}</div>
    <div class="ld-evprev"><span class="ld-k">Capsule temporelle</span><b>${C.msgs.length}</b><span>message${C.msgs.length>1?'s':''} scellé${C.msgs.length>1?'s':''}</span><i>${open?'Ouverte':'S’ouvre le '+esc(fmtDate(od))}</i></div></div>`;
  M.classList.add('open');}
document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('[data-cp]');if(!b)return;ev.stopPropagation();
  if(b.dataset.cp==='close'){closeMk();return;}
  if(b.dataset.cp==='seal'){const t=($('#cpT')||{}).value||'';if(!t.trim()){note('Écrivez d’abord votre message');return;}S.capsule=S.capsule||{msgs:[]};S.capsule.msgs.push({n:(($('#cpN')||{}).value||'').trim().slice(0,60),t:t.trim().slice(0,1200),at:Date.now()});save();openCapsule(capAnchor());note('Message scellé jusqu’au '+fmtDate(capOpenDate()));}},true);
/* pont Studio → AIME : création d'un mariage depuis l'assistant du Studio */
const b64uE=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64uD=c=>{c=String(c).trim().replace(/^AIME-NEW:/i,'').replace(/^.*#aime-?new[.=]/i,'').replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(c+'==='.slice((c.length+3)%4)))));};
function studioNew(raw){let d;try{d=b64uD(raw);}catch(e){openLand();note('Ce lien du Studio est incomplet. Recopiez le code en entier.');return;}
  if(!d||(d.pack&&d.pack!=='mariage')){openLand();note('Ce code ne concerne pas un mariage.');return;}
  const x=appIdx(),dup=d.sk&&x.events.find(e=>e.sk===d.sk);
  if(dup){enterApp(dup.id);setTimeout(()=>studioBack(dup),500);return;}
  const f={type:'mariage',names:(d.title||d.names||'').trim()||'Notre mariage',date:/^\d{4}-\d{2}-\d{2}$/.test(d.date||'')?d.date:'',city:d.city||'',guests:+d.guests||0,budget:+d.budget||0};
  createEvent(f,'couple');const y=appIdx(),ev=y.events.find(e=>e.id===y.cur);
  Object.assign(ev,{src:'studio',sk:d.sk||'',venue:d.venue||'',time:d.time||'',contact:d.contact||''});appSaveIdx(y);
  if(d.venue)S.base.venue=d.venue;if(d.time)S.base.time=d.time;if(d.contact)S.base.contact=d.contact;save();
  setTimeout(()=>studioBack(ev),500);}
function studioBack(ev){const code='AIME-RETOUR:'+b64uE({k:ev.id,sk:ev.sk||undefined,pack:'mariage',title:ev.names,date:ev.date,rsvp:ART_URL+'#'+rsvpAnchor()});
  let M=$('#ldMk');if(!M){renderLand();M=$('#ldMk');}
  M.innerHTML=`<div class="ld-mkin"><button type="button" class="x" data-ev="close" aria-label="Fermer">×</button><div class="ld-step"><span class="ld-n">Depuis AIME Studio</span><h3>Votre mariage est créé.</h3>
    <p class="hint">${esc(ev.names)}${ev.date?' · '+esc(fmtDate(new Date(ev.date+'T12:00:00'))):''}${ev.city?' · '+esc(ev.city):''}. Vous êtes les mariés : ce rôle est fixé.</p>
    <p class="hint">Pour relier vos supports, copiez ce code et collez-le dans le Studio.</p><textarea id="sbCode" readonly rows="3" style="width:100%;font:12px var(--mono);border-radius:10px;padding:10px;box-sizing:border-box">${esc(code)}</textarea>
    <div class="ld-nv"><button type="button" class="ld-btn" id="sbCopy">Copier le code</button><a class="ld-btn solid" href="${ECHOS_URL}" target="_blank" rel="noopener">Retour au Studio ↗</a></div></div>
    <div class="ld-evprev"><span class="ld-k">Mariage</span><b>${esc(ev.names)}</b><span>${ev.venue?esc(ev.venue)+' · ':''}${esc(ev.city||'')}</span><i>Vous : les mariés</i></div></div>`;
  M.classList.add('open');const b=$('#sbCopy');if(b)b.onclick=()=>copy(code,b);}
/* formulaire « Créer mon événement » (dans la fenêtre de la carte) */
const EVF={step:0,d:null};
function renderEvForm(){const M=$('#ldMk'),D=EVF.d,s=EVF.step;let body='';
  if(s===0)body=`<span class="ld-n">01 / 03</span><h3>Quel événement ?</h3><div class="ld-pk">${[['mariage','Mariage'],['seminaire','Séminaire']].map(([k,l])=>`<button type="button" data-evt="${k}" aria-pressed="${D.type===k}">${l}</button>`).join('')}</div>
    <label>${D.type==='seminaire'?'Nom de l’événement':'Vos prénoms'}<input id="evN" type="text" value="${esc(D.names)}" placeholder="${D.type==='seminaire'?'Séminaire Atelier Nord':'Camille & Samuel'}"></label>
    <p class="hint">Vous serez ${D.type==='seminaire'?'l’organisateur':'les mariés'} de cet événement : c’est votre rôle, il ne se change pas ensuite.</p>
    <details class="ld-sbin"><summary>Vous venez d’AIME Studio ? Collez votre code</summary><div style="display:flex;gap:8px;margin-top:8px"><input id="sbIn" type="text" placeholder="AIME-NEW:…" style="flex:1"><button type="button" class="ld-btn" data-ev="sb">Importer</button></div></details>`;
  if(s===1)body=`<span class="ld-n">02 / 03</span><h3>Quand et où ?</h3><label>Date<input id="evD" type="date" value="${esc(D.date)}"></label><label>Ville<input id="evC" type="text" value="${esc(D.city)}" placeholder="Paris"></label>`;
  if(s===2)body=`<span class="ld-n">03 / 03</span><h3>Les grandes lignes</h3><label>Nombre d’invités estimé<input id="evG" type="number" min="0" step="5" value="${D.guests||''}" placeholder="120"></label>
    <label>Budget global (€)<input id="evB" type="number" min="0" step="500" value="${D.budget||''}" placeholder="30000"></label><p class="hint">Des estimations suffisent : tout se précisera dans l’app.</p>`;
  const ok=s===0?!!(D.names||'').trim():s===1?!!D.date:true;
  M.innerHTML=`<div class="ld-mkin"><button type="button" class="x" data-ev="close" aria-label="Fermer">×</button><div class="ld-step">${body}
    <div class="ld-nv"><button type="button" class="ld-btn" data-ev="back" ${s?'':'disabled'}>Retour</button><button type="button" class="ld-btn solid" data-ev="next" ${ok?'':'disabled'}>${s===2?'Créer mon événement':'Continuer'}</button></div></div>
    <div class="ld-evprev"><span class="ld-k">${D.type==='seminaire'?'Séminaire':'Mariage'}</span><b>${esc(D.names||'Votre événement')}</b><span>${D.date?esc(fmtDate(new Date(D.date+'T12:00:00'))):'Date à choisir'}${D.city?' · '+esc(D.city):''}</span>
      <span>${D.guests?esc(String(D.guests))+' invités':''}${D.budget?' · '+eur(+D.budget):''}</span><i>Vous : ${D.type==='seminaire'?'organisateur':'les mariés'}</i></div></div>`;
  const f=M.querySelector('input');if(f)setTimeout(()=>f.focus(),30);}
function openEvForm(){const c=myCard();EVF.d={type:'mariage',names:'',date:'',city:(c&&c.city)||'',guests:'',budget:''};EVF.step=0;let M=$('#ldMk');if(!M){renderLand();M=$('#ldMk');}renderEvForm();M.classList.add('open');}
function evSync(){const D=EVF.d,g=id=>{const e=$('#'+id);return e?e.value:null;};[['evN','names'],['evD','date'],['evC','city'],['evG','guests'],['evB','budget']].forEach(([i,k])=>{const v=g(i);if(v!=null)D[k]=v;});}
document.addEventListener('click',ev=>{const t=ev.target;if(!t.closest||!t.closest('#ldMk'))return;const ty=t.closest('[data-evt]');if(ty){evSync();EVF.d.type=ty.dataset.evt;renderEvForm();return;}
  const b=t.closest('[data-ev]');if(!b)return;ev.stopPropagation();const k=b.dataset.ev;
  if(k==='close'){closeMk();return;}if(k==='sb'){const v=($('#sbIn').value||'').trim();if(!v){note('Collez le code donné par le Studio');return;}closeMk();studioNew(v);return;}if(k==='back'&&EVF.step>0){evSync();EVF.step--;renderEvForm();return;}
  if(k==='next'){evSync();if(EVF.step<2){EVF.step++;renderEvForm();}else{closeMk();createEvent(EVF.d,'couple');}}},true);
document.addEventListener('input',ev=>{if(!ev.target.closest||!ev.target.closest('#ldMk')||!EVF.d||!/^ev[A-Z]$/.test(ev.target.id||''))return;evSync();const nx=$('#ldMk [data-ev="next"]');if(nx)nx.disabled=EVF.step===0?!(EVF.d.names||'').trim():EVF.step===1?!EVF.d.date:false;
  const pv=$('#ldMk .ld-evprev b');if(pv&&ev.target.id==='evN')pv.textContent=EVF.d.names||'Votre événement';});
/* menu des événements (en-tête de l'app) */
function evMenuHTML(){const x=appIdx();return `<p class="eb">Mes événements</p>${x.events.map(e=>`<button type="button" data-evgo="${e.id}" aria-current="${e.id===x.cur}"><span><b>${esc(e.names)}</b><small>${esc(ROLE_L(e.role))}${e.date?' · '+esc(fmtDate(new Date(e.date+'T12:00:00'))):''}</small></span></button>`).join('')}
  <button type="button" data-evgo="new"><span><b>+ Nouvel événement</b><small>Vous en serez l’organisateur</small></span></button>
  <button type="button" data-evgo="demo"><span><b>Voir la démo</b><small>Camille & Samuel, tous les rôles</small></span></button>
  <button type="button" data-evgo="home"><span><b>Accueil AIME</b><small>Ma carte, le Studio</small></span></button>`;}
document.addEventListener('click',ev=>{const t=ev.target;const ch=t.closest('[data-evchip]');if(ch){ev.stopPropagation();const m=$('#pMenu');if(m.classList.contains('open')){closePersona();return;}m.innerHTML=evMenuHTML();m.classList.add('open');return;}
  const g=t.closest('[data-evgo]');if(!g)return;ev.stopPropagation();closePersona();const k=g.dataset.evgo;
  if(k==='new'){openLand();setTimeout(openEvForm,200);return;}if(k==='demo'){enterDemo();return;}if(k==='home'){openLand();return;}enterApp(k);},true);

document.addEventListener('click',ev=>{if(ev.target.closest('[data-ld-open]')){openLand();}});
/* =================== DÉMARRAGE =================== */
if(!isCouple()){const k=PER.k;PER=PERSONAS[0];setPersona(k,true);lastFig=figures();}else{renderAll();lastFig=figures();
setSec(mobile()?0:Math.max(0,Math.min(SECS.length-1,Math.round(window.scrollY/window.innerHeight)-HERO)));setHero(window.scrollY<window.innerHeight*HERO*0.5);}
let bootApp=false;try{bootApp=localStorage.getItem('aime-mode')==='app'&&!!appEv();}catch(e){}
window.addEventListener('hashchange',()=>{try{landFromHash();}catch(e){}});const hh=landFromHash();if(!hh&&!hashLock()&&bootApp)enterApp(appIdx().cur);else if(!hh&&!hashLock()){let seen=false;try{seen=!!localStorage.getItem(LAND_SEEN);}catch(e){}if(!seen&&VIS.owner)openLand();}
})();
</script>
