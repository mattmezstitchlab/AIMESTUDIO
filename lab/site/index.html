<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIME, le site</title>
<link rel="icon" href="data:,">
<meta name="description" content="AIME : l'orbe naît, devient un cube, et le cube s'ouvre sur vos outils.">
<style>
@font-face{font-family:"Cal Sans";font-weight:400 700;font-display:swap;src:url("/fonts/CalSans-latin.woff2") format("woff2")}
@font-face{font-family:"Inter Variable";font-weight:100 900;font-display:swap;src:url("/fonts/InterVariable-latin.woff2") format("woff2-variations")}
/* Une longue verticalité. Chapitre 1 : la naissance (orbe + 4 modes). Chapitre 2 : le cube s'ouvre et ses faces deviennent des outils vivants. */
:root{--desk:#0A0A0C;--ink:#EDEDF0;--soft:#9C9CA8;--line:#2B2B33;--card:#121216;--ui:"Inter Variable",Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--display:"Cal Sans","Inter Variable",Inter,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
 --conic:conic-gradient(#FB7185,#F59E0B,#7C5CFF,#22D3EE,#FB7185);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--desk);color:var(--ink);font:400 16px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.035)}}
.top{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));padding-top:calc(14px + env(safe-area-inset-top,0px))}
.top a{color:var(--ink);text-decoration:none;font:600 14px var(--ui)}
.top .mk{font:400 20px var(--display);letter-spacing:-.02em}
.top nav{display:flex;gap:8px}
.top nav a{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:rgba(10,10,12,.6);backdrop-filter:blur(10px)}

/* les 4 modes, pictos blancs : sous l'orbe au départ, puis rangés en haut */
.modes{position:fixed;z-index:21;left:50%;top:var(--my,70%);transform:translateX(-50%);display:flex;gap:6px;align-items:flex-start;transition:top .6s cubic-bezier(.2,.8,.2,1),gap .4s}
.modes button{display:grid;justify-items:center;gap:8px;background:none;border:0;padding:0;color:#fff;cursor:pointer;font:inherit}
.modes .ic{display:grid;place-items:center;width:52px;height:44px;border-radius:10px;transition:background .25s,transform .25s}
.modes svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.modes button:hover .ic,.modes button[aria-pressed=true] .ic{background:rgba(255,255,255,.12)}
.modes button:focus-visible .ic{outline:2px solid #fff;outline-offset:2px}
.modes button{min-width:76px}.modes.dock button{min-width:0}
.modes .lb{white-space:nowrap;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);transition:opacity .3s}
.modes.dock{top:calc(12px + env(safe-area-inset-top,0px));gap:2px}
.modes.dock .ic{width:42px;height:36px}.modes.dock svg{width:23px;height:23px}
.modes.dock .lb{position:absolute;opacity:0;pointer-events:none}

.story{position:relative;height:620vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(60% 60% at var(--gx,50%) 48%,rgba(124,92,255,.15),transparent 70%),radial-gradient(circle at 1px 1px,rgba(255,255,255,.045) 1px,transparent 0) 0 0/22px 22px,var(--desk)}
.hero{position:absolute;left:0;right:0;top:calc(13vh + env(safe-area-inset-top,0px));text-align:center;display:grid;gap:12px;padding:0 max(20px,env(safe-area-inset-left,0px));z-index:3}
.k{font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.t{margin:0;font:400 clamp(38px,5.4vw,80px)/.95 var(--display);letter-spacing:-.025em;text-wrap:balance}
.t em{font-style:normal;background:linear-gradient(90deg,#FB7185,#F59E0B,#7C5CFF,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite}
.orb{position:absolute;left:0;top:0;border-radius:50%;background:var(--conic);animation:hue 6s linear infinite,breathe 5s ease-in-out infinite;box-shadow:0 0 70px rgba(124,92,255,.55),0 0 160px rgba(34,211,238,.18);transform:translate(-50%,-50%);z-index:2}
.glow{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(closest-side,rgba(124,92,255,.32),rgba(124,92,255,0));transform:translate(-50%,-50%);pointer-events:none}
.scene{position:absolute;inset:0;perspective:1500px;z-index:2}
.cube{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;left:0;top:0;width:var(--c);height:var(--c);transform-origin:50% 50%;will-change:transform,opacity;opacity:0}
.face .sk{position:absolute;inset:0;border-radius:calc(var(--c)*.06);background:var(--conic);animation:hue 6s linear infinite;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);display:grid;place-items:center;overflow:hidden}
.face .sk i{position:absolute;inset:0;background:#000;opacity:0}
.face .sk svg{position:relative;width:38%;height:38%;fill:none;stroke:#fff;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
.face .cd{position:absolute;inset:0;border-radius:14px;background:var(--card);border:1px solid rgba(255,255,255,.09);display:grid;grid-template-rows:1fr auto;opacity:0;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.face .cd canvas{width:100%;height:100%;display:block}
.face .cd .tl{padding:0 calc(var(--c)*.07) calc(var(--c)*.065)}
.face .cd b{display:block;font:400 calc(var(--c)*.085)/1.1 var(--display);letter-spacing:-.01em}
.face .cd span{display:block;margin-top:4px;font-size:calc(var(--c)*.055);line-height:1.35;color:var(--soft)}
.face.hl .cd,.face:hover .cd{border-color:rgba(255,255,255,.28);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 50px rgba(124,92,255,.25)}
.face .cd .q{position:absolute;top:calc(var(--c)*.06);left:calc(var(--c)*.07);font:500 calc(var(--c)*.042) var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}

.tx{position:absolute;z-index:4;left:max(24px,6vw);top:50%;transform:translateY(-50%);width:min(32vw,470px);display:grid;gap:14px;transition:opacity .35s}
.tx .l{margin:0;color:#C9C9D2;font-size:clamp(16px,1.35vw,19px);max-width:42ch}
.hint{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);z-index:3;transition:opacity .4s}
.next{min-height:70vh;display:grid;place-items:center;text-align:center;padding:80px max(20px,env(safe-area-inset-left,0px));border-top:1px solid #17171C}
.next .in{display:grid;gap:16px;justify-items:center;max-width:640px}
.next p{margin:0;color:#C9C9D2}
.next .ln{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.next a{border-radius:10px;padding:12px 16px;font:600 15px var(--ui);text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.next a.p{background:var(--ink);color:var(--desk);border-color:var(--ink)}
@media(max-width:760px){
 .tx{left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:none;gap:10px}
 .tx .t{font-size:clamp(30px,8.4vw,40px)}
 .tx .l{font-size:15px}
 .modes.dock{top:calc(62px + env(safe-area-inset-top,0px))}
 .modes .ic{width:46px;height:42px}
 .modes button{min-width:70px}.modes .lb{font-size:10px;letter-spacing:.08em}
 .face .cd span{display:none}
}
@media(prefers-reduced-motion:reduce){.orb,.t em,.face .sk{animation:none}.modes{transition:none}}
</style>
</head>

<header class="top"><a class="mk" href="/">AIME<sup>®</sup></a><nav><a href="/lab/orb/">Lab</a><a href="/bureau/">Bureau</a></nav></header>

<main>
<section class="story" id="story" aria-label="Naissance et cube">

  <div class="glow" id="glow"></div>

  <div class="scene" id="scene"><div class="cube" id="cube"></div></div>

 </div>
</section>
<section class="next" aria-label="La suite">
 <div class="in"><span class="k">Chapitre suivant</span><h2 class="t">La grille universelle</h2><p>Puis la messagerie flottante, le tour du monde et les planètes de chaque métier.</p><div class="ln"><a class="p" href="/bureau/">Entrer dans le Bureau</a><a href="/lab/orb/naissance/">Revoir la naissance</a></div></div>
</section>
</main>
