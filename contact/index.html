<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parler d'un projet · AIME</title>
<meta name="description" content="Un site à créer, des supports, une idée à discuter : décrivez votre projet, AIME vous répond avec un devis.">
<meta name="theme-color" content="#0A0A0C">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<script>try{if(localStorage.getItem('aime-zero-calme')==='1'||matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('calme')}catch(e){if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('calme')}</script>
<link rel="preload" href="/fonts/CalSans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/coeur/charte.css">
<link rel="stylesheet" href="/dock/dock.css">
<style>
/* le formulaire « Parlons de votre projet », déménagé de l'accueil (docs/IDENTITE.md) : rien n'a changé dans ses champs ni dans son envoi */
/* contact */
.contact{position:relative;padding:clamp(90px,14vh,160px) 0 calc(120px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.contact .col{max-width:820px;text-align:left}
.contact .k{margin:0 0 16px;font:600 12.5px var(--ui);letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
.contact h1{margin:0;font:400 clamp(38px,6vw,76px)/1.02 var(--display);letter-spacing:-.025em;text-wrap:balance}
.contact .intro{margin:20px 0 0;max-width:600px;font-size:clamp(17px,1.6vw,20px);color:var(--soft)}
.formulaire{margin-top:clamp(28px,5vh,44px);display:grid;gap:22px}
.types{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.types legend{padding:0;margin-bottom:12px;font:600 14px var(--ui)}
.types label{position:relative;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;font-size:15px;cursor:pointer;transition:border-color .2s,background .2s}
.types input{position:absolute;opacity:0;width:1px;height:1px}
.types label:has(input:checked){border-color:var(--ink);background:var(--ink);color:var(--desk)}
.types label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:3px}
.grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.champ{display:grid;gap:7px;min-width:0}.champ.large{grid-column:1/-1}
.champ label{font:600 14px var(--ui)}
.champ input,.champ textarea{width:100%;font:400 16px/1.5 var(--ui);color:var(--ink);background:#131317;border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s}
.champ textarea{resize:vertical;min-height:150px}
.champ input:focus,.champ textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(237,237,240,.14)}
.champ [aria-invalid="true"]{border-color:#FB7185}
.err{margin:0;min-height:0;font-size:13.5px;color:#FDA4AF}.err:empty{display:none}
.aide,.note{margin:0;font-size:13px;color:var(--soft)}
.obl{color:#FDA4AF}
.formulaire input,.formulaire textarea{scroll-margin-top:120px}
.piege{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.accord{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--soft);cursor:pointer}
.accord input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--ink)}
.envoi{display:flex;flex-wrap:wrap;align-items:center;gap:16px}.envoi .bouton{margin:0;border:0;cursor:pointer}
.envoi .bouton[disabled]{opacity:.6;cursor:progress}
.etat{margin:0;font-size:15px}.etat.ok{color:#86EFAC}.etat.ko{color:#FDA4AF}
@media (max-width:620px){.grille{grid-template-columns:minmax(0,1fr)}.envoi .bouton{width:100%;justify-content:center}}
.contact{border-top:0;padding-top:clamp(110px,16vh,170px)}
</style>
</head>
<body>
<a class="evite" href="#c-prenom">Aller au formulaire</a>
<header class="barre"><a class="mk" href="/" aria-label="AIME, accueil">AIME<sup>®</sup></a></header>
<main id="contenu">
<section class="contact" id="contact" aria-labelledby="t-contact">
 <div class="col">
  <p class="k">Contact</p>
  <h1 id="t-contact">Parlons de votre projet.</h1>
  <p class="intro">Un site à créer, des supports, une idée à discuter : décrivez-la, je vous réponds avec un devis.</p>
   <form id="formContact" class="formulaire" novalidate>
   <fieldset class="types"><legend>Votre demande <span class="obl" aria-hidden="true">*</span></legend>
    <label><input type="radio" name="projet" value="site" required checked> Création de site</label>
    <label><input type="radio" name="projet" value="refonte"> Refonte ou évolution</label>
    <label><input type="radio" name="projet" value="supports"> Supports</label>
    <label><input type="radio" name="projet" value="projet"> Parler d'un projet</label>
    <label><input type="radio" name="projet" value="autre"> Autre</label>
   </fieldset>
   <div class="grille">
    <div class="champ"><label for="c-prenom">Prénom <span class="obl" aria-hidden="true">*</span></label><input id="c-prenom" name="prenom" autocomplete="given-name" maxlength="80" required aria-describedby="e-prenom"><p class="err" id="e-prenom"></p></div>
    <div class="champ"><label for="c-nom">Nom <span class="obl" aria-hidden="true">*</span></label><input id="c-nom" name="nom" autocomplete="family-name" maxlength="80" required aria-describedby="e-nom"><p class="err" id="e-nom"></p></div>
    <div class="champ"><label for="c-email">E-mail <span class="obl" aria-hidden="true">*</span></label><input id="c-email" name="email" type="email" autocomplete="email" maxlength="160" required aria-describedby="e-email"><p class="err" id="e-email"></p></div>
    <div class="champ"><label for="c-tel">Téléphone</label><input id="c-tel" name="tel" type="tel" autocomplete="tel" maxlength="30" aria-describedby="e-tel"><p class="err" id="e-tel"></p></div>
    <div class="champ large"><label for="c-adresse">Adresse</label><input id="c-adresse" name="adresse" autocomplete="street-address" maxlength="300" aria-describedby="e-adresse"><p class="err" id="e-adresse"></p></div>
    <div class="champ"><label for="c-livraison">Livraison souhaitée</label><input id="c-livraison" name="livraison" type="date" aria-describedby="e-livraison"><p class="err" id="e-livraison"></p></div>
    <div class="champ large"><label for="c-message">Votre projet <span class="obl" aria-hidden="true">*</span></label><textarea id="c-message" name="message" rows="6" minlength="20" maxlength="4000" required aria-describedby="a-message e-message"></textarea><p class="aide" id="a-message"><span id="compte">0</span> / 4 000 caractères</p><p class="err" id="e-message"></p></div>
   </div>
   <div class="piege" aria-hidden="true"><label for="c-site">Ne pas remplir</label><input id="c-site" name="site_web" tabindex="-1" autocomplete="off"></div>
   <label class="accord"><input type="checkbox" id="c-accord" name="consentement" required aria-describedby="e-consentement"> <span>J'accepte que ces informations servent uniquement à répondre à ma demande. Elles sont transmises par e-mail et ne sont pas conservées sur ce site.</span></label>
   <p class="err" id="e-consentement"></p>
   <div class="envoi"><button class="bouton" type="submit" id="c-envoyer">Envoyer ma demande <span aria-hidden="true">→</span></button><p class="etat" id="c-etat" role="status" aria-live="polite"></p></div>
   <p class="note"><span class="obl" aria-hidden="true">*</span> champ obligatoire</p>
  </form>
 </div>
 <div class="pied"><span>AIME® · Contact</span><button type="button" id="calme" aria-pressed="false">Réduire les animations</button></div>
</section>
</main>
<script src="/zero/contact.js"></script>
<script src="/dock/modele.js"></script>
<script src="/dock/dock.js"></script>
<script src="/dock/plus.js"></script>
<div id="dock-site"></div>
<script>(function(){var el=document.getElementById('dock-site');if(el&&window.AIMEDock&&window.AIMEDockVue){AIMEDockVue.poser(el,AIMEDock.composer({}),{mode:'page',id:'dock-site'});if(window.AIMEPlus)AIMEPlus.brancher(el);document.body.classList.add('avec-dock')}
 var H=document.documentElement,b=document.getElementById('calme');function lib(){var c=H.classList.contains('calme');b.setAttribute('aria-pressed',String(c));b.textContent=c?'Rétablir les animations':'Réduire les animations'}
 b.addEventListener('click',function(){H.classList.toggle('calme');try{localStorage.setItem('aime-zero-calme',H.classList.contains('calme')?'1':'0')}catch(_){}lib()});lib()})();</script>
</body>
</html>
