<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIME OS</title>
<meta name="description" content="AIME OS : toutes les apps AIME dans un seul bureau, une seule orbe, une seule recherche.">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="data:,">
<link rel="preload" href="/fonts/CalSans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/os/os.css">
<link rel="stylesheet" href="/dock/dock.css">
<link rel="stylesheet" href="/pointzero/pz.css">
<link rel="stylesheet" href="/compte/timbre.css">
<link rel="stylesheet" href="/orbe/pilote.css">
<link rel="stylesheet" href="/cube/vue3d.css">
</head>
<body class="os">
<a class="evite" href="#lanceur-q">Aller à la recherche</a>
<header class="barre-os">
 <button class="marque" type="button" id="accueilBtn" aria-label="AIME OS, revenir au bureau">AIME<sup>®</sup><span>OS</span></button>
 <span class="app-courante" id="appCourante" aria-live="polite"></span>
 <span class="barre-d">
  <button class="os-dock-orbe" type="button" id="orbeBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="orbePan" aria-label="L'orbe : suggestions"><span class="mini-orbe"></span></button>
  <button class="os-dock-app toutes" type="button" id="toutBtn" aria-haspopup="dialog" aria-label="Toutes les apps"><span class="ico"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="5" r="1.6"/><circle cx="10" cy="5" r="1.6"/><circle cx="15" cy="5" r="1.6"/><circle cx="5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15" cy="10" r="1.6"/><circle cx="5" cy="15" r="1.6"/><circle cx="10" cy="15" r="1.6"/><circle cx="15" cy="15" r="1.6"/></svg></span></button>
  <button class="cherche" type="button" id="chercheBtn" aria-haspopup="dialog" aria-label="Rechercher (Ctrl K)"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg><span>Rechercher</span><kbd>Ctrl K</kbd></button>
  <time class="heure" id="heure"></time>
 </span>
</header>

<main class="bureau" id="bureau" aria-label="Bureau">
 <canvas class="fond" id="fond" aria-hidden="true"></canvas>
 <section class="accueil" id="accueil" aria-labelledby="t-accueil">
  <h1 id="t-accueil"><span id="salut">Bonjour</span>.</h1>
  <p class="intention">Votre surface de travail. Vos projets sont dans le Dock, au +.</p>
  <div class="point-zero" id="pointZero"><div class="orbe-accueil" id="orbeAccueil" aria-hidden="true"></div></div>
  <form class="lanceur" id="lanceur" role="search"><label class="sr" for="lanceur-q">Que voulez-vous faire ?</label><input id="lanceur-q" placeholder="Que voulez-vous faire ?" autocomplete="off" spellcheck="false"><kbd>Ctrl K</kbd></form>
  <div class="actions" id="actionsRapides" aria-label="Actions rapides"></div>
  <section class="reprendre" id="reprendre" aria-labelledby="t-reprendre" hidden><h2 id="t-reprendre">Reprendre</h2><div class="cartes" id="cartes"></div></section>
 </section>
 <div class="fenetres" id="fenetres"></div>
</main>

<!-- la barre d'applications est remplacée par le Dock AIME (en bas) ; elle reste en coulisses pour les fenêtres (os/os.js), sans être montrée -->
<nav class="os-dock" id="dock" aria-label="Fenêtres ouvertes" hidden>
 <div class="os-dock-apps" id="dockApps"></div>
</nav>

<div class="voile" id="voile" hidden></div>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Rechercher dans AIME OS" hidden>
 <div class="palette-q"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg><input id="paletteQ" role="combobox" aria-expanded="true" aria-controls="paletteL" aria-autocomplete="list" placeholder="Une app, un projet, une action…" autocomplete="off" spellcheck="false"></div>
 <ul class="palette-l" id="paletteL" role="listbox" aria-label="Résultats"></ul>
 <p class="palette-aide"><kbd>↑</kbd><kbd>↓</kbd> choisir · <kbd>Entrée</kbd> ouvrir · <kbd>Échap</kbd> fermer</p>
</div>
<div class="tout" id="tout" role="dialog" aria-modal="true" aria-labelledby="t-tout" hidden>
 <div class="tout-t"><h2 id="t-tout">Toutes les apps</h2><button class="b-fermer" type="button" data-fermer aria-label="Fermer">×</button></div>
 <div class="tout-g" id="toutG"></div>
</div>
<div class="orbe-bulle" id="orbeBulle" role="status" hidden><span id="orbeBulleT"></span><button type="button" id="orbeBulleVoir">Voir</button><button type="button" id="orbeBulleNon">Plus tard</button></div>
<div class="orbe-pan" id="orbePan" role="dialog" aria-labelledby="t-orbe" hidden>
 <div><p class="k" id="t-orbe">L'orbe</p><p class="orbe-dit" id="orbeDit"></p><nav class="orbe-sugg" id="orbeSugg" aria-label="Suggestions"></nav><label class="orbe-pref"><span>L'orbe me propose</span><select id="orbePref"><option value="">comme réglé pour chaque site</option><option value="discrete">seulement quand je l'appelle</option><option value="attentive">quelque chose aux pauses</option><option value="active">ses suggestions aux pauses</option></select></label></div>
</div>
<p class="sr" id="annonce" role="status" aria-live="polite"></p>
<noscript><p class="ns">AIME OS a besoin de JavaScript. <a href="/bureau/espace/">Ouvrir Mon espace</a>.</p></noscript>

<script src="/nav/registre.js"></script>
<script src="/regie/donnees.js"></script>
<script src="/bureau/sources.js"></script>
<script src="/zero/orbe.js"></script>
<script src="/zero/formes.js"></script>
<script src="/pointzero/analyse.js"></script>
<script src="/pointzero/broderie.js"></script>
<script src="/pointzero/modes.js"></script>
<script src="/orbe/contexte.js"></script>
<script src="/orbe/pilote.js"></script>
<script src="/stitch/js/couleur.js"></script>
<script src="/stitch/js/conversion.js"></script>
<script src="/compte/timbre.js"></script>
<script src="/pointzero/pz.js"></script>
<script src="/cube/modele.js"></script>
<script src="/cube/stock.js"></script>
<script src="/cube/vue3d.js"></script>
<script src="/os/apps.js"></script>
<script src="/os/os.js"></script>
<script src="/dock/modele.js"></script>
<script src="/dock/dock.js"></script>
<script src="/dock/plus.js"></script>
<div id="dock-site"></div>
<script>/* le Dock et le + unique : « Vos projets sont dans le Dock » (docs/IDENTITE.md § 6) */(function(){var el=document.getElementById('dock-site');if(!el||!window.AIMEDock||!window.AIMEDockVue)return;AIMEDockVue.poser(el,AIMEDock.composer({}),{mode:'page',id:'dock-site'});if(window.AIMEPlus)AIMEPlus.brancher(el);document.body.classList.add('avec-dock')})();</script>
<!-- le dock montre le cube de la personne : ses faces posées en couleur -->
<script>if(window.AIMECubeStock)AIMECubeStock.qui().then(function(u){u=u||AIMECubeStock.demo();if(!u)return;AIMECubeVue.memo(AIMECubeStock.charger(u),u);var b=document.querySelector('#dockApps [data-app="cube"] .ico');if(b)b.innerHTML=AIMECubeVue.miniHTML()}).catch(function(){})</script>
</body>
</html>
