<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bureau AIME</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : un bureau d'ordinateur. Barre de menus en haut, Dock en bas, fenêtres au milieu, dossiers à droite, « Pour continuer » en haut à droite. Sombre, accents en dégradés violet-bleu, un seul thème. */
:root{
 --desk:#0B0B0D; --paper:#18181B; --win:#141416; --raise:#222227; --ink:#ECECEF; --soft:#9B9BA5; --line:#2A2A31; --glass:rgba(22,22,26,.72); --sel:#7C5CFF;
 --acc:#7C5CFF; --acc2:#3B82F6; --grad:linear-gradient(135deg,#7C5CFF,#3B82F6); --ok:#22C55E; --warn:#F5A524; --hot:#F43F5E;
 --ui:"Instrument Sans",Helvetica,Arial,sans-serif; --display:"Archivo","Arial Narrow",Helvetica,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
 color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 14px/1.4 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#desk{position:fixed;inset:0;background:
  radial-gradient(1100px 520px at 50% -8%,rgba(124,92,255,.42),transparent 62%),
  radial-gradient(800px 480px at 88% 18%,rgba(59,130,246,.22),transparent 60%),
  radial-gradient(700px 420px at 8% 92%,rgba(236,72,153,.12),transparent 60%),
  radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0) 0 0/22px 22px,
  linear-gradient(180deg,#151225 0%,#0B0B0D 62%)}
.wm{position:absolute;left:max(36px,env(safe-area-inset-left,0px));bottom:calc(110px + env(safe-area-inset-bottom,0px));font:900 clamp(60px,11vw,180px)/.8 var(--display);font-stretch:62%;letter-spacing:-.03em;text-transform:uppercase;color:rgba(255,255,255,.045);pointer-events:none}

/* barre de menus */
#menubar{position:fixed;inset:0 0 auto;z-index:9000;height:calc(30px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:4px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.06);color:var(--ink)}
#menubar button{border:0;background:none;padding:4px 9px;border-radius:5px;cursor:default;font:500 13px var(--ui);white-space:nowrap}
#menubar button:hover,#menubar button[aria-expanded=true]{background:rgba(255,255,255,.1)}
#menubar .logo{font:900 15px var(--display);letter-spacing:-.03em}
#menubar .logo sup{font-size:.5em}
#menubar .cur{font-weight:700}
#menubar .sp{flex:1}
#clock{font:500 12.5px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.menu{position:fixed;z-index:9500;min-width:230px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 24px 60px -12px rgba(0,0,0,.7);color:var(--ink)}
.menu button{display:flex;justify-content:space-between;gap:18px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px;font:500 13px var(--ui);cursor:default}
.menu button:hover{background:var(--acc);color:#fff}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu kbd{font:400 11.5px var(--mono);opacity:.6}

/* icônes du bureau */
#icons{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));z-index:5;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,96px);gap:6px 10px;height:calc(100% - 200px);direction:rtl}
.di{direction:ltr;width:92px;display:grid;justify-items:center;gap:4px;padding:6px 4px;border-radius:7px;border:0;background:none;cursor:default;text-align:center}
.di:hover{background:rgba(255,255,255,.06)}
.di.on{background:rgba(124,92,255,.22)}
.di span{color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.6);font:600 12px/1.2 var(--ui);max-width:88px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding:1px 4px;border-radius:4px}
.di.on span{background:var(--acc);color:#fff;text-shadow:none}
.ico-folder{width:56px;height:46px;display:block}

/* widget aujourd'hui */
#today{color:var(--ink);position:fixed;top:calc(48px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));z-index:4;width:250px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
#today .d{font:900 46px/.9 var(--display);font-stretch:70%;letter-spacing:-.02em}
#today .l{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
#today ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#today li{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px solid var(--line);padding-top:6px}
#today li b{font:600 13px var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#today li em{font:500 11.5px var(--mono);font-style:normal;white-space:nowrap;color:#C4B5FD;background:rgba(124,92,255,.16);border-radius:5px;padding:1px 6px}

/* pour continuer */
#next{position:fixed;z-index:8000;top:calc(44px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:300px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 24px 60px -18px rgba(0,0,0,.75);display:grid;gap:8px;color:var(--ink)}
#next header{display:flex;justify-content:space-between;align-items:center}
#next header b{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
#next header button{border:0;background:none;color:var(--soft);font-size:18px;line-height:1;padding:0 4px;cursor:default}
#next .ctx{font:700 14px var(--ui);display:flex;align-items:center;gap:8px}#next .ctx::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
#next .sg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 10px;cursor:default}
#next .sg:hover{border-color:var(--acc);background:#26233A}
#next .sg small{display:block;font:400 11.5px var(--ui);color:var(--soft)}
#next .sg .ai{width:30px;height:30px;flex:none}

/* fenêtres */
.win{position:fixed;z-index:100;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 30px 90px -20px rgba(0,0,0,.8);min-width:320px;min-height:220px;color:var(--ink)}
.win.focus{box-shadow:0 44px 120px -20px rgba(0,0,0,.9),0 0 0 1px rgba(124,92,255,.55)}
.win.max{border-radius:0}
.win[hidden]{display:none!important}
.tb{flex:none;height:38px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--win);border-bottom:1px solid var(--line);cursor:default}
.lights{display:flex;gap:7px}
.lights button{width:13px;height:13px;border-radius:50%;border:0;padding:0;cursor:default;display:grid;place-items:center;font-size:9px;font-weight:700;line-height:1;color:transparent;background:#FF5F57}
.lights button:nth-child(2){background:#FEBC2E}.lights button:nth-child(3){background:#28C840}
.win:not(.focus) .lights button{background:#3A3A40}
.tb:hover .lights button{color:rgba(0,0,0,.55)}
.tb .tt{flex:1;text-align:center;font:500 13px var(--ui);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:52px}
.win iframe{flex:1;border:0;width:100%;background:#111113}
.win .shield{position:absolute;inset:38px 0 0;display:none}
body.dragging .win .shield{display:block}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}
.loading{position:absolute;inset:38px 0 0;display:grid;place-items:center;font:500 12px var(--mono);color:var(--soft);pointer-events:none}

/* dock */
#dock{position:fixed;z-index:8500;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:6px;padding:7px 9px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.1);border-radius:22px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none;box-shadow:0 20px 60px -10px rgba(0,0,0,.7)}
#dock button{position:relative;flex:none;width:56px;height:56px;border:0;background:none;padding:0;cursor:default;transition:transform .15s}
#dock button:hover{transform:translateY(-6px) scale(1.08)}
#dock button.on::after{content:"";position:absolute;left:50%;bottom:-5px;width:4px;height:4px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 0 6px #fff}
#dock .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.14);margin:4px 3px}
#dock .tip{position:fixed;z-index:9600;background:#232328;color:var(--ink);border:1px solid var(--line);font:600 12px var(--ui);padding:5px 9px;border-radius:6px;pointer-events:none;white-space:nowrap}
.ai{display:block;width:56px;height:56px}

/* Dossiers (Finder) */
.fd{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
.fd aside{background:var(--win);border-right:1px solid var(--line);overflow:auto;padding:10px 8px;display:grid;align-content:start;gap:2px}
.fd aside h4{margin:10px 8px 4px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.fd aside button{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px;font:500 13px var(--ui);cursor:default;min-width:0}
.fd aside button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fd aside button em{font:400 11px var(--mono);font-style:normal;color:var(--soft)}
.fd aside button:hover{background:rgba(255,255,255,.05)}
.fd aside button.on{background:rgba(124,92,255,.2);color:#fff}
.fd aside button.on em{color:inherit;opacity:.7}
.fd aside button.drop{outline:2px dashed var(--acc)}
.fd aside .tw{padding-left:22px}
.fd main{display:flex;flex-direction:column;min-width:0;min-height:0}
.fd .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fd .crumbs{flex:1;font:600 13px var(--ui);display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.fd .crumbs button{border:0;background:none;padding:2px 4px;border-radius:4px;cursor:default;font:inherit}
.fd .crumbs button:hover{background:rgba(255,255,255,.06)}
.fd .crumbs i{color:var(--soft);font-style:normal}
.pill{border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 12px var(--ui);cursor:default;white-space:nowrap}
.pill:hover{border-color:var(--soft)}
.pill.dark{background:var(--grad);color:#fff;border-color:transparent}
.fd .grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));align-content:start;gap:8px}
.it{display:grid;justify-items:center;gap:5px;padding:8px 4px;border:0;background:none;border-radius:8px;cursor:default;text-align:center;min-width:0}
.it:hover{background:rgba(255,255,255,.05)}
.it.on{background:rgba(124,92,255,.2)}
.it b{font:600 12px/1.25 var(--ui);max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.it small{font:400 10.5px var(--mono);color:var(--soft)}
.it .doc{width:46px;height:58px;border:1px solid #3A3A42;border-radius:4px;background:linear-gradient(180deg,#26262C,#1C1C21);color:var(--ink);position:relative;display:grid;place-items:center;font:600 9px var(--mono);overflow:hidden}
.it .doc::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.it .doc.land{width:62px;height:44px}
.it .doc i{font-style:normal;padding:0 3px;text-align:center;line-height:1.15}
.it.drag{opacity:.4}
.fd .empty{grid-column:1/-1;padding:30px 10px;color:var(--soft);font-size:13.5px;text-align:center}
.fd .info{border-top:1px solid var(--line);padding:8px 12px;font:400 12px var(--ui);color:var(--soft);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.rn{font:600 12px var(--ui);background:var(--raise);color:var(--ink);border:1px solid var(--acc);border-radius:4px;padding:2px 4px;width:100%;text-align:center}


/* Moteurs */
.mo{flex:1;display:grid;grid-template-columns:210px minmax(0,1fr) minmax(0,1.1fr);min-height:0}
.mo-load{grid-column:1/-1;display:grid;place-items:center;color:var(--soft);font:500 13px var(--mono)}
.mo-f{background:var(--win);border-right:1px solid var(--line);overflow:auto;padding:12px 8px;display:grid;align-content:start;gap:2px}
.mo-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 4px 6px}
.mo-stats div{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px}
.mo-stats b{display:block;font:700 22px var(--ui);letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mo-stats span{font:500 11px var(--mono);color:var(--soft)}
.mo-f h4{margin:10px 8px 4px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.mo-f button{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:6px 8px;border-radius:7px;font:500 13px var(--ui);color:var(--ink);cursor:default}
.mo-f button i{width:9px;height:9px;border-radius:3px;flex:none}
.mo-f button span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mo-f button em{font:400 11px var(--mono);font-style:normal;color:var(--soft)}
.mo-f button:hover{background:rgba(255,255,255,.05)}.mo-f button.on{background:rgba(124,92,255,.2)}
.mo-l{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.mo-q{padding:10px;border-bottom:1px solid var(--line)}
.mo-q input{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--ink);font:500 13px var(--ui)}
.mo-q input:focus{outline:none;border-color:var(--acc)}
.mo-list{flex:1;overflow:auto}
.mo-it{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;color:var(--ink);cursor:default}
.mo-it:hover{background:rgba(255,255,255,.03)}.mo-it.on{background:#1E1C2B;box-shadow:inset 3px 0 0 var(--acc)}
.mo-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.mo-tx{display:grid;gap:3px;min-width:0}
.mo-tx b{font:600 14px var(--ui)}
.mo-tx small{color:var(--soft);font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mo-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.mo-meta code,.mo-src code{font:500 11px var(--mono);color:#C4B5FD}
.chip{font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--soft)}
.mo-none{padding:24px;color:var(--soft)}
.mo-d{overflow:auto;padding:22px;display:grid;align-content:start;gap:16px}
.mo-d .k{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.mo-d h3{margin:6px 0 6px;font:700 24px/1.15 var(--ui);letter-spacing:-.02em}
.mo-d header p{margin:0;color:var(--soft)}
.mo-io{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.mo-io>div:not(.mo-arr){background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px}
.mo-io p{margin:6px 0 0;font-size:13.5px}
.mo-arr{display:grid;place-items:center;color:var(--acc);font-size:20px}
.mo-ex{border-radius:14px;padding:16px;background:linear-gradient(#1A1726,#1A1726) padding-box,var(--grad) border-box;border:1px solid transparent}
.mo-ex p{margin:8px 0 0;font:500 15px/1.5 var(--ui)}
.mo-src{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.mo-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mo-res{margin:0;color:var(--soft);font-size:13px}
.mo-src ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.mo-src a.pill{text-decoration:none}
@media(max-width:1000px){.mo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mo-f{display:none}}
@media(max-width:760px){.mo{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}.mo-l{border-right:0;border-bottom:1px solid var(--line)}}

/* téléphone */
@media(max-width:760px){
 #today,#icons{display:none}
 .win{left:0!important;top:calc(30px + env(safe-area-inset-top,0px))!important;width:100%!important;height:calc(100% - 30px - 88px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))!important;border-radius:0;min-width:0}
 .rz{display:none}
 .tb .tt{margin-right:0}
 #dock{left:8px;right:8px;transform:none;justify-content:flex-start}
 #dock button{width:48px;height:48px}.ai{width:48px;height:48px}
 #next{left:10px;right:10px;width:auto;top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .fd{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.fd aside{display:flex;flex-wrap:nowrap;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;gap:4px}.fd aside h4{display:none}.fd aside button{flex:none;width:auto}.fd .info span+span{display:none}
 #menubar [data-menu=file],#menubar [data-menu=win]{display:none}
 .wm{font-size:64px}
}
@media(prefers-reduced-motion:reduce){#dock button{transition:none}}
</style>

<div id="desk" aria-hidden="true"><div class="wm">Le monde<br>AIME</div></div>

<nav id="menubar" aria-label="Barre de menus">
 <button class="logo" data-menu="aime" aria-haspopup="true" aria-expanded="false">AIME<sup>®</sup></button>
 <button class="cur" id="curApp" data-menu="app" aria-haspopup="true" aria-expanded="false">Bureau</button>
 <button data-menu="file" aria-haspopup="true" aria-expanded="false">Fichier</button>
 <button data-menu="win" aria-haspopup="true" aria-expanded="false">Fenêtre</button>
 <span class="sp"></span>
 <span id="clock" aria-live="off"></span>
</nav>

<section id="today" aria-label="Aujourd'hui"></section>
<div id="icons" role="list" aria-label="Bureau"></div>
<aside id="next" hidden aria-live="polite" aria-label="Pour continuer"></aside>
<div id="wins"></div>
<nav id="dock" aria-label="Dock"></nav>

<script>
(function(){
'use strict';
var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function get(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var SITE=/^https?:$/.test(location.protocol)&&!/(^|\.)(claude\.ai|claudeusercontent\.com|claude\.site|claude\.com|anthropic\.com)$/.test(location.hostname);
