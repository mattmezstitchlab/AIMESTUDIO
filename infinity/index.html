<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>AIME INFINITY</title>
<meta name="description" content="Quatre cases. Une action. Un monde plus grand.">
<meta name="theme-color" content="#0A0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
@font-face{font-family:"Cal Sans";font-weight:400 700;font-display:swap;src:url("/fonts/CalSans-latin.woff2") format("woff2")}
@font-face{font-family:"Inter Variable";font-weight:100 900;font-display:swap;src:url("/fonts/InterVariable-latin.woff2") format("woff2-variations")}
/* même langage que la landing AIME : fond nuit, trame de points, halo violet, dégradé conique de l'orbe */
:root{--desk:#0A0A0C;--ink:#EDEDF0;--soft:#9C9CA8;--line:#2B2B33;--card:#121216;--ui:"Inter Variable",Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--display:"Cal Sans","Inter Variable",Inter,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
 --conic:conic-gradient(#FB7185,#F59E0B,#7C5CFF,#22D3EE,#FB7185);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font:400 16px/1.5 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(60% 50% at 50% 46%,rgba(124,92,255,.14),transparent 70%),radial-gradient(circle at 1px 1px,rgba(255,255,255,.045) 1px,transparent 0) 0 0/22px 22px,var(--desk);touch-action:none;user-select:none;-webkit-user-select:none}
@keyframes hue{to{filter:hue-rotate(360deg)}}
canvas{position:fixed;inset:0;display:block;touch-action:none;outline:none}
.k{font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
button{font:inherit;color:inherit}
.top{position:fixed;inset:0 0 auto;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none}
.top>*{pointer-events:auto}
.mk{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.mk b{font:400 20px var(--display);letter-spacing:-.02em}
.mk i{font-style:normal;font:500 10.5px var(--mono);letter-spacing:.2em;background:linear-gradient(90deg,#FB7185,#F59E0B,#7C5CFF,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite}
.niv{justify-self:center;display:grid;justify-items:center;gap:0;background:none;border:0;padding:4px 10px;border-radius:12px;cursor:pointer}
.niv b{font:400 26px/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.niv span{font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.niv:focus-visible,.ic:focus-visible,.go:focus-visible,.sheet button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ic{justify-self:end;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:rgba(10,10,12,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}
.ic svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bas{position:fixed;inset:auto 0 0;z-index:5;display:grid;justify-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.bas>*{pointer-events:auto}
.ligne{display:flex;align-items:center;gap:14px}
.budget{display:flex;gap:7px;align-items:center;min-height:16px}
.budget i{width:11px;height:11px;border-radius:50%;background:var(--conic);animation:hue 6s linear infinite;box-shadow:0 0 12px rgba(124,92,255,.5);transition:transform .3s,opacity .3s}
.budget i.vide{background:none;border:1.5px solid #4A4A55;box-shadow:none;animation:none}
.budget i.peu{width:9px;height:9px}
.score{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);text-align:center;font-variant-numeric:tabular-nums}
.astuce{position:fixed;left:0;right:0;z-index:4;text-align:center;font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);pointer-events:none;transition:opacity .6s}
.msg{position:fixed;left:50%;z-index:6;transform:translate(-50%,0);display:grid;justify-items:center;gap:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;width:min(92vw,420px)}
.msg.on{opacity:1}.msg.on .go{pointer-events:auto}
.msg h2{margin:0;font:400 clamp(26px,7vw,38px)/1.08 var(--display);letter-spacing:-.005em;word-spacing:.08em;text-wrap:balance}
.msg p{margin:0;color:var(--soft);font-size:15px}
.go{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 22px;background:#fff;color:#0A0A0C;font:600 15px var(--ui);cursor:pointer;box-shadow:0 10px 40px rgba(124,92,255,.35)}
.go.sec{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.carte{background:rgba(18,18,22,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:12px;justify-items:center;pointer-events:auto}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px;width:100%}
.chiffres div{display:grid;gap:2px}.chiffres b{font:400 24px var(--display)}.chiffres span{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.sheet{position:fixed;z-index:7;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(92vw,340px);background:rgba(18,18,22,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;padding:8px;display:grid;gap:2px}
.sheet button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font:500 15px var(--ui)}
.sheet button:hover{background:rgba(255,255,255,.06)}
.sheet small{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.sheet p{margin:6px 14px 10px;color:var(--soft);font-size:13.5px;line-height:1.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.mk i,.budget i{animation:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Grille de jeu. Touchez une case, ou utilisez les flèches puis Entrée." role="application"></canvas>
<header class="top">
 <a class="mk" href="/aime/" aria-label="AIME, retour au site"><b>AIME</b><i>INFINITY</i></a>
 <button class="niv" id="niv" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><b id="nivT">2 × 2</b><span id="nivS">4 cases</span></button>
 <button class="ic" id="son" type="button" aria-pressed="false" aria-label="Son"><svg viewBox="0 0 24 24" id="sonI"></svg></button>
</header>
<p class="astuce" id="astuce" hidden>Touchez une case</p>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<footer class="bas">
 <div class="ligne"><div class="budget" id="budget" role="img" aria-label=""></div><button class="ic" id="refaire" type="button" aria-label="Recommencer cette grille" style="width:34px;height:34px;border-radius:10px"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button></div>
 <div class="score" id="score"></div>
</footer>
<div class="sheet" id="menu" hidden>
 <button type="button" data-m="defi">Défi du jour <small id="defiS">5 actions</small></button>
 <button type="button" data-m="partie">Progression <small id="partieS"></small></button>
 <button type="button" data-m="neuf">Repartir de 2 × 2 <small>record conservé</small></button>
 <p>Touchez une case : elle explose et son onde fait exploser les cases qu'elle atteint. Les anneaux disent jusqu'où va l'onde, un trait traverse toute la ligne. Videz la grille avec le moins d'actions possible.</p>
</div>
<p class="sr" id="sr" aria-live="polite"></p>
<script src="/infinity/js/regles.js"></script>
<script src="/infinity/js/niveaux.js"></script>
<script src="/infinity/js/partie.js"></script>
<script src="/infinity/js/son.js"></script>
<script src="/infinity/js/rendu.js"></script>
<script src="/infinity/js/jeu.js"></script>
</body>
</html>
