<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIME · Orbes vivantes</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font:14px Inter,system-ui,sans-serif;background:#050509;color:#f5f3ff}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #a8cfff;outline-offset:3px}
#field{position:fixed;inset:0;overflow:hidden;touch-action:none;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px;cursor:grab}#field.drag{cursor:grabbing}#plane{position:absolute;transform-origin:0 0}.orb{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:none;color:#f5f5ff;width:120px;padding:10px}.ring{height:62px;width:62px;border:2px solid var(--color);border-radius:50%;box-shadow:0 0 18px color-mix(in srgb,var(--color),transparent 55%),inset 0 0 12px color-mix(in srgb,var(--color),transparent 80%);position:relative}.ring:after{content:"";inset:8px;position:absolute;border-radius:50%;border:2px dashed var(--color);opacity:.65}.orb[data-motion="tourne"] .ring:after{animation:spin 12s linear infinite}.orb[data-motion="pulse"] .ring{animation:pulse 2.5s ease-in-out infinite}.orb[data-motion="recherche"] .ring:after{animation:spin 4s linear infinite}.orb[data-motion="relie"] .ring:after{animation:spin 13s linear infinite reverse}.orb:hover .ring,.orb:focus-visible .ring{box-shadow:0 0 32px var(--color)}.orb small{font-size:11px;color:#9499ad}.orb label{font-size:12px;pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.12)}}header{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:20px;padding:20px;background:linear-gradient(#050509,#05050900)}header strong{letter-spacing:.15em}header input{margin-left:auto;width:min(340px,45vw);background:#161821;border:1px solid #343748;border-radius:12px;padding:11px 14px;color:white}.controls{position:fixed;z-index:2;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:#181b28ed;border:1px solid #373a4a;border-radius:16px;padding:8px}.controls button,.primary,.secondary{padding:10px 13px;border:1px solid #414455;border-radius:10px;background:#272a3a;color:white}.primary{background:#7768df}.meta{position:fixed;z-index:1;left:18px;bottom:22px;color:#a6afc4}aside{position:fixed;z-index:5;right:0;top:0;bottom:0;width:min(450px,100vw);overflow:auto;background:#0f121c;padding:26px;box-shadow:-12px 0 70px #000a;border-left:1px solid #393c50}aside[hidden]{display:none}aside h1{margin:22px 0 10px;font-size:28px}aside p{color:#aab1c5;line-height:1.5}aside .top{display:flex;align-items:center;justify-content:space-between}.input{display:block;width:100%;padding:12px;margin:12px 0;background:#1a1e2c;color:white;border:1px solid #454a5b;border-radius:10px}textarea.input{min-height:210px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row input{min-width:0}.pads{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:24px 0}.pads button{border:1px solid #696278;color:white;background:#292c39;border-radius:8px;padding:12px 0}.pads button.on{background:#b49efa;color:#111}.hint{color:#a1c9af;font-size:12px}.list{display:flex;flex-wrap:wrap;gap:7px}.list button{font-size:11px}@media(prefers-reduced-motion:reduce){.orb *, .orb .ring:after{animation:none!important}}@media(max-width:650px){header{flex-wrap:wrap;padding:12px}header input{width:100%;margin:0}.meta{bottom:85px;font-size:11px}}
</style></head><body><main id="field" aria-label="Grille infinie AIME"><div id="plane"></div></main><header><div><strong>AIME ◯ STUDIO</strong><div style="color:#9ca6ba;font-size:11px">ORBE ATLAS · EXPÉRIENCE</div></div><input id="find" type="search" aria-label="Rechercher une capacité" placeholder="Une intention, un outil, un métier…"></header><div class="meta" id="count"></div><nav class="controls" aria-label="Explorer"><button id="plus" aria-label="Zoomer">＋</button><button id="minus" aria-label="Dézoomer">−</button><button id="reset">Centrer</button><button id="catalog">Liste</button></nav><aside id="side" hidden aria-label="Atelier"><div class="top"><strong id="category"></strong><button class="secondary" id="exit">Fermer ×</button></div><h1 id="title"></h1><p id="description"></p><div id="workspace"></div><div class="hint" aria-live="polite" id="message"></div></aside>
<script>
const F=[["Création","#81dec8","vague","Notes,Texte,Dessin,Images,Vidéo,Mosaïque,Broderie,Mini-site,Présentation,Publication"],["Temps","#efbe83","tourne","Agenda,Chronologie,Programme,Échéances,Rendez-vous,Tâches,Réservation,Itinéraire,Événement,Liste"],["Communication","#88bff5","relie","Messages,Invitations,Contacts,Formulaire,Newsletter,Annonce,Réseau,Traduction,Retour,Partage"],["Musique","#b69cff","pulse","Séquenceur,Partition,Gamme,Tempo,Accords,Improvisation,Sons,Playlist,Enregistrement,SLÂME"],["Documents","#bbc5fb","construit","Document,Contrat,Devis,Facture,Attestation,PDF,Signature,Archive,Modèle,Dossier"],["Analyse","#f2a4c0","recherche","Tableau,Statistiques,Budget,Comparaison,Recherche,Conformité,Vérification,Données,Diagnostic,Rapport"],["Accessibilité","#93e6bb","vague","Contacteur,Balayage,Sous-titres,Apprentissage,Exercice,Écoute,Guidage,Communication adaptée,Lecture,Profil"],["Relations","#f2b392","relie","Personnes,Relations,Équipe,Collaborer,Prestataires,Ressources,Lieux,Communauté,Dépendances,RIPPLE"]];
const tools=F.flatMap((f,g)=>f[3].split(",").map((name,i)=>({id:g+"-"+i,name,group:f[0],color:f[1],motion:f[2],x:(i%5)*155+(g%2)*65,y:Math.floor(i/5)*150+g*375})));
const ready={Notes:"notes",Texte:"notes",Document:"notes",Agenda:"agenda",Chronologie:"agenda",Tâches:"todo",Liste:"todo",Séquenceur:"music",Tempo:"music"};
const $=s=>document.querySelector(s),plane=$("#plane"),field=$("#field"),side=$("#side"),work=$("#workspace"),msg=$("#message");
let tx=innerWidth/2-370,ty=innerHeight/2-90,scale=.85,query="",pointer=null,audioTimer=null;
const memory=id=>"aime-orbe-atlas:"+id;
const load=(id,fallback)=>{try{return JSON.parse(localStorage.getItem(memory(id)))??fallback}catch{return fallback}};
const store=(id,value)=>{localStorage.setItem(memory(id),JSON.stringify(value));msg.textContent="Enregistré dans ce navigateur."};
const html=(s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const file=(name,value,type)=>{const url=URL.createObjectURL(new Blob([value],{type})),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function draw(){plane.style.transform="translate("+tx+"px,"+ty+"px) scale("+scale+")";plane.replaceChildren();let matches=0;for(const t of tools){if(query&&!((t.name+" "+t.group).toLowerCase().includes(query)))continue;matches++;let x=tx+t.x*scale,y=ty+t.y*scale;if(x < -140||y < -140||x > innerWidth+140||y > innerHeight+140)continue;const b=document.createElement("button");b.className="orb";b.style.left=t.x+"px";b.style.top=t.y+"px";b.style.setProperty("--color",t.color);b.dataset.motion=t.motion;b.innerHTML='<span class="ring"></span><label>'+html(t.name)+'</label><small>'+html(t.group)+'</small>';b.setAttribute("aria-label",t.group+" : "+t.name);b.onclick=()=>open(t);plane.append(b)}$("#count").textContent=matches+" orbes exploratoires · "+plane.children.length+" visibles · "+Math.round(scale*100)+" %"}
function open(t){closeAudio();side.hidden=false;$("#category").textContent=t.group;$("#title").textContent=t.name;$("#description").textContent=ready[t.name]?"Atelier fonctionnel · enregistrement local.":"Capacité recensée, atelier non développé à ce stade.";msg.textContent="";work.replaceChildren();switch(ready[t.name]){case"notes":return notes(t);case"agenda":return agenda(t);case"todo":return todo(t);case"music":return music(t);default:work.innerHTML='<p>Aucune fonctionnalité simulée. Ce module est une entrée du référentiel à concevoir.</p>'}}
function notes(t){const e=document.createElement("textarea");e.className="input";e.placeholder="Votre texte…";e.value=load(t.id,"");const a=document.createElement("div");a.className="actions";a.innerHTML='<button class="primary">Enregistrer</button><button class="secondary">Exporter .txt</button>';a.children[0].onclick=()=>store(t.id,e.value);a.children[1].onclick=()=>file(t.name+".txt",e.value,"text/plain");work.append(e,a)}
function agenda(t){let items=load(t.id,[]);work.innerHTML='<input class="input" id="eventname" placeholder="Nom de l’événement"><input class="input" id="eventtime" type="time" value="14:00"><div class="actions"><button class="primary" id="add">Ajouter</button><button class="secondary" id="export">Exporter JSON</button></div><div id="events"></div>';const render=()=>{const el=$("#events");el.replaceChildren();items.sort((a,b)=>a.time.localeCompare(b.time)).forEach((event,i)=>{const row=document.createElement("div");row.className="row";const name=document.createElement("span");name.textContent=event.time+" · "+event.name;const remove=document.createElement("button");remove.className="secondary";remove.textContent="×";remove.onclick=()=>{items.splice(i,1);store(t.id,items);render()};row.append(name,remove);el.append(row)})};$("#add").onclick=()=>{const name=$("#eventname").value.trim(),time=$("#eventtime").value;if(!name||!time)return;items.push({name,time});store(t.id,items);$("#eventname").value="";render()};$("#export").onclick=()=>file("agenda.json",JSON.stringify(items,null,2),"application/json");render()}
function todo(t){const items=load(t.id,[]);work.innerHTML='<input class="input" id="todoName" placeholder="Nouvelle tâche"><button class="primary" id="addTodo">Ajouter</button><div id="items"></div>';const render=()=>{$("#items").replaceChildren();items.forEach(x=>{const l=document.createElement("label");l.className="row";const c=document.createElement("input");c.type="checkbox";c.checked=x.done;c.onchange=()=>{x.done=c.checked;store(t.id,items)};const text=document.createElement("span");text.textContent=x.text;l.append(c,text);$("#items").append(l)})};$("#addTodo").onclick=()=>{const v=$("#todoName").value.trim();if(v){items.push({text:v,done:false});$("#todoName").value="";store(t.id,items);render()}};render()}
function closeAudio(){clearInterval(audioTimer);audioTimer=null}
function music(t){const seq=load(t.id,{bpm:100,steps:[true,false,true,false,true,false,true,false]});work.innerHTML='<label>Tempo <input id="bpm" type="number" class="input" min="40" max="240" value="'+seq.bpm+'"></label><div class="pads" id="pads"></div><div class="actions"><button class="primary" id="play">Lecture</button><button class="secondary" id="stop">Stop</button><button class="secondary" id="save">Enregistrer</button><button class="secondary" id="export">JSON</button></div>';const pads=$("#pads");seq.steps.forEach((v,i)=>{const b=document.createElement("button");b.textContent=i+1;b.className=v?"on":"";b.setAttribute("aria-pressed",v);b.onclick=()=>{seq.steps[i]=!seq.steps[i];b.classList.toggle("on",seq.steps[i]);b.setAttribute("aria-pressed",seq.steps[i])};pads.append(b)});let ac=null,i=0;const tick=()=>{[...pads.children].forEach((b,j)=>b.style.outline=i===j?"2px solid white":"");if(seq.steps[i]){ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.frequency.value=[261.6,293.7,329.6,349.2,392,440,493.9,523.2][i];g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.15,now+.02);g.gain.exponentialRampToValueAtTime(.001,now+.19);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+.2)}i=(i+1)%8};$("#bpm").onchange=e=>{seq.bpm=Math.min(240,Math.max(40,Number(e.target.value)||100));closeAudio()};$("#play").onclick=()=>{closeAudio();tick();audioTimer=setInterval(tick,60000/seq.bpm/2)};$("#stop").onclick=closeAudio;$("#save").onclick=()=>store(t.id,seq);$("#export").onclick=()=>file("sequence.json",JSON.stringify(seq,null,2),"application/json")}
function close(){closeAudio();side.hidden=true}
$("#exit").onclick=close;
$("#find").oninput=e=>{query=e.target.value.trim().toLowerCase();draw()};
function changeZoom(next,x=innerWidth/2,y=innerHeight/2){next=Math.max(.25,Math.min(2.2,next));let k=next/scale;tx=x-(x-tx)*k;ty=y-(y-ty)*k;scale=next;draw()}
$("#plus").onclick=()=>changeZoom(scale*1.25);$("#minus").onclick=()=>changeZoom(scale/1.25);$("#reset").onclick=()=>{scale=.85;tx=innerWidth/2-370;ty=innerHeight/2-90;draw()};
$("#catalog").onclick=()=>{closeAudio();side.hidden=false;$("#category").textContent="INDEX";$("#title").textContent="Capacités";$("#description").textContent="Alternative navigable à la grille.";work.replaceChildren();const list=document.createElement("div");list.className="list";tools.filter(t=>((t.name+" "+t.group).toLowerCase().includes(query))).forEach(t=>{const b=document.createElement("button");b.className="secondary";b.textContent=t.group+" / "+t.name;b.onclick=()=>open(t);list.append(b)});work.append(list)};
field.addEventListener("pointerdown",e=>{if(e.target.closest(".orb"))return;pointer={x:e.clientX,y:e.clientY,tx,ty};field.setPointerCapture(e.pointerId);field.classList.add("drag")});field.addEventListener("pointermove",e=>{if(!pointer)return;tx=pointer.tx+e.clientX-pointer.x;ty=pointer.ty+e.clientY-pointer.y;draw()});field.addEventListener("pointerup",()=>{pointer=null;field.classList.remove("drag")});field.addEventListener("wheel",e=>{e.preventDefault();changeZoom(scale*(e.deltaY<0?1.12:1/1.12),e.clientX,e.clientY)},{passive:false});addEventListener("keydown",e=>{if(e.key==="Escape")close()});addEventListener("resize",draw);draw();
</script></body></html>
