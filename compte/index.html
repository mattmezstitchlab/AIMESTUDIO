<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · AIME</title>
<link rel="stylesheet" href="/compte/style.css">
<main><a href="/bureau/">← Bureau AIME</a><h1>Votre compte AIME</h1>
<p>Recevez un lien de connexion à usage unique. Aucun mot de passe à retenir.</p>
<form id="connexion"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"><button>Recevoir mon lien</button></form>
<section id="session" hidden><p>Connecté : <span id="identite"></span></p><button id="deconnexion">Se déconnecter</button></section>
<p id="etat" role="status" aria-live="polite"></p>
<p>La connexion ne synchronise pas encore vos projets : ils restent dans ce navigateur.</p></main>
<script src="/compte/auth.js" defer></script></html>
